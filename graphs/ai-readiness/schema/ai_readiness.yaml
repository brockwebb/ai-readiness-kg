id: https://github.com/brockwebb/ai-readiness-kg/graphs/ai-readiness/schema
name: ai_readiness
title: the AI-readiness corpus graph (ai-readiness-kg on the kit)
description: >-
  ai-readiness-kg's corpus-derived layer on the kit: one Document per dixie catalog entry the kit
  admits, and the definitions, concepts, constructs, instruments, measures, claims, standards,
  frameworks, practices, tools and platforms its extractions asserted, each re-grounded in the
  text it was extracted from and carrying its original provenance. The assessment layer (criteria,
  indicators, observations, findings, actions) stays in ai-readiness-kg and reads this graph by
  doc_id.
version: 0.1.0
license: MIT

prefixes:
  ai_readiness: https://github.com/brockwebb/ai-readiness-kg/graphs/ai-readiness/
  squiddy: https://github.com/brockwebb/squiddy/schema/core/
  linkml: https://w3id.org/linkml/
  cito: http://purl.org/spar/cito/
  fabio: http://purl.org/spar/fabio/
  prov: http://www.w3.org/ns/prov#
default_prefix: ai_readiness
default_range: string

imports:
  - linkml:types
  # `init` rewrites this line for the graph it is writing: relative when the graph lives
  # inside the kit checkout (what graphs/biblio and graphs/library carry), absolute
  # otherwise, because a checkout-relative import cannot resolve from a graph that lives
  # anywhere else (K-001 Part B finding).
  - /Users/brock/GitHub/squiddy/squiddy/schema/core

slots:
  text:
    description: The located text, verbatim from the parsed intermediate.

