# graphs/ai-readiness/graph.yaml: THE ONE FILE (squiddy K-001 Part B) for ai-readiness-kg's corpus graph on the kit.
#
# squiddy SQ-019 (cc_tasks/2026-10-21_SQ-019_ai_readiness_kg_onto_the_kit.md), under DN-049 R-208, R-209 and R-212.
# A graph that existed before the kit joins it by ADMISSION: its dixie catalog is projected into the kit's manifest
# (the `dixie` intake source), its extracted items enter through `squiddy extract ingest` re-grounded with zero model
# calls (squiddy `tools/l002_adopt.py`, the `airkg` mapping), and its assessment layer stays in ai-readiness-kg, which
# reads this graph by `Document.doc_id` (R-209). SQ-022 (R-210 as amended) gave it its own Neo4j database, `ai-readiness`,
# loaded by ledger replay and proved by the parity gate; the old `seldon-ai-readiness-kg` keeps its nodes and Seldon's.
#
# GENERATED IN TWO PARTS. Everything down to `domain.airkg` is written by hand (squiddy
# docs/evidence/sq019/ai_readiness_graph_head.yaml, kept verbatim); `domain.airkg_schema` and `classes:` are transcribed
# from ai-readiness-kg/kg/schema.yaml by squiddy tools/sq019_transcribe_schema.py, a source line on every class and slot.
# SQ-022 (cc_tasks/2026-10-22_SQ-022_..._consumer_repointed.md) keeps this head at squiddy
# docs/evidence/sq022/ai_readiness_graph_head.yaml: `version` 0.2.0 for R-217's `span_raw_equal` slot (DN-049 ADDENDUM
# 01; an added optional slot, a minor version), and Part B's own database (below, `serve`).
#
# `scope.topic` is ai-readiness-kg/README.md lines 3-5 VERBATIM: the graph's own statement of what it answers. The
# operator has stated no separate scope for it on the kit; this is the nearest record in his project.
# `extract.enabled: true` because `squiddy extract ingest` requires it (extract_daemon, HV-008); nothing runs
# extraction in SQ-019, the factory's extract valve stays closed, and no maintenance job is registered for this graph.
# `extract.text_reader`: the items' spans are offsets into ai-readiness-kg's `doc_text`, read by `text_reader.py`.
spec_version: 1
name: ai_readiness
prefix: ai_readiness
title: the AI-readiness corpus graph (ai-readiness-kg on the kit)
description: >-
  ai-readiness-kg's corpus-derived layer on the kit: one Document per dixie catalog entry the kit admits, and the
  definitions, concepts, constructs, instruments, measures, claims, standards, frameworks, practices, tools and
  platforms its extractions asserted, each re-grounded in the text it was extracted from and carrying its original
  provenance. The assessment layer (criteria, indicators, observations, findings, actions) stays in ai-readiness-kg
  and reads this graph by doc_id.
version: 0.2.0
namespace: https://github.com/brockwebb/ai-readiness-kg/graphs/ai-readiness/
# The kit's core schema at its canonical checkout, as arnold-evidence's schema imports it. Left to `init`, the import is
# the absolute path of whichever kit checkout ran it, and SQ-019 ran in a worktree that is removed after its merge.
core_schema: /Users/brock/GitHub/squiddy/squiddy/schema/core
scope:
  topic: >-
    A knowledge graph that serves as the validity layer under the FSS AI readiness survey and the accompanying
    definitions work. It answers, with citations a stranger can verify:
store: ledger
serve:
  # SQ-022 Part B (DN-049 R-210 as amended): the graph's own database, by the kit's rule (DI-004: one database per
  # graph; DI-005: never `seldon-*`). Neo4j names allow letters, digits, dots and dashes, not underscores, so the name
  # is the graph directory's and not `ai_readiness`. The export is still cut by every release.
  backend: neo4j
  database: ai-readiness
  # X-001 item 19 (squiddy.serve.concept_edge): this graph's concept edge is the source graph's `mentions`,
  # (Document)-[:MENTIONS]->(Concept), which reaches a Concept INWARD; the base schema's Mentions runs the other way
  concept_edge: {class: Mentions, direction: in}
  text_fields:
    Document: [title]
    Definition: [term, verbatim_text]
    Concept: [name, description]
    Construct: [name, description]
    Instrument: [name]
    Measure: [text]
    Claim: [claim_text]
    Standard: [name]
    Framework: [name]
    Practice: [text]
    Tool: [name]
    Platform: [name]
intake:
  - source: dixie
    manifest: /Users/brock/GitHub/ai-readiness-kg/corpus/manifest.json
assess:
  criterion: local_file_present
write:
  shared_classes: []
  primary_class_by_kind:
    document: Document
    # this graph declares `Standard` as an extracted item type and has no `standard` manifest kind (squiddy init: a
    # spec removes a default kind with null)
    standard: null
# DN-034 R-158: private. The held texts are ai-readiness-kg's own corpus files, which that repository keeps out of
# version control and does not publish, and dixie records no licence for any of them; so a public graph would be a
# graph that may publish texts nobody has a licence record for (conformance item 33). Private means nothing leaves
# through the kit; whether this graph is published is the operator's decision (touchpoint 2), once licences are recorded.
visibility: private
extract:
  enabled: true
  text_reader: text_reader.py
domain:
  airkg:
    repo: /Users/brock/GitHub/ai-readiness-kg
    # ai-readiness-kg's own interpreter: `doc_text` is called in it, so the text a span is re-read from is made by the
    # same reader (pypdf 6.7.0 for a PDF) that made the text the item was extracted from.
    python: /opt/anaconda3/bin/python
    # SQ-019 Part B step 3: stop before ingest when edges with no span of their own exceed this share of selected edges
    edge_without_span_max_share: 0.01
  # ---- generated by squiddy tools/sq019_transcribe_schema.py from the source schema below ----
  airkg_schema:
    class_of:
      Document: Document
      Definition: Definition
      Concept: Concept
      Construct: Construct
      Instrument: Instrument
      Measure: Measure
      Claim: Claim
      Standard: Standard
      Framework: Framework
      Practice: Practice
      Tool: Tool
      Platform: Platform
      defines: Defines
      mentions: Mentions
      asserts: Asserts
      about: About
      operationalizes: Operationalizes
      operationalized_by: OperationalizedBy
      measures: Measures
      grounds: Grounds
      extends: Extends
      conflicts_with: ConflictsWith
      cites: Cites
      builds_on: BuildsOn
      implements: Implements
      uses_measure: UsesMeasure
      has_component: HasComponent
      subtype_of: SubtypeOf
      precedes: Precedes
      recommends: Recommends
      supported_by: SupportedBy
      implemented_by: ImplementedBy
      consumes: Consumes
      applies_to: AppliesTo
      targets: Targets
      supersedes: Supersedes
    source_schema: /Users/brock/GitHub/ai-readiness-kg/kg/schema.yaml
    source_schema_sha256: 240a3d60f039c4a3ecd1fe3e3e9488be98b77461bd223936ba9b09f7b8380093
    source_schema_version: 0.4.0
    assessment_node_types:
    - Action
    - AssessmentConstruct
    - AssessmentCriterion
    - AssessmentIndicator
    - AssessmentTool
    - Finding
    - MeasurementSpec
    - Observation
    - Precondition
    assessment_edge_types:
    - DECOMPOSES_INTO
    - EVIDENCED_BY
    - EVIDENCED_BY_INTERNAL
    - MEASURED_BY
    - OBSERVED_ON
    - REMEDIATES
    - REQUIRES
    - RULED_BY
    - SUPPORTS

