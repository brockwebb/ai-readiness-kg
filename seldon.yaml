# ---------------------------------------------------------------- the standing dispatcher
#
# `seldon dispatch once|status|lease reap`, from the Seldon repo
# (`docs/design/2026-09-15_standing_dispatcher.md` there). Design note:
# docs/design/2026-09-15_DN-006_standing_dispatcher.md, decisions 1 to 7, 9 and 10.
#
# What it does: a registered ResearchTask whose gate is clean is claimed and launched from a
# schedule instead of waiting for a person to paste a dispatch line. Only tasks whose file
# carries `**Spend:**`, `**Network:**` and `**Framework layer served` are candidates at all, so
# installing the job changes the behaviour of nothing already queued.
dispatch:

  # THE KILL SWITCH. **True since 2026-09-16**, set by
  # `cc_tasks/2026-09-16_cadence_and_enable.md` decision 3 after that task's gate passed.
  #
  # While it is true, **the operator does not hand-dispatch** (DN-006 decision 10). The
  # dispatcher cannot see a session it did not launch except through c7's clean-tree check, so
  # a hand-dispatched session and a dispatched one in the same checkout is the batch-identity
  # class (DD-019) in the one place the design cannot guard — and the guard is therefore the
  # rule, not a mechanism.
  #
  # To stop the world without editing this file: `touch .seldon/DISPATCH_STOP`. The appearance
  # is recorded once on the log, and every pass halts until the file is removed.
  #
  # Read on EVERY pass, never cached. A bool, not a string: a truthy "false" is refused.
  enabled: true

  # The branch a pass may dispatch on. Any other branch fails c7, together with a dirty tree.
  branch: main

  # THE STANDING BAND, as a REFERENCE and never a copied number (DN-006 §5). This is the same
  # value the preemptive spend guard enforces (DD-022, `kg/spend.py`); a second copy here would
  # drift silently the first time the operator moved the cap and nothing would say so.
  # `tests/test_dispatch_config.py` asserts the resolved value equals what `kg/spend.py` reads.
  standing_band_ref: controls.yaml#spend.daily_tokens

  # **NO MEASURED BASIS** (DN-006 §5, stated there and repeated here because this is the file
  # an operator changes it in). A pass is a local graph read at zero spend, so the cost of
  # polling often is near nothing and the cost of polling rarely is latency — but which value
  # is right is not known. After one week of `dispatch_launched` events, dispatch latency
  # (registration `created_at` to launch) is measurable and this is set from it. Until then it
  # is a declared starting value and says so.
  poll_interval_s: 300

  # What a dispatched session may do without being asked. `bypassPermissions` is the CLI's
  # non-interactive mode (claude 2.1.272: --permission-mode acceptEdits|auto|bypassPermissions|
  # manual|dontAsk|plan); a headless session in any prompting mode blocks forever on the first
  # tool call, having consumed a claim and produced nothing.
  #
  # DN-006 decision 5 asks for this to be DERIVED from how this repo already runs `claude -p`
  # unattended. It cannot be: the only unattended invocation here is
  # `kg/extraction/model_stub.py`, which passes `--allowed-tools ""` from a hermetic empty cwd
  # — no tools at all, deliberately, so a JSON-only call cannot narrate. That is evidence this
  # repository has never run a tool-executing headless session, so there was nothing to derive
  # and the value comes from the CLI's own interface. Recorded in DN-006's ADDENDUM_01.
  #
  # It is HERE and not only in the plist, per decision 5: the one setting that decides what an
  # unattended session may do to this checkout belongs in the file an operator reads to answer
  # that question.
  permission_mode: bypassPermissions

  # The kill file, the burn's own idiom (DD-004) rather than a third mechanism. Present =
  # every pass stops, and the appearance is recorded once on the log, not once per poll.
  stop_file: .seldon/DISPATCH_STOP

  # One instance, by flock, with an identified holder. Reaped only by the operator and only
  # when the holder PID is gone — never by age (DD-022's orphan rule).
  lease_file: .seldon/dispatch.lock

  # `logs/dispatch/<stem>.log`, one per dispatched task, with `EXIT=` appended. Gitignored:
  # a dispatched session's transcript is a local artifact; what ships is the RESULT it wrote.
  log_dir: logs/dispatch

  # THE FINISH SIGNAL (cc_tasks/2026-09-17_dispatcher_notifies.md decision 1). A shell command the
  # dispatcher runs once per finished task — after `dispatch_finished`, and after the walk to
  # `blocked` when the finish was not ok. Prior art: cron's MAILTO, systemd's OnSuccess=/
  # OnFailure=; the runner owns the notification and this line names the channel.
  #
  # The outcome arrives in the ENVIRONMENT, never substituted into this text: SELDON_NOTIFY_TASK_ID,
  # _TASK_NAME, _OK (true/false), _OUTCOME (ok/blocked), _RESULT_PATH, _LOG_PATH, _WALL_SECONDS.
  # The body goes to osascript as an argument (`on run argv`), so a task name with a quote in it
  # is data and not AppleScript.
  #
  # A failing, missing or hung notifier is one `dispatch_notify_failed` event and alters nothing
  # else. To push to a phone instead, swap the string, e.g. with ntfy.sh:
  #   notify: curl -fsS -d "$SELDON_NOTIFY_TASK_NAME: $SELDON_NOTIFY_OUTCOME" https://ntfy.sh/<topic>
  # That is a network send and is deliberately NOT the default: the dispatcher's own network is
  # local.
  notify: >-
    osascript -e 'on run argv' -e 'display notification (item 1 of argv) with title "Seldon"'
    -e 'end run' "$SELDON_NOTIFY_TASK_NAME — $SELDON_NOTIFY_OUTCOME"

  # Seconds before a notifier is killed as hung. A banner or a push returns in well under one; the
  # value is Seldon's default (NOTIFY_TIMEOUT_S_DEFAULT), written here so an operator sees it.
  notify_timeout_s: 30

  # ------------------------------------------------------------------------------ cadence
  #
  # DN-006 decision 8: **a schedule produces a task; it does not bypass the queue.** When a
  # period is due and no instance for it exists on disk, the pass renders the template,
  # registers it through `seldon cc register`'s own code path, commits it, and the task then
  # flows through decisions 2 to 5 exactly like a hand-written one. There is no second set of
  # criteria, no second claim and no second log, because what a schedule produces here is a
  # task file — and a task file already has an evaluator.
  #
  # The rule vocabulary is CLOSED. `monthly_first_weekday` is the only rule DD-060 asks for and
  # the only one implemented; a second rule type is a code change with a test, not a string
  # somebody types here. An unreadable rule refuses at config load, because a rule that failed
  # at 00:00 on the first Monday would fail unattended and at the only moment it mattered.
  cadence:

    - name: scan_cycle

      # DD-060: "monthly, from cycle 3, first Monday UTC", and only after the full frame
      # validated — which cycle 3 did and cycle 4 measured. `at_utc` is quoted so YAML does not
      # read it as a sexagesimal number.
      rule:
        monthly_first_weekday: monday
        at_utc: "00:00"

      # The instance is rendered from this file, which is a real task file with the three
      # dispatch headers, an immutability line, a gate and a RESULT — not a stub somebody has
      # to finish. Its body is cycle 4's shape (`cc_tasks/2026-09-10_scan_run_4.md` and its
      # RESULT), and it says in its own decisions block what it will NOT do: move the report's
      # snapshot, the site's published Results, or the abstract. That is a DN-004 decision and
      # it stays with the Desktop OODA.
      template: cc_tasks/templates/scan_cycle.md

      # Instances land beside every other task file: a cadence instance is an ordinary task and
      # is read, globbed and superseded like one.
      instances_dir: cc_tasks

      # The cycle identifier the rendered task runs under — `scan_<UTC date>`, the convention
      # every payload path, Result suffix and `refuse_clobber` key already follows. Here rather
      # than compiled into Seldon: the cadence is generic, the naming convention is this
      # project's (~/GitHub/CLAUDE.md §2).
      cycle_name_format: "scan_{date}"

      # THE FIRST PERIOD THIS SCHEDULE MAY SERVE, and it is why nothing is due at ship.
      #
      # September 2026's first Monday was the 7th; this schedule was installed on the 16th,
      # and September has already been measured — cycle 4 ran on 2026-09-10 as
      # `scan_2026-09-10`, hand-dispatched. Without a start boundary the first clean-tree pass
      # would find September due with no *cadence instance* on disk and create a second
      # measurement of a month that already has one. `catchup` does not cover this: the
      # offending period is not an earlier one, it is the current one.
      #
      # Prior art: Airflow's `start_date`, which exists for exactly this condition. October is
      # the first period the standing cadence owns, and cycle 5 is its first instance — due
      # 2026-10-05T00:00Z, the first Monday of October UTC.
      start_period: "2026-10"

      # Written back by the dispatcher after it creates an instance, for a reader. **It is not
      # the guard** — the guard is the instance FILE, globbed by period — so clearing this line
      # by hand cannot cause a second cycle to be created for a month that already has one.
      # Empty at ship: nothing is due before October, and this task created nothing.
      last_instance: ""
