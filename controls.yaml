# Operational switches. External systems (Wintermute control panel)
# flip these by writing this file. This file is the entire interface.
schema_version: "0.2"   # 0.2 (2026-08-26, task preemptive_spend_guard): append-only `spend:` block
forage: off
extract: off
budgets:
  forage_daily_docs: 25
  extract_daily_docs: 10

# Preemptive shared spend guard (kg/spend.py, DD-022). Read at call time, never cached.
# Per-run ceilings are NOT here — they are declared on state/spend_ledger.jsonl by the
# runner from the task file's stated ceiling, so the ceiling and the spend that hit it
# sit in one auditable place.
spend:
  # Standing Max daily band: the control plane's declared cap on the `extraction`
  # circuit (~/.wintermute control_plane declared_caps, read 2026-08-27:
  # daily_tokens 55,000,000 / weekly 880,000,000). Recorded in the task RESULT.
  #
  # 2026-08-27: temporarily raised to 75,000,000 for task cc_tasks/2026-08-27_pilot_finish.md
  # (operator decision, §1) and reverted here at that task's close. The raise was scoped to
  # the task; the standing band is unchanged.
  daily_tokens: 55_000_000
  call_class_floors:
    cleanup: 36000        # DD-019 measurement, Haiku one-item
    extraction: 111000    # 2026-08-21 pilot-era floor
    judge: 36000
    # Chunked extraction (task 2026-08-27_chunked_pilot §5). One call carries ONE chunk, not
    # a whole document, so the whole-document floor over-reserves by ~8x and would refuse a
    # correctly-sized run. Arithmetic: prompt template 2,448 tok + chunk cap 1,500 + overlap
    # cap 100 = 4,048 input; cache-creation is of the same order on a non-resumed call; the
    # whole-document arm returned ~8x its input in output, so 4,048 x 2 + 8,000 output rounds
    # to 20,000. The floor governs only the first calls of a run — `_estimate` switches to
    # the run's own measured mean as soon as there are settles.
    extraction_chunk: 20000
