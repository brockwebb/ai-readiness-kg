# Operational switches. External systems (Wintermute control panel)
# flip these by writing this file. This file is the entire interface.
schema_version: "0.3"   # 0.2 (2026-08-26, task preemptive_spend_guard): append-only `spend:` block
                        # 0.3 (2026-08-29, task biblio_cron): append-only `jobs:` block
forage: off
extract: off
budgets:
  forage_daily_docs: 25
  extract_daily_docs: 10

# Preemptive shared spend guard (kg/spend.py, DD-022). Read at call time, never cached.
# Per-run ceilings are NOT here — they are declared on state/spend_ledger.jsonl by the
# runner from the task file's stated ceiling, so the ceiling and the spend that hit it
# sit in one auditable place.
spend:
  # Standing Max daily band: the control plane's declared cap on the `extraction`
  # circuit (~/.wintermute control_plane declared_caps, read 2026-08-27:
  # daily_tokens 55,000,000 / weekly 880,000,000). Recorded in the task RESULT.
  #
  # 2026-08-27: temporarily raised to 75,000,000 for task cc_tasks/2026-08-27_pilot_finish.md
  # (operator decision, §1) and reverted here at that task's close. The raise was scoped to
  # the task; the standing band is unchanged.
  daily_tokens: 55_000_000
  call_class_floors:
    cleanup: 36000        # DD-019 measurement, Haiku one-item
    extraction: 111000    # 2026-08-21 pilot-era floor
    judge: 36000
    # Chunked extraction (task 2026-08-27_chunked_pilot §5). One call carries ONE chunk, not
    # a whole document, so the whole-document floor over-reserves by ~8x and would refuse a
    # correctly-sized run. Arithmetic: prompt template 2,448 tok + chunk cap 1,500 + overlap
    # cap 100 = 4,048 input; cache-creation is of the same order on a non-resumed call; the
    # whole-document arm returned ~8x its input in output, so 4,048 x 2 + 8,000 output rounds
    # to 20,000. The floor governs only the first calls of a run — `_estimate` switches to
    # the run's own measured mean as soon as there are settles.
    extraction_chunk: 20000
  # Reservation age past which a reserve with a dead owner PID is reapable
  # (`python -m kg.spend release-orphans`, task 2026-08-27_chunked_pilot ADDENDUM-02).
  # 600s = 1.8x the chunked pilot's MEASURED median call duration of 334s, so a live call
  # is never in reap range on age; the PID-liveness test is the binding condition either
  # way — age alone never qualifies a reservation.
  orphan_reservation_age_seconds: 600
  # Empty-failure back-off (task 2026-09-02_spend_guard_exit1_and_state_merge, defect 1).
  # A `claude -p` exit != 0 with NOTHING on stdout or stderr (`empty_failure`, classified in
  # kg/extraction/model_stub.py) has produced no output that could have been billed —
  # observed 2026-09-02 03:01Z as the Max usage window closed: 7 reservations settled at the
  # estimate (140,000 tokens) for zero output, and the driver stopped. The stub now RELEASES
  # the reservation, sleeps the next delay below, and retries; after `max_retries` it settles
  # at the estimate and fails exactly as before, so the driver's systemic-failure rule still
  # counts it. The schedule's last delay repeats if the cap exceeds its length. Bound on
  # being wrong (a server-side charge under-booked): max_retries x the call-class estimate.
  empty_failure_backoff_seconds: [60, 300, 900]
  empty_failure_max_retries: 3

# Scheduled metadata jobs (task 2026-08-29_biblio_cron). NOTHING here may spend against the
# model budget: the units below are timers over metadata/projection work only, and
# scripts/jobs/biblio_resume_job.py fails nonzero if the spend ledger changes under it. A
# model-spending job would need an operator-declared ceiling in its own unit; none exists.
jobs:
  biblio_resume:
    # 02:30 local, which is 06:30 UTC on EDT. Chosen to sit well clear of the OpenAlex
    # daily-quota reset, and the reset time is MEASURED, not assumed: on 2026-08-29 at
    # 17:20 UTC the provider answered 429 with Retry-After 24138s, i.e. a reset at ~00:02
    # UTC — a UTC midnight boundary. 06:30 UTC is ~6.5h past it, so a run that was refused
    # last night meets a fresh quota rather than the tail of the old one.
    # Recorded here because the plist's numeric fields cannot carry the reason.
    hour: 2
    minute: 30
    # Log-bomb guard. 2000 matches MAX_ERR_CHARS in scripts/t1_build_index.py — the bound
    # already set on this project after one Docling exception embedded a whole PDF page
    # dict and wrote ~230,000 lines. Same threat, same number; a second, different figure
    # for the same hazard would be a drift source.
    log_max_line_chars: 2000
    # Per-run byte cap. A normal run is ~400 lines x ~120 chars ~= 50 KB, so 2 MiB is ~40x
    # headroom for an unusually chatty night while still bounding a runaway to a file a
    # human can open. The line cap does not imply this one: a flood of ordinary lines is
    # the other half of the same denial of service.
    log_max_run_bytes: 2097152
    log_retention_days: 30
