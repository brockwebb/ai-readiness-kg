- id: CQ-27
  category: instrument_coverage
  question: Which Instruments measure an uncertainty-related Concept AND belong to a Framework that is
    an AI-readiness assessment?
  cypher_raw: "MATCH (i:Instrument)-[:MEASURES]->(c:Concept)\nWHERE toLower(trim(c.name)) CONTAINS 'uncertain'\n\
    \   OR toLower(trim(c.name)) CONTAINS 'margin of error'\n   OR toLower(trim(c.name)) CONTAINS 'confidence'\n\
    \   OR toLower(trim(c.name)) CONTAINS 'reliability'\n   OR toLower(trim(c.name)) CONTAINS 'suppression'\n\
    MATCH (f:Framework)-[:HAS_COMPONENT|USES_MEASURE|IMPLEMENTED_BY]-(i)\nWHERE toLower(coalesce(f.name,\
    \ '')) CONTAINS 'readiness'\n   OR toLower(coalesce(f.name, '')) CONTAINS 'maturity'\n   OR EXISTS\
    \ { MATCH (f)-[:ABOUT]->(fc:Concept)\n               WHERE toLower(trim(fc.name)) CONTAINS 'ai readiness'\n\
    \                  OR toLower(trim(fc.name)) CONTAINS 'ai-ready' }\nRETURN i.name AS instrument, f.name\
    \ AS framework, c.name AS concept,\n       i.doc_id AS doc_id, i.grounding_span AS span\nORDER BY\
    \ instrument\n"
  collapse_on: instrument
  expected_shape:
    columns:
    - instrument
    - framework
    - concept
    - doc_id
    - span
    min_rows: 0
    max_rows: 300
  pass_criterion: 'AN EMPTY ANSWER IS THE INFORMATIVE ONE and is scored `yes`: the claim under test is
    that NO AI-readiness assessment instrument measures uncertainty legibility, so an empty result is
    the evidence the claim needs, provided the query''s two legs are both live — i.e. CQ-09 returns rows
    (instruments measuring uncertainty exist) and at least one Framework in the graph matches the readiness/maturity
    leg. If either leg is empty, the answer is `no`: the question was not testable and nothing was learned.
    A non-empty answer falsifies the re-scoped claim and is also `yes`.'
  judge_notes: Registered by Issue cfe9eaf7. The first harness RESULT quoted CQ-09's empty answer as the
    graph supporting 'G1 is the sharpest gap'; RESULT-02 of 2026-09-04_extract_g1eval_17_and_rerun withdrew
    that support when CQ-09 returned Comunikos (Eurostat) and GRADE. Those are uncertainty-COMMUNICATION
    research instruments, not readiness assessments, so the claim survives only re-scoped — and CQ v1
    cannot test the re-scoped version, because no v1 question joins an Instrument to the kind of Framework
    that owns it. This does.
