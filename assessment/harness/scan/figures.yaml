# Status and verdict fills. One hue per class, each used once, so the legend is the only
# thing to read. `error` and `unobservable` are deliberately not `fail`'s colour: a refusal
# is not a product failure, and a reader who has to consult a legend to see that will not.
colours:
  pass: "#059669"
  fail: "#d97706"
  not_applicable: "#94a3b8"
  error: "#64748b"
  empty: "#e2e8f0"
  no_surface: "#c4b5fd"
  control: "#0f172a"
  measured: "#059669"
  harness_built: "#3b82f6"
  specified: "#94a3b8"
  candidate: "#a78bfa"
  interval: "#94a3b8"
  axis: "#cbd5e1"
  # F5 only: the earlier cycle is drawn muted so the current one reads as the foreground.
  prior: "#94a3b8"
  prior_interval: "#e2e8f0"
  rule_changed: "#b45309"

# Criterion order for column and row grouping. Fixed, never sorted by any count: reordering
# a Bertin matrix by score is a ranking, and ranking agencies is forbidden.
criteria: [A, B, C, D, E, F, G]

# The three snapshots of F4, in time order: label, the Result name suffix each status count
# is registered under, and the commit whose bytes the counts were read from.
snapshots:
  - {label: "2026-09-06 11:57:50Z", suffix: "2026-09-06", commit: "51d2526",
     note: "KG freeze — no harness"}
  - {label: "2026-09-07 02:54:35Z", suffix: "after_review", commit: "72cdec6",
     note: "after the 16-rule conformance review"}
  - {label: "2026-09-07 11:38:29Z", suffix: "2026-09-07", commit: "52ec048",
     note: "after the scan-run write-back"}

statuses: [measured, harness_built, specified]
verdicts: [pass, fail, not_applicable, error]
