# Every number `figures.py` uses. The module carries none of its own: the same rule the
# collectors live under (tests/test_scan_harness.py::test_no_collector_hides_a_constant,
# extended to figures.py by tests/test_scan_figures.py), for the same reason — a constant
# inside a renderer cannot be swept, cannot be versioned, and cannot be pointed at.
#
# Geometry is in user units of the SVG viewBox; the figures scale to their container.

# `cycle`, `cycle_suffix`, `out_dir` and `matrix_json` USED to live here and now do not.
# They are derived by `figures.config()` from `params.cycle.name` — the same single source
# `run.py`, `publish.py` and `scan_report.py` read. A cycle name in two files is two
# definitions of "which cycle", and the stale one is the one that draws last week's numbers
# under this week's heading. What stays here is layout, colour and the snapshot list.
framework_json: framework/ai_readiness_framework.json

# The cycle whose figures a `cycle_over_cycle` comparison is drawn AGAINST (F5). A prior
# cycle, so it is a fact about the past and not derivable from today's params.
compare_to:
  cycle: scan_2026-09-07
  suffix: "2026-09-07"
  label: "cycle 1 · 2026-09-07"
  # Legs whose RULE changed between the two cycles. F5 marks these so a reader cannot read a
  # difference as a change in the host: the instrument moved.
  rule_changed:
    A1: "v2 → v3"
    A3: "v3 → v4"

# Per-cycle overrides of `compare_to`. A RE-JUDGED cycle is drawn against the cycle it derives
# from — the same evidence under the old rules and the new — so its comparison is fixed by what
# it is, not by which cycle ran last. `note` is printed on the figure: a reader who sees two
# dots must be told that the second one moved because the RULE moved and nothing was re-fetched.
compare_to_by_cycle:
  scan_2026-09-07b_rj1:
    cycle: scan_2026-09-07b
    suffix: "2026-09-07b"
    label: "cycle 2 · 2026-09-07b, as judged then"
    note: "re-judged under v4 from stored observations, no re-fetch"
    rule_changed:
      A10: "v2 → v3"
      A8: "v2 → v3"
  scan_2026-09-07_rj1:
    cycle: scan_2026-09-07
    suffix: "2026-09-07"
    label: "cycle 1 · 2026-09-07, as judged then"
    note: "re-judged under v4 from stored observations, no re-fetch"
    rule_changed:
      A10: "v2 → v3"
      A8: "v2 → v3"

# The rate axis. `ticks` is the ONLY numeric text in a figure that is not a Result or a
# matrix count, and the gate checks the rendered ticks against exactly this list.
rate_axis:
  ticks: [0.0, 0.25, 0.5, 0.75, 1.0]
  tick_decimals: 2

