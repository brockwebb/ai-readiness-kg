# Every number `figures.py` uses. The module carries none of its own: the same rule the
# collectors live under (tests/test_scan_harness.py::test_no_collector_hides_a_constant,
# extended to figures.py by tests/test_scan_figures.py), for the same reason — a constant
# inside a renderer cannot be swept, cannot be versioned, and cannot be pointed at.
#
# Geometry is in user units of the SVG viewBox; the figures scale to their container.

cycle: scan_2026-09-07
# The date every cycle-suffixed Result name ends with (DD-056). Sliced out of `cycle` it
# would be a magic -10 in the renderer, which is the thing figures.yaml exists to prevent.
cycle_suffix: "2026-09-07"
out_dir: assessment/harness/scan/figures/scan_2026-09-07
framework_json: framework/ai_readiness_framework.json
matrix_json: state/scan_matrix_2026-09-07.json

# The rate axis. `ticks` is the ONLY numeric text in a figure that is not a Result or a
# matrix count, and the gate checks the rendered ticks against exactly this list.
rate_axis:
  ticks: [0.0, 0.25, 0.5, 0.75, 1.0]
  tick_decimals: 2

canvas:
  width: 900
  font: 12
  font_small: 10
  stroke: 1

f1:
  label_w: 150
  plot_w: 460
  top: 34
  row_h: 21
  group_gap: 14
  bottom: 34
  dot_r: 4
  interval_w: 5
  text_dy: 4
  frac_dx: 14
  ci_dx: 62
  control_size: 8
  control_gap: 6
  tick_len: 4
  tick_label_dy: 15
  group_label_dy: 10

f2:
  cell: 14
  gap: 2
  label_w: 260
  head_h: 78
  group_gap: 5
  bottom: 12
  label_rotate: -60
  header_dy: 8
  cell_radius: 2
  text_dy: 3

f3:
  label_w: 150
  bar_w: 300
  code_gap: 12
  top: 30
  row_h: 30
  bottom: 12
  bar_h: 18
  seg_text_dy: 13
  label_dy: 13

f4:
  label_w: 210
  bar_w: 430
  top: 30
  row_h: 46
  bottom: 12
  bar_h: 20
  seg_text_dy: 14
  label_dy: 12
  sub_dy: 26

# Status and verdict fills. One hue per class, each used once, so the legend is the only
# thing to read. `error` and `unobservable` are deliberately not `fail`'s colour: a refusal
# is not a product failure, and a reader who has to consult a legend to see that will not.
colours:
  pass: "#059669"
  fail: "#d97706"
  not_applicable: "#94a3b8"
  error: "#64748b"
  empty: "#e2e8f0"
  no_surface: "#c4b5fd"
  control: "#0f172a"
  measured: "#059669"
  harness_built: "#3b82f6"
  specified: "#94a3b8"
  candidate: "#a78bfa"
  interval: "#94a3b8"
  axis: "#cbd5e1"

# Criterion order for column and row grouping. Fixed, never sorted by any count: reordering
# a Bertin matrix by score is a ranking, and ranking agencies is forbidden.
criteria: [A, B, C, D, E, F, G]

# The three snapshots of F4, in time order: label, the Result name suffix each status count
# is registered under, and the commit whose bytes the counts were read from.
snapshots:
  - {label: "2026-09-06 11:57:50Z", suffix: "2026-09-06", commit: "51d2526",
     note: "KG freeze — no harness"}
  - {label: "2026-09-07 02:54:35Z", suffix: "after_review", commit: "72cdec6",
     note: "after the 16-rule conformance review"}
  - {label: "2026-09-07 11:38:29Z", suffix: "2026-09-07", commit: "52ec048",
     note: "after the scan-run write-back"}

statuses: [measured, harness_built, specified]
verdicts: [pass, fail, not_applicable, error]
