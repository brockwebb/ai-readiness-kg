# Every number `figures.py` uses. The module carries none of its own: the same rule the
# collectors live under (tests/test_scan_harness.py::test_no_collector_hides_a_constant,
# extended to figures.py by tests/test_scan_figures.py), for the same reason — a constant
# inside a renderer cannot be swept, cannot be versioned, and cannot be pointed at.
#
# Geometry is in user units of the SVG viewBox; the figures scale to their container.

# `cycle`, `cycle_suffix`, `out_dir` and `matrix_json` USED to live here and now do not.
# They are derived by `figures.config()` from `params.cycle.name` — the same single source
# `run.py`, `publish.py` and `scan_report.py` read. A cycle name in two files is two
# definitions of "which cycle", and the stale one is the one that draws last week's numbers
# under this week's heading. What stays here is layout, colour and the snapshot list.
framework_json: framework/ai_readiness_framework.json

# **There is no global `compare_to` and there must not be one**
# (`cc_tasks/2026-09-11_rejudge_1_2_3_4_gen9.md` decision 5, ResearchTask 24af5222).
#
# It used to name cycle 1, and a default predecessor is not a fact about the cycle being drawn:
# `scan_2026-09-09_rj1` fell through to it and F5 drew cycle 3 re-judged against cycle 1, 22 rows
# reading "not measured in this cycle" — a figure that answered instead of refusing
# (`cc_tasks/2026-09-10_l0_figures_and_leg_rate_names_RESULT.md` §4). WHICH cycle a comparison is
# against is a claim about the past that only a human can make, so an unconfigured cycle is now a
# hard error in `figures.cycle_over_cycle` and never a fallback. The other five figures are
# unaffected: F5 is the only one that needs a predecessor, so a cycle with none simply does not
# have that figure (`figures.py --only`), which is what cycle 1 re-judged is.
#
# The entries below are per cycle. A RE-JUDGED cycle is drawn against the cycle it derives
# from — the same evidence under the old rules and the new — so its comparison is fixed by what
# it is, not by which cycle ran last. `note` is printed on the figure: a reader who sees two
# dots must be told that the second one moved because the RULE moved and nothing was re-fetched.
compare_to_by_cycle:
  # Cycle 3 against cycle 2. FOUR legs changed rule between them — A1 v3→v4, A3 v4→v5,
  # A8 v3→v4, A10 v2→v3 — so a difference on those rows is the instrument moving, and the
  # frame moved too (13 agencies + StatCan became 16 + 3 reference hosts), which F5's note
  # says outright because two dots cannot say it.
  scan_2026-09-09:
    cycle: scan_2026-09-07b
    suffix: "2026-09-07b"
    label: "cycle 2 · 2026-09-07b, 13 agencies"
    note: "different frame: cycle 2 measured 13 agencies + StatCan, cycle 3 measures 16 + 3 reference hosts"
    rule_changed:
      A1: "v3 → v4"
      A3: "v4 → v5"
      A8: "v3 → v4"
      A10: "v2 → v3"
  # Cycle 3 RE-JUDGED, against the same cycle 2 its source compares against. The comparison the
  # report's movement section makes is cycle 2 beside cycle 3, and re-judging cycle 3 does not
  # change which pair that is — it changes what the second dot is worth. Without this entry the
  # figure fell through to the global default and drew cycle 1, which is the failure the
  # per-cycle override exists to prevent and which it did not prevent for a name it had never
  # seen. `cc_tasks/2026-09-10_l0_figures_and_leg_rate_names.md` decision 5.
  scan_2026-09-09_rj1:
    cycle: scan_2026-09-07b
    suffix: "2026-09-07b"
    label: "cycle 2 · 2026-09-07b, 13 agencies"
    note: "different frame: cycle 2 measured 13 agencies + StatCan, cycle 3 measures 16 + 3 reference hosts; the right-hand dot is the harness-v5 re-judgement, same evidence"
    rule_changed:
      A1: "v3 → v4"
      A3: "v4 → v5"
      A8: "v3 → v4"
      A10: "v2 → v3"
  # Cycle 4 against cycle 3, both re-judged: like for like, one harness version, so a difference
  # is the hosts and not the instrument. Comparing a v5 cycle against a v4 one would put the
  # instrument's own correction into every row.
  scan_2026-09-10_rj1:
    cycle: scan_2026-09-09_rj1
    suffix: "2026-09-09_rj1"
    label: "cycle 3 · 2026-09-09, re-judged"
    note: "both cycles judged under harness-v5, so a difference on a row is the host and not the instrument; the frame grew by the seven declared flagships"
    # EMPTY, and that is the statement: cycle 3 re-judged and cycle 4 re-judged were both
    # judged under the same `CURRENT` rules and the same harness version, so no row on this
    # figure carries an instrument change. Every difference is the hosts.
    rule_changed: {}

  scan_2026-09-07b_rj1:
    cycle: scan_2026-09-07b
    suffix: "2026-09-07b"
    label: "cycle 2 · 2026-09-07b, as judged then"
    note: "re-judged under v4 from stored observations, no re-fetch"
    rule_changed:
      A10: "v2 → v3"
      A8: "v2 → v3"
  scan_2026-09-07_rj1:
    cycle: scan_2026-09-07
    suffix: "2026-09-07"
    label: "cycle 1 · 2026-09-07, as judged then"
    note: "re-judged under v4 from stored observations, no re-fetch"
    rule_changed:
      A10: "v2 → v3"
      A8: "v2 → v3"

  # Cycle 2 AS MEASURED, against cycle 1 as measured. This entry is not new information: it is
  # what the removed global default gave this cycle, written down, so that deleting the default
  # changes no figure that already exists. `figures/scan_2026-09-07b/cycle_over_cycle.svg` was
  # drawn under it and re-renders byte-identically from here.
  scan_2026-09-07b:
    cycle: scan_2026-09-07
    suffix: "2026-09-07"
    label: "cycle 1 · 2026-09-07"
    rule_changed:
      A1: "v2 → v3"
      A3: "v3 → v4"

  # ---------------------------------------------------------------- generation 9
  #
  # `cc_tasks/2026-09-11_rejudge_1_2_3_4_gen9.md` decision 5. All four cycles re-judged under the
  # same `CURRENT` and the same harness version, so each pair is like for like and `rule_changed`
  # is EMPTY on every one of them — which is the statement, not an omission: no row on any of
  # these figures carries an instrument change, and every difference is the hosts and the frame.
  #
  # `scan_2026-09-07_rj2` is absent on purpose. Cycle 1 is the first cycle; it has no
  # predecessor, so it gets no F5 and the renderer is told so with `--only`. An entry naming
  # itself is what the global default used to produce, and a figure comparing a cycle to itself
  # is worse than no figure.
  scan_2026-09-07b_rj3:
    cycle: scan_2026-09-07_rj2
    suffix: "2026-09-07_rj2"
    label: "cycle 1 · 2026-09-07, re-judged"
    note: "both cycles judged under generation 9, so no row carries an instrument change; cycle 1 collected no link_probe leg, so A1 and A3 are blank on its side and that is a gap in the evidence, not a rate of zero"
    rule_changed: {}
  scan_2026-09-09_rj2:
    cycle: scan_2026-09-07b_rj3
    suffix: "2026-09-07b_rj3"
    label: "cycle 2 · 2026-09-07b, re-judged, 13 agencies"
    note: "different frame: cycle 2 measured 13 agencies + StatCan over 40 surfaces, cycle 3 measures 16 + 3 reference hosts over 64; both judged under generation 9"
    rule_changed: {}
  scan_2026-09-10_rj2:
    cycle: scan_2026-09-09_rj2
    suffix: "2026-09-09_rj2"
    label: "cycle 3 · 2026-09-09, re-judged"
    note: "both cycles judged under generation 9, so a difference on a row is the host and not the instrument; the frame grew by the seven declared flagships, 64 surfaces to 71"
    rule_changed: {}

