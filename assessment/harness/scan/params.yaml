# Every constant the scan harness uses. NOTHING numeric is hard-coded in a collector — a test
# greps `collectors/` for integer literals outside an allowlist and fails on a new one.
#
# Why (task 2026-09-06_harness_scaffold.md §2.3, prior art Khan 2026 / Wintermute
# wm-20260906-075432-d860df): one unswept truncation constant was worth 14 points. A constant
# that lives in a collector cannot be swept, cannot be versioned, and cannot be stamped on the
# evidence it shaped. `params_hash` rides on every Observation, so a Finding always names the
# parameter set that produced its evidence.
params_version: "0.1.0"

# How a Finding's id is derived — a PARAMETER, not code, because it is an identifier scheme
# and an identifier scheme is versioned data (`cc_tasks/2026-09-07_scan_harness_v3.md` §0).
#
#   1  `rule_version` is stamped from the constant `rules/_common.RULE_VERSION`, which is the
#      literal "v1" for every rule ever shipped. Every Finding on the log to 2026-09-07 was
#      made this way, and the constant is an INPUT to the derived `finding_id`
#      (`model.py::Finding.make`), so correcting it in place would re-identify all 1,353.
#   2  `rule_version` is stamped from the rule id itself (`rules.parse_rule_id`), which is the
#      only place the version is actually true. `RULE-A3-v4` stamps `v4`.
#
# History re-derives under ITS OWN params (the gate recovers them from git), so raising this
# moves no stored id: a cycle measured under identity 1 is re-judged under identity 1. This is
# the same move the event log makes with `schema_version` on every line — the scheme is data
# that travels with the record, never an edit to the past.
finding_identity: 2

cycle:
  # Which cycle these parameters belong to, and which target list it measures. Named here so
  # a Finding can be traced to its cycle without a reader having to know which state file was
  # current on the day, and so `params_hash` moves when the target list does — a measurement
  # of a different set of surfaces is a different measurement.
  # Cycle 2. `b`, not a new date: the second cycle ran on the SAME UTC day as the first, and
  # the name is what every output path, every Result suffix and `refuse_clobber` key on — so
  # a colliding name would point cycle 2 at cycle 1's payload. DD-041's rerun convention is
  # exactly this suffix (`kg_diag_<metric>_2026-09-04b` against the un-suffixed first run),
  # and DD-056 takes the suffix from here, so this cycle's Results read `..._2026-09-07b`.
  name: scan_2026-09-07b
  targets: scan_targets_2026-09

manners:
  # RFC 9309: the scanner obeys the file it measures.
  user_agent: "ai-readiness-kg-scanner/0.1 (+https://github.com/brockwebb/ai-readiness-kg)"
  requests_per_second_per_host: 1.0
  connect_timeout_seconds: 10.0
  read_timeout_seconds: 30.0
  max_retries: 3
  backoff_base_seconds: 2.0
  backoff_on_status: [429, 503]
  follow_redirects: true
  max_redirects: 5
  # Paths that are always fetched because they ARE the object of measurement — a robots.txt
  # that disallows /robots.txt cannot hide it from a measurement of robots.txt.
  always_fetch_paths: ["/robots.txt", "/sitemap.xml", "/sitemap_index.xml", "/llms.txt",
                       "/data.json", "/.well-known/"]
  # No byte cap by default. §2.1: whole body retained, no truncation anywhere. A cap must be
  # set explicitly to exist, and setting one is a decision that shows up in params_hash.
  max_body_bytes: null
  # Statuses at which we did not OBSERVE the surface, we were REFUSED it. A 404 is a real
  # measurement (the path is not served); a 403/401/429 is the host declining this client, and
  # scoring it `fail` publishes an absence claim about a product nobody was allowed to look at.
  # www.bls.gov answered 403 to all 60 requests in the first smoke run and both BLS surfaces
  # scored `fail` on all 15 legs; that is what this list exists to stop. `error_class` cannot
  # carry the distinction because `http_4xx` covers both.
  unobservable_statuses: [401, 403, 407, 429]

crawl:
  # A3 bulk-access link discovery: one hop from the product page, per §3's signal.
  depth: 1
  max_links_followed: 40

# ---------------------------------------------------------------------------------------
# The FRAME: who is measured, and how a surface is chosen for them.
# `cc_tasks/2026-09-08_scan_frame_fss.md` §1 and §2. Declared BEFORE any agency page was
# fetched, which is the whole point: a selection rule written after looking at the listings is
# a preference wearing a rule's clothes (`targets.yaml` makes the same argument for cycle 1).
# ---------------------------------------------------------------------------------------
frame:
  # WHERE THE ROSTER COMES FROM. Two documents, both retained content-addressed under
  # corpus/evidence/frame/ and both cited by the roster DataFile. Neither is typed into a
  # script: `build_roster.py` parses the bodies.
  #
  # They disagree, and the reconciliation rule is declared here rather than decided after the
  # counts were seen (see `roster_authority`).
  roster_sources:
    - name: icsp_charter
      url: "https://statspolicy.gov/assets/files/ICSP%20Charter.pdf"
      role: membership
      note: >-
        The ICSP's own constitutive document (April 2023). Enumerates every member with an
        explicit legend — `^` a Recognized Statistical Agency or Unit, `*` a designated
        Statistical Official, `**` the Chair — so both tiers are a PARSE of a flag, not a
        reading of prose.
    - name: statspolicy_about
      url: "https://statspolicy.gov/about/"
      role: current_urls_and_crosscheck
      note: >-
        The live rendering of the same fact, and the only source that carries an agency HOME
        URL per recognized agency. Used for URLs and as a cross-check on the counts.
  # Which source settles MEMBERSHIP when the two disagree, and why — stated as a rule about
  # the kind of document each is, so it cannot be chosen after the fact to get a number.
  #
  # Recognition under CIPSEA 2018 (44 U.S.C. 3561(11), 3562) is a legal status OMB confers.
  # The charter is the Council's constitutive document and enumerates its membership under a
  # flag legend; the About page is a rendered summary of the same fact and is authoritative
  # for what it alone carries — the current home URL of each agency. So: membership from the
  # charter, URLs from the About page, and every disagreement recorded on the roster's face
  # rather than resolved silently.
  roster_authority: icsp_charter
  # The legend both sources use. Read from the documents, restated here only so the parser has
  # a declared vocabulary rather than an inline literal.
  flags:
    recognized_agency_or_unit: "^"
    statistical_official: "*"
    chair: "**"
  # A member line the parser must not mistake for an entry: the legend line itself begins with
  # the flag character it defines.
  legend_line_tokens: ["denotes a recognized", "denotes a statistical", "denotes the chair"]

  # SURFACE SELECTION, per agency. §2, and every clause is a token list rather than a
  # judgement so the rule can be run, tested and re-run.
  machine_entry_point:
    tokens: ["api", "developers", "developer", "data-access", "open-data", "datasets"]
    # Nothing matched is a RECORDED OBSERVATION about the agency, never a gap in the roster
    # and never a hand-picked substitute.
    none_found_marker: no_machine_entry_point
  flagship_products:
    # The first N product links in the AGENCY'S OWN ORDER on its own listing page. Order is
    # the agency's editorial judgement and is the nearest thing to a published "principal
    # products" list that every agency has; taking the first N is a rule, choosing among them
    # is a preference.
    n: 3
    listing_tokens: ["data", "statistics", "publications", "products", "surveys", "tables"]
    # A link is a PRODUCT only if it goes deeper than the listing page itself and is not one
    # of these. Same discriminators as cycle 1's `targets.yaml`, reused rather than re-derived.
    reject_tokens: ["about", "contact", "help", "faq", "news", "blog", "careers", "privacy",
                    "accessibility", "foia", "policy", "policies", "glossary", "sitemap",
                    "subscribe", "newsletter", "search", "home", "espanol", "español"]
    min_anchor_words: 2
    none_found_marker: no_flagship_products
  # Tier B is measured at the host layer only: there is no product listing to read, because a
  # department without a recognized statistical unit publishes no official statistics as such.
  tier_b_surfaces: ["home", "robots.txt"]

probes:
  # ONE same-host policy, for EVERY collector that dereferences a URL it discovered on a
  # surface. `cc_tasks/2026-09-08_scan_harness_v4.md` §1.3.
  #
  # It used to be `link_probe.same_host_only`, which is where `collectors/links.probe` reads
  # it — and `collectors/v2clauses.follow_latest_pointer` read nothing at all, so A8
  # dereferenced `public.govdelivery.com` on the Census ACS surface after its anchor matcher
  # took "subscribe to govdelivery email updates" for a latest-vintage pointer
  # (`cc_tasks/2026-09-07_scan_run_2_RESULT.md` §6.1). Two requests, robots obeyed, no verdict
  # resting on it — and the `link_probe` comment named the exposure exactly ("probing off-host
  # would make the control cycle reach the real internet before the gate that exists to run
  # before any real host") while governing only one of the two collectors.
  #
  # A policy enforced in one of the two places it applies is not a policy. Both collectors now
  # go through `manners.on_roster_host`, which reads THIS key; `link_probe.same_host_only` is
  # kept readable for the cycles measured under it and `manners.same_host_only` REFUSES if the
  # two ever disagree — two keys that can differ are two policies.
  same_host_only: true

a1_formats:
  # A1: which Content-Types / extensions count as structured data rather than PDF-only.
  structured_content_types: ["text/csv", "application/json", "application/geo+json",
                             "application/vnd.apache.parquet", "application/x-parquet",
                             "application/vnd.ms-excel",
                             "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                             "application/xml", "text/xml"]
  structured_extensions: [".csv", ".json", ".geojson", ".parquet", ".xlsx", ".xls", ".xml", ".tsv"]
  pdf_content_types: ["application/pdf"]

a4_crawlers:
  # The AI-crawler user agents A4 and A11-declared evaluate robots.txt against. A list, in
  # params, because it changes: GPTBot did not exist in 2022 and something else will not exist
  # in 2027.
  user_agents: ["GPTBot", "ClaudeBot", "Claude-Web", "PerplexityBot", "Google-Extended",
                "CCBot", "Bingbot", "Applebot-Extended"]

a5_discovery:
  well_known_probes: ["/llms.txt", "/.well-known/ai-plugin.json", "/.well-known/mcp.json"]
  # How many sitemap URLs are kept on the Observation for a reader's convenience. NOT
  # evidence truncation — the whole body is stored content-addressed either way — but it is
  # still a constant, and the lint was right to refuse it inside the collector.
  sample_urls_retained: 5

a6_markup:
  # extruct syntaxes to extract, and the types that satisfy A6.
  syntaxes: ["json-ld", "microdata", "rdfa"]
  dataset_types: ["Dataset", "DataCatalog", "http://schema.org/Dataset",
                  "https://schema.org/Dataset"]
  dcat_classes: ["http://www.w3.org/ns/dcat#Dataset", "http://www.w3.org/ns/dcat#Catalog"]

a8_freshness:
  header_fields: ["last-modified", "date"]
  markup_fields: ["dateModified", "datePublished", "temporalCoverage"]

a9_m2m:
  probes: ["/openapi.json", "/swagger.json", "/api/openapi.json", "/llms.txt",
           "/.well-known/mcp.json"]

a10_soft404:
  # A soft-404 is HTTP 200 on a route that should not exist.
  invalid_path_suffix: "/__ai-readiness-kg-probe-404__"
  # Rendering half needs a browser; see collectors/lighthouse.py for what happens without one.
  renderer: "none"

d1_licence:
  markup_fields: ["license", "licence", "http://schema.org/license",
                  "http://purl.org/dc/terms/license"]
  recognised_prefixes: ["https://creativecommons.org/", "http://creativecommons.org/",
                        "https://spdx.org/licenses/", "https://opensource.org/licenses/",
                        "https://www.usa.gov/government-works", "https://opendefinition.org/"]
  recognised_tokens: ["CC0", "CC-BY", "PUBLIC DOMAIN", "U.S. GOVERNMENT WORK", "MIT",
                      "APACHE-2.0", "ODC-BY"]

d4_catalog:
  paths: ["/data.json"]
  # Project Open Data v1.1 required fields on a dataset entry.
  required_dataset_fields: ["title", "description", "keyword", "modified", "publisher",
                            "contactPoint", "identifier", "accessLevel"]

f4_changelog:
  paths: ["/changelog", "/changelog.json", "/releases", "/whatsnew", "/news"]
  machine_readable_content_types: ["application/json", "application/atom+xml",
                                   "application/rss+xml"]

g1d_uncertainty:
  # G1-D: error measures present as STRUCTURED FIELDS beside the estimates, not footnotes.
  # Column-header tokens that name an error measure.
  field_tokens: ["margin of error", "moe", "standard error", "se", "cv",
                 "coefficient of variation", "confidence interval", "ci", "lower bound",
                 "upper bound", "±"]

e5_control:
  # The control cycle is the instrument's own E5. A cycle with zero fired controls is INVALID.
  #
  # PRE-REGISTERED (`cc_tasks/2026-09-07_scan_harness_v3.md` §1.4): every entry below was
  # DERIVED FROM THE RULE SOURCE and written down BEFORE the fixtures were first run. A gate
  # whose expectation is edited to match what came out is not a gate, so a mismatch is a
  # finding to report, never a line to change.
  #
  # A value may be a single verdict (every leg expects it) or a table with a `default` and
  # per-leg exceptions. Two fixtures need the table: the interesting branches are exactly the
  # legs that behave DIFFERENTLY from the rest, and a blanket expectation would hide them.
  expected_verdicts:
    passes_all: "pass"
    fails_all: "fail"
    # Declared layer permits, enforced layer refuses — A12's central branch, and what
    # www.bls.gov did to the first smoke run. Derivations:
    #   default `error`  every content leg sees HTTP 403, which `errors.classify_status` calls
    #                    `refused` and `errors.CLASSES` marks blind, so `_common.only_errors`
    #                    is true and each rule returns `error` rather than scoring an absence
    #                    claim about a product nobody was allowed to look at.
    #   A4   `pass`      A4 judges the DECLARED layer alone; robots.txt is served (200) and
    #                    allows the product path for every AI-crawler UA in `a4_crawlers`.
    #   A11-declared `pass`  its two declared-layer sources are robots.txt (served, permits)
    #                    and the page's meta-robots (the 403 body carries none). The robots
    #                    observation is a real 200, so `only_errors` is FALSE and the rule
    #                    reaches its verdict. This is the entry the task file's blanket
    #                    "every content leg error" would have got wrong.
    #   A12  `fail`      robots permits this UA for the probe path and the host answers 403 to
    #                    that same path: `rule_a12.py` branch 5, the declared and enforced
    #                    layers disagree.
    refuses_identified_client:
      default: "error"
      A4: "pass"
      A11-declared: "pass"
      A12: "fail"
    # The socket is reset before any response, robots.txt included. Every collector raises,
    # `errors.classify_exception` returns `connection_reset`, which is blind — so every leg is
    # `error`, with no exceptions. A12 lands on its "the robots/probe pair was not collected"
    # branch rather than on a coherence verdict, which is the right answer: a host that cannot
    # be reached has not been shown to be incoherent.
    resets_connection: "error"
    # PRE-REGISTERED before the fixture was first run (`cc_tasks/2026-09-08_scan_harness_v4.md`
    # §1.2), derived from the rule source. The fixture serves everything `passes_all` serves
    # and resets the connection on A10's invented invalid route ALONE, so:
    #   default `pass`  every leg but A10 sees exactly what it sees on `passes_all`; not one
    #                   of them fetches `a10_soft404.invalid_path_suffix`.
    #   A10  `error`    the valid-route probe is served HTTP 200, so `_common.only_errors` is
    #                   FALSE and `RULE-A10-v2` would reach its status branches and return
    #                   `pass` on "invalid route correctly HTTP None" — the false positive of
    #                   `cc_tasks/2026-09-07_scan_run_2_RESULT.md` §6.2. `RULE-A10-v3` calls
    #                   `_common.unobserved_error` on the invalid-route probe first, sees
    #                   `connection_reset` (blind), and returns `error`.
    # This is the fixture that must FIRE: a control that cannot reproduce the defect cannot
    # certify the fix.
    invalid_route_unobserved:
      default: "pass"
      A10: "error"

fuji:
  # NOT WIRED. The PyPI name `fuji` is a DIFFERENT package (startechsheffield, "a small
  # library made to make common tasks easier") — a name collision that installs cleanly and
  # imports, which is exactly how a wrong dependency gets into a harness unnoticed. The real
  # F-UJI (pangaea-data-publisher/fuji, Devaraju & Huber 2021) is a SERVER installed from
  # GitHub source with its own config and metadata catalogues; `fuji-server` is not on PyPI.
  # Standing it up is a dependency this scaffold does not take on. The three overlapping legs
  # use their own collectors and the cross-check is deferred, with the metric ids kept here so
  # the next task does not have to re-derive them.
  available: false
  deferred_metrics:
    A2: "FsF-A1-03D"
    A6: ["FsF-F4-01M", "FsF-I1-01M"]
    D1: "FsF-R1.1-01M"
  install_note: "pip install git+https://github.com/pangaea-data-publisher/fuji ; needs config/server.ini"

# ---------------------------------------------------------------------------------------
# v2 clause parameters. Task `cc_tasks/2026-09-06_scan_targets.md` §2: the 2026-09-06 rule
# review found that 12 of 16 `v1` rules implement only part of their MeasurementSpec's signal.
# Every constant a v2 clause needs lives here, under the same rule as every other constant —
# a threshold inside a rule cannot be swept, versioned, or stamped on the evidence it shaped.
# ---------------------------------------------------------------------------------------

link_probe:
  # A1-v2 and A3-v2 need the per-link Content-Type their specs ask for ("for each, HEAD and
  # read Content-Type"). v1 classified on the href suffix alone, so an extensionless endpoint
  # serving text/csv was invisible. Bounded, because a product page can carry hundreds of
  # links and this is one request each at the standing rate.
  max_links_probed: 25
  method: HEAD
  # SUPERSEDED by `probes.same_host_only`, and kept readable rather than deleted: it is the
  # key the 2026-09-07 and 2026-09-07b cycles were measured under, and their params sets are
  # recovered from git by hash for the re-derivation gate. `manners.same_host_only` reads
  # `probes.same_host_only` and refuses if this key disagrees with it — one policy, two
  # spellings, never two answers.
  #
  # Same-host only. Two reasons, and the second is the one that bites: A1 and A3 ask what the
  # PRODUCT offers, not what it links to elsewhere; and the control fixture links out to a
  # licence URL, so probing off-host would make the control cycle reach the real internet
  # before the gate that exists to run before any real host.
  same_host_only: true
  # A HEAD that a host answers 405 is retried as a ranged GET: some servers refuse HEAD
  # outright, and treating that as "no content type" would read a server quirk as a product
  # property.
  fallback_get_on_status: [405, 501]
  # ONE probe per object per cycle (`cc_tasks/2026-09-07_scan_harness_v3.md` §0, §1.3). A1 and
  # A3 ask different questions of the SAME 25 links and each HEADed all of them: 559 of the
  # 1,118 link probes in the 2026-09-07 cycle were the second request for an object already
  # fetched, and they were the largest single share of its 46-minute wall time. RFC 9309
  # governs what may be fetched and licenses nothing about fetching it twice.
  #
  # The observations are collected once under `shared_leg` and the rules that read them
  # declare `CONSUMES` (see `rules/__init__.py`). `legs_served` are the legs whose own
  # collection is therefore empty — everything they need is on the shared leg.
  shared_leg: link_probe
  legs_served: ["A1", "A3"]

a3_bulk:
  # A3-v2: "classify links as bulk (whole-product archive or full dataset file) vs filtered
  # query". Three mechanical discriminators, none of them a judgement call:
  archive_extensions: [".zip", ".gz", ".tgz", ".tar", ".tar.gz", ".7z", ".bz2"]
  archive_content_types: ["application/zip", "application/gzip", "application/x-gzip",
                          "application/x-tar", "application/x-7z-compressed"]
  # A query string is the signature of a filtered export: /export?state=CA&year=2020 is a
  # subset by construction, whatever it is served as.
  query_string_is_filtered: true
  # A whole-product file is large. Below this, a "download" is a preview or a row sample.
  # 50 KiB: the smallest whole-product CSV among the 17 admitted g1sfc surfaces is 63 KiB
  # (statcan-14-10-0287-01 LFS provinces), and the Census QuickFacts preview export is 4 KiB.
  min_bulk_bytes: 51200
  # A Content-Length a host does not send is not evidence of smallness.
  missing_length_is_bulk: false

a2_api:
  # A2-v2: "record auth scheme, declared rate limits, and whether the description is
  # machine-readable". The first two were never read.
  auth_headers: ["www-authenticate", "proxy-authenticate"]
  rate_limit_headers: ["ratelimit", "ratelimit-limit", "ratelimit-policy",
                       "x-ratelimit-limit", "x-rate-limit-limit", "retry-after"]
  # OpenAPI 3 puts the auth model at components.securitySchemes and Swagger 2 at
  # securityDefinitions; an API that documents neither has not declared an auth scheme.
  openapi_auth_keys: ["securitySchemes", "securityDefinitions", "security"]
  openapi_rate_limit_keys: ["x-ratelimit", "x-rate-limit", "rateLimit", "x-throttling"]

a6_shacl:
  # A6-v2: the spec says validate against DCAT-AP SHACL shapes. See the header of the shapes
  # file for why this is a stated MINIMAL subset rather than the DCAT-AP distribution.
  shapes_path: "shapes/dcat_ap_min.ttl"
  shapes_profile: "dcat_ap_min"
  # A graph that pyshacl cannot even load is a parse_error, never a `fail`: we did not
  # observe the product's conformance, we failed to read it.
  treat_load_failure_as: parse_error

a8_latest:
  # A8-v2: "test whether a latest-vintage pointer resolves". v1 read the date and never
  # dereferenced anything.
  link_rels: ["latest-version", "last", "canonical"]
  href_tokens: ["/latest", "latest.", "current.", "/current", "most-recent"]
  anchor_tokens: ["latest", "most recent", "current release", "current version"]
  # Anchor text that names a SUBSCRIPTION or a notification, not a vintage. A8-v3 drops a
  # candidate whose anchor text carries any of these, whatever else it matched.
  #
  # The test case is the one that fired: on
  # `scan-census-flagship-2-american-community-survey-acs` an anchor whose RETAINED text reads
  # "subscribe subscribe to govdelivery email" matched `anchor_tokens` and resolved HTTP 200 on
  # `public.govdelivery.com`, so A8 would have credited an email signup page as a resolving
  # latest-vintage pointer. It did not manufacture a verdict — A8 was 23 fail / 3 error, zero
  # pass — which is luck, not design (`cc_tasks/2026-09-07_scan_run_2_RESULT.md` §6.1).
  #
  # WHICH token matched is not recoverable from that record: `reporting.anchor_text_retained_chars`
  # is 40, the stored `how` string stops there, and the matcher scanned the whole anchor. So
  # `find_latest_pointers` now records `matched_token` beside the text — a matcher that cannot
  # say why it matched leaves a Finding nobody can check.
  #
  # An exclusion list rather than a tighter inclusion list: the inclusion tokens are what the
  # indicator MEANS ("latest", "most recent") and narrowing them would lose real pointers, while
  # what went wrong is a distinct vocabulary — a mailing list — that no vintage pointer uses.
  excluded_anchor_tokens: ["subscribe", "subscription", "sign up", "signup", "e-mail",
                           "email updates", "govdelivery", "newsletter", "notify me",
                           "get updates", "alerts", "rss feed"]
  max_pointers_followed: 3
  resolves_statuses: [200, 203, 206]

a11_meta:
  # A11-declared-v2: the signal names robots.txt AND meta-robots; only the first was read.
  meta_names: ["robots", "googlebot", "gptbot", "claudebot"]
  # A directive that withholds the product from an AI client. `noai`/`noimageai` are the
  # de-facto opt-out tokens; they are not in RFC 9309 and are recorded as convention.
  restricting_tokens: ["noindex", "nofollow", "noarchive", "nosnippet", "noai", "noimageai"]

b3_without_js:
  # B3-v2: "and whether it is retrievable without JS" — never implemented in v1.
  #
  # Prior art already in this repo: DD-030's extent gate, from Kohlschütter, Fankhauser &
  # Nejdl, *Boilerplate Detection using Shallow Text Features* (WSDM 2010). The same two
  # shallow features answer "is there a document here before JavaScript runs" as answer "did
  # this conversion produce a navigation surface". Reused deliberately rather than invented:
  # the floors below are the ingest gate's own, so a methodology page that would not have been
  # admitted to the corpus cannot be scored as legible here.
  min_visible_chars: 2000
  max_link_density: 0.25

a10_shell:
  # A10-v2: v1 decided on status codes alone and never tested for the "error shell" the
  # signal names, and never used the `pre_js_chars` its own collector records.
  error_shell_tokens: ["page not found", "not found", "sorry", "we can't find",
                       "cannot be found", "error 404", "page unavailable"]
  # A deep link whose raw HTML carries less than this is a client-rendered shell: there is
  # no product on the page until JavaScript runs. Same floor as b3_without_js, same source.
  min_pre_js_visible_chars: 2000

d1_sources:
  # D1-v2: the signal names three licence sources and v1 read one.
  # RFC 8288 Web Linking: `Link: <...>; rel="license"`.
  link_header_rels: ["license", "licence", "terms-of-service"]
  terms_paths: ["/terms", "/terms-of-service", "/policies/terms", "/about/policies",
                "/license", "/licence", "/legal"]
  max_terms_probed: 3

d4_validation:
  schema_path: "shapes/pod_v1_1_min.schema.json"
  schema_profile: "pod_v1_1_min"
  # A catalog too large to validate whole is validated on a bounded sample of its datasets;
  # the Finding records how many were checked, so nobody reads a sample as a census.
  max_datasets_validated: 200

f4_entries:
  # F4-v2: "and carries a revision class per entry" — v1 stopped at the content type.
  revision_class_fields: ["type", "change_type", "changeType", "revision", "revision_class",
                          "category", "kind", "class", "severity"]
  # Atom/RSS carry the class as <category term="..."> on an entry.
  atom_category_elements: ["category"]
  min_entries_classified_fraction: 0.5

e5_ordering:
  # E5-v2: the signal's first sentence — "Both control fixtures are scanned before any real
  # host" — was never implemented, because a pure rule cannot read a clock. It can read
  # TIMESTAMPS it is given: the cycle passes the earliest surface observation's `captured_at`
  # alongside the control observations, and the rule asserts the controls all precede it.
  # That makes the ordering falsifiable from stored evidence rather than asserted by the
  # runner's control flow.
  require_controls_before_surfaces: true

reporting:
  # How much of a validator's output is retained ON the Observation for a reader. NOT evidence
  # truncation — the whole response body is stored content-addressed either way — but the
  # integer-literal lint was right to refuse these inside a collector: a cap nobody can sweep
  # is a cap nobody can question, which is the whole of Khan 2026's finding.
  validator_messages_retained: 10
  anchor_text_retained_chars: 40
  # Rounding precision for the ratios reported on an Observation. A ratio is a convenience for
  # a reader; every rule compares against the params floor, never against the rounded value.
  ratio_decimal_places: 4

