# Instrument entry (DN-015 §2). Authored by task db464d5f, Part B. FRONTIER leg (as_of 2026-01).
order: 9
rule_id: RULE-A9-v2
leg: A9
indicator: ind:A9
code: assessment/harness/scan/rules/rule_a9_v2.py
matrix: product (frontier, DN-012 d4)
on_v3_grid: true
declaration: false
plain_name: "A probed machine address returns non-HTML content"

question:
  text: >-
    Does the agency serve an entry point built for machine clients (an API description, an
    agent-protocol endpoint, an llms.txt) where such clients look first? Agents increasingly look
    for these before reading pages.
  established_by:
    - {doc_id: llmstxt-proposal, section: "Proposal: a /llms.txt markdown file to provide LLM-friendly content"}
    - {doc_id: wilkinson-2016-fair-guiding-principles, section: "A1: (meta)data retrievable by their identifier using a standardised communications protocol"}

expected_behavior:
  text: >-
    No published standard defines a "machine-first entry point" or names the set of addresses a
    ready publisher serves one at. Its parts have separate sources of unequal standing: an
    OpenAPI description (OAS, a specification), /llms.txt (a proposal, llmstxt.org), and
    /.well-known/mcp, which is not a registered well-known URI and has no source in the corpus.
  sources: none

test:
  client: "the harness's identified, robots-compliant client"
  request: "GET a fixed set of probe paths: the recorded API base and its description, /.well-known/mcp, /llms.txt"
  reads: "status, Content-Type, body length"
  decision_rule:
    - "pass: `machine-first entry point served at {url}` when any probe returns a 2xx non-HTML body"
    - "fail: `{n} probed path(s) answer with HTML rather than a machine format`"
    - "fail: `none of the {n} probed machine-first paths is served, the declared API base included`"
  parameters:
    - "the probe set is this project's"
  recognized_method: "None published; the probe set and the any-non-HTML-2xx rule are this project's."
  recognized_method_sources: none

branches:
  - id: pass_any_non_html_2xx
    verdict: pass
    reason_match: "machine-first entry point served at"
    behavior: "any probe returns non-HTML content (any JSON at the API base, any llms.txt) "
    sources: none
    state: project_defined
  - id: fail_html_only
    verdict: fail
    reason_match: "answer with HTML rather than a machine format"
    behavior: "the probed addresses answer with HTML"
    sources: none
    state: project_defined
  - id: fail_none_served
    verdict: fail
    reason_match: "probed machine-first paths is served"
    behavior: "none of the probed addresses is served"
    sources: none
    state: project_defined
not_measured: "refused, robots_disallowed, or the recorded API base not probed (15 of 23 data pages on the cycle of record)"

claims:
  pass: "At least one of the addresses this project probes (the recorded API base and its description, /.well-known/mcp, /llms.txt) returned content that is not an HTML page."
  fail: "None of the handful of addresses this project probes, by plain GET with no key and no Accept header, returned non-HTML content. The recorded API address may be stale or wrong, and an API that answers a bare request with an HTML page or an error page fails the same way. It is not a claim that the agency has no API, that its API is down, or that it lacks machine access."
  neither: "Nothing about whether the content found is useful, documented or an entry point in any published sense."

confounds:
  - cause: "the API base returns any JSON at all (an error message, a catalog)"
    distinguished: "no: it passes"
  - cause: "the agency publishes its machine entry point at an address outside the probe set"
    distinguished: "no"

fix_line_check:
  action: act:a9-publish-a-machine-first-entry-point
  fix_line: "Publish a machine-first entry point for the product."
  verdict: consistent
  note: "Consistent with the check, which is itself project_defined; the line names no published target."

state: project_defined
state_reason: >-
  The construct has no published definition, and the decision rule (any non-HTML 2xx at a
  project-chosen probe set) is the project's. It is a frontier leg by its own record; it stays in
  the detailed report as such and comes off page two.

# Plain-language fields (DN-016 §3; task b6c65bfe). Authored for the diagnostic package.
plain:
  question: Does the agency serve an entry point built for machine clients, such as a machine-readable
    API description, an agent-protocol address, or an llms.txt, at the addresses machine clients look
    first?
  where_we_look: 'A fixed handful of machine addresses this project checks on the agency''s site: the
    recorded API base and its description, the /.well-known/mcp path, and /llms.txt.'
  what_client_does: The public client asks the website for each address in that fixed set with a plain
    request, no key and no special accept header, and reads the status, content type and body length.
  pass: For every data page looked at, at least one of the addresses this project checks returned content
    that is not an HTML page.
  partial: For some of the agency's data pages at least one checked address returns non-HTML content
    and for some none does.
  fail: For every data page looked at, none of the handful of addresses this project checks, by a plain
    request with no key and no accept header, returned non-HTML content. The recorded API address may
    be stale or wrong, and an API that answers a bare request with an HTML page or an error page fails
    the same way; it is not a claim that the agency has no API, that its API is down, or that it lacks
    machine access.
  not_measured: 'The public client could not read one or more addresses, for one of three reasons: the
    host refused the identified client, the client''s own robots.txt compliance kept it from reading,
    or the recorded API base could not be reached to confirm an absence, a server or network error.'
  why_it_matters: 'This is the project''s own rule: no published standard defines this entry point or
    the set of addresses to serve it at. Its motivation draws on a FAIR letter (data retrievable by
    a standardised protocol) and the llms.txt proposal, but neither defines the check.'
  who_else: No public tool runs this exact check.
  rung_two_changes: 'This check requests with no key, so a registered public client that presents a
    key could change the result here: an API that answers only a key-bearing request could return machine
    content on a second look where the bare request got an HTML or error page.'
