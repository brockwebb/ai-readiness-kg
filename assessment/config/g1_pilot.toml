# G1 pilot run schedule (task 2026-09-02_g1_eval_probe_family_v0 step 6).
#
# The declared per-run ceiling is 200,000 tokens. A minimal `claude -p` call books ~30k
# tokens (controls.yaml spend.call_class_floors.g1_eval and its comment), so the ceiling
# admits on the order of six calls — far fewer than the full fixture x mode grid. The
# order below is therefore PRE-REGISTERED here, before any call is made: the runner walks
# it top to bottom and stops cleanly (exit 0) at the first spend refusal. Modes alternate
# and classes are spread so whatever prefix the ceiling admits covers both modes and
# several classes rather than one corner of the grid. The RESULT reports the prefix
# reached and the ceiling the whole grid would need.
#
# Each step: kind = "indirect" (one call per PASSAGE — every proposition sharing that
# passage is scored from the one restatement) or "direct" (one call per proposition x
# qualifier class).
#
# Passage ids are the `passages` keys of the two fixture files; the held-out propositions
# that share a development passage (Indiana in acs-ch7-significance; Arlington/Alexandria in
# acs-ch8-tricounty; 3,497 in acs-ch8-loudoun-83; the state rho share in das-plb-people) are
# scored from that passage's single indirect call, so no second indirect call is listed.
[[steps]]
kind = "indirect"
passage = "acs-ch7-colorado"
[[steps]]
kind = "direct"
proposition = "g1-acs-moe-001"
qualifier = "MOE"
