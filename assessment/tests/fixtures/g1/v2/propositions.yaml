  bls-2026-07-headline-technote:
    surface_type: footnoted
    surface_file: corpus/g1eval/bls-employment-situation-2026-08-news-release.md
    source_doc_id: bls-employment-situation-2026-08-news-release
    parts:
    - doc_id: bls-employment-situation-2026-08-news-release
      text: "Both nonfarm payroll employment (-23,000) and the unemployment rate (4.1 percent) changed little in \nJuly, the U.S. Bureau of Labor Statistics reported today. Employment declined in local government \neducation and retail trade. Employment continued to trend up in health care."
    - doc_id: bls-employment-situation-2026-08-news-release
      text: '   For example, the confidence interval for the monthly change in total nonfarm

        employment from the establishment survey is on the order of plus or minus 122,000.

        Suppose the estimate of nonfarm employment increases by 50,000 from one month to

        the next. The 90-percent confidence interval on the monthly change would range from

        -72,000 to +172,000 (50,000 +/- 122,000). These figures do not mean that the sample

        results are off by these magnitudes, but rather that there is about a 90-percent

        chance that the true over-the-month change lies within this interval. Since this'
    legend_on_surface: false
    declared_leg_score: 1
    footnote_distance_chars: 30928
