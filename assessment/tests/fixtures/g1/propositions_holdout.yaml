passages:
  acs-ch7-significance: 'The example below shows how to determine if the difference in the estimated percentage
    of householders age 65 or older who live alone between Florida (estimated percentage = 12.6, MOE =
    0.2) and Arizona (estimated percentage = 10.5, MOE = 0.3) is statistically significant, based on 2015
    ACS data. Using formula (1) above, first calculate the corresponding standard errors for Florida (0.122)
    and Arizona (0.182) by dividing the MOEs by 1.645. Then, using formula (3) above, calculate the test
    value as follows: Understanding and Using American Community Survey Data 57 What All Data Users Need
    to Know 57 U.S. Census Bureau Since the test value (9.581) is greater than the critical value for
    a confidence level of 90 percent (1.645), the difference in the percentages is statistically significant
    at a 90 percent confidence level. A rough interpretation of the result is that the user can be 90
    percent certain that a difference exists between the percentage of householders aged 65 or older who
    live alone in Florida and in Arizona. By contrast, if the corresponding estimate for Indiana (estimated
    percentage = 10.8, MOE = 0.2, SE = 0.122) were compared with the estimate for Arizona, formula (3)
    would yield: Since the test value (1.369) is less than the critical value for a confidence level of
    90 percent (1.645), the difference in percentages is not statistically significant. A rough interpretation
    of the result is that the user cannot be certain to any sufficient degree that the observed difference
    in the estimates between Indiana and Arizona was not due to chance.'
