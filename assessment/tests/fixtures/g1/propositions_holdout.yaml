  acs-ch8-product: 'In some instances, data users may need to derive an estimate by multiplying a published
    count by a published percentage. For example, a data user might be interested in the number of 1-unit
    detached owner-occupied housing units in a geographic area. In 2015, the number of owner-occupied
    housing units in the United States was 74,506,512 with an MOE of 228,238, and the percent of 1-unit
    detached owner-occupied housing units was 82.4 (0.824) with an MOE of 0.1 percent (0.001). 66 So,
    the number of 1-unit detached owner-occupied housing units was 74,506,512 * 0.824 = 61,393,366. The
    formula to calculate the MOE of a product is: (9) Substituting the estimates and their respective
    MOEs in formula (9) yields: To obtain the lower and upper bounds of the 90 percent confidence interval
    around 61,393,366, add and subtract the MOE from 61,393,366. Thus, the 90 percent confidence interval
    for this estimate is [61,393,366 – 202,289] to [61,393,366 + 202,289] or 61,191,077 to 61,595,655.
    Using formula (2), the SE of the product is 202,289 / 1.645 = 122,972. Using formula (4), the coefficient
    of variation for this derived estimate is (122,972 / 61,393,366) * 100 = 0.2 percent, indicating that
    the derived estimate is very reliable.'
