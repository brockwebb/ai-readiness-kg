  das-blockgroup-accuracy: In the first part of their analysis, the researchers sought to determine the
    minimum population size necessary for geographic areas to have reliable demographic characteristics
    for the purposes of redistricting. Examining census block groups as well as places and minor civil
    divisions (MCDs), they demonstrated that for any block group with a total population between 450 and
    499 people or larger, and for MCDs and places between 200 and 249 or larger, the difference in the
    largest demographic group as a proportion of the total population between the published 2010 Census
    tabulations and the 2010 Demonstration PrivacyProtected Microdata File (2021-06-08) is less than or
    equal to 5 percentage points at least 95 percent of the time. No congressional or state legislative
    district fails this test; that is, for these districts, the 5-percentage-point criterion holds 100
    percent of the time.
