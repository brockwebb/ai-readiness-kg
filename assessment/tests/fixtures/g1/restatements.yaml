- prop: g1h-das-dp-001
  family: dp
  class: DP_NOISE
  mode: direct
  expect_level: 4
  expect_failure: null
  expect_estimate: exact
  expect_family_level: 4
  evidence: assessment/evidence/g1/holdout/g1h-das-dp-001.direct.DP_NOISE.g1-v0-2026-09-02.claude-opus-5.json
  text: '**ε ≈ 19.61** — that is the global privacy-loss budget the 2021-06-08 file was produced under, so it''s the parameter attached to every difference statistic computed from it, including the ≤5-percentage-point
    / 95%-of-the-time result for block groups of 450+.


    Breakdown of that budget (Census Bureau''s announced production TopDown settings, which the June 8, 2021 demonstration product implemented):


    | Component | ρ (zCDP) | ε equivalent |

    |---|---|---|

    | Person tables | 2.56 | 17.14 |

    | Housing-unit tables | 0.07 | 2.47 |

    | **Total** | **2.63** | **19.61** |


    Two things worth flagging about the question as posed:


    1. There is no per-threshold epsilon. The DAS applies one global budget to the whole file; the 450-person block-group threshold is an *output* of the analysis (the population size at which noise from
    that fixed ε stops moving the largest group''s share by more than 5 points, 95% of the time), not a setting that varies by geography size. The same ε = 19.61 governs the MCD/place 200-person threshold
    and the 100%-pass rate for congressional and legislative districts.


    2. ε and ρ are not interchangeable dials. The Bureau allocated in ρ (zero-concentrated DP); 19.61 is the converted ε at δ = 10⁻¹⁰. If the surrounding document quotes 2.63, that''s the same budget in
    the native unit.


    Caveat on verification: web search was denied in this session, so I answered from knowledge rather than pulling the Bureau''s DAS parameter release live. If this is going into a citable document, confirm
    against the Census Bureau''s "2020 Census Disclosure Avoidance System Privacy-Loss Budget Allocation" documentation for the June 2021 vintage — vintage-to-epsilon mapping is exactly the kind of detail
    that gets miscopied across the demonstration series (2020-05-27, 2020-11-18, 2021-04-28, 2021-06-08 each differ).'
  note: 'v1 parser miss (v1 RESULT §6): the coverage figure is written ''≤5-percentage-point / 95%-of-the-time''; v2 reads the hyphenated coverage phrase and the hyphenated unit.'
- prop: g1-acs-ci-003
  family: interval
  class: CI
  mode: indirect
  expect_level: 3
  expect_failure: null
  expect_estimate: exact
  expect_family_level: 3
  evidence: assessment/evidence/g1/acs-ch7-colorado.indirect.indirect.g1-v0-2026-09-02.claude-opus-5.json
  text: '## Understanding Margin of Error in ACS Data — Plain Language Version


    **What a margin of error tells you**


    The American Community Survey (ACS) asks a sample of people questions rather than counting everyone, so its numbers are estimates, not exact counts. The margin of error (MOE) tells you how close that
    estimate probably is to the real number for the whole population.


    The Census Bureau publishes MOEs at a 90 percent confidence level. Add and subtract the MOE from the estimate, and you get a range — the confidence interval — that should contain the true value about
    90 percent of the time.


    **A worked example**


    The 2015 ACS 1-year estimates say Colorado had 564,757 one-person households, with an MOE of 10,127.


    - Lower bound: 564,757 − 10,127 = **554,630**

    - Upper bound: 564,757 + 10,127 = **574,884**


    So we can be 90 percent confident the true number falls between roughly 554,600 and 574,900. Put another way: if the survey were repeated 100 times, about 90 of those estimates would land inside that
    range.


    The smaller the MOE compared to the estimate itself, the narrower the range — and the more precise the estimate.


    **A caution about the edges of the range**


    Confidence intervals can produce results that don''t make sense in the real world. If an estimate is close to zero, subtracting the MOE may give a negative number — but there''s no such thing as a negative
    number of people, so report the lower bound as zero. Similarly, a percentage can''t exceed 100 percent. (Some measures, like income, *can* legitimately be negative.) Always sanity-check the range against
    what the number actually represents.


    **Two related measures**


    *Standard error (SE)* measures how much an estimate is likely to bounce around simply because it came from a sample. It''s the building block behind the MOE, and you get it by dividing the MOE by 1.645.
    For the Colorado example: 10,127 ÷ 1.645 ≈ 6,156.


    Standard error depends on how varied the population is and how big the sample is. Bigger samples mean smaller standard errors — which is exactly why the Census Bureau publishes estimates for small places
    only by pooling several years of data together. More years means more sample, which means more reliable numbers.


    *Coefficient of variation (CV)* expresses the standard error as a percentage of the estimate itself, which makes it easy to compare reliability across very different numbers. For Colorado: 6,156 ÷ 564,757
    ≈ 1.1 percent.


    A small CV means the sampling error is small relative to the estimate — the number is reliable. A large CV means the error is nearly as big as the estimate itself, and the number should be treated with
    caution. Because CVs are percentages, most people find them easier to compare across a set of estimates than raw standard errors.'
  note: 'v1 parser miss (v1 RESULT §6): the exact ''MOE of 10,127'' was outranked by the rounded bounds ''roughly 554,600 and 574,900'' because CI candidates pre-empted ±-form candidates; v2 ranks every
    interval-form candidate together, so the exact ± scores the bounds-form source L3 (bounds_to_pm) and the coarser bounds are not chosen.'

