- prop: g1h-lfs-ci-001
  family: interval
  mode: indirect
  compression: null
  evidence: assessment/evidence/g1/lfs-ci-example.indirect.indirect.g1-v0-2026-09-02.claude-opus-5.json
  text: '**Understanding the numbers behind employment estimates**


    Employment figures are based on a survey, not a count of every worker. Because a survey only reaches a sample of people, its results come with a margin of uncertainty. Statisticians measure that uncertainty
    with a number called the standard error, and use it to build a range — a "confidence interval" — around the reported figure.


    **An example**


    Suppose the reported change in total employment from one month to the next was an increase of **60,000**, with a standard error of **25,000**.


    - Adding and subtracting one standard error gives a range of **35,000 to 85,000**. There''s roughly a **2-in-3 chance (68%)** that this range contains the true change.

    - Adding and subtracting two standard errors gives a range of **10,000 to 110,000**. There''s roughly a **19-in-20 chance (95%)** that this range contains the true change.


    **Deciding whether a change is real**


    The point of these ranges is to answer a practical question: did employment actually change, or does the number just reflect the luck of which people happened to be surveyed?


    The rule of thumb is simple. Look at the 95% range:


    - **If the range does not include zero**, the change is treated as real — statisticians call it "statistically significant." In the example above, the range runs from 10,000 to 110,000, which is entirely
    above zero, so the 60,000 increase counts as a genuine change.

    - **If the range does include zero**, the apparent change may well be noise from sampling, and shouldn''t be read as real movement.


    In general, the bigger a reported change is compared with its standard error, the more confident we can be that something actually happened. And when we say a result is significant "at the 5% level,"
    we mean there''s about a 5% risk of calling a change real when nothing actually changed.'
  expect_estimate: exact
  expect_family_level: 3
  expect_outcome: pass
  expect_failure: null
  expect_form: CI
