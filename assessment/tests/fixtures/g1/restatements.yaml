v2_cases:
- prop: g1h-ons-ci-001
  family: interval
  class: SE
  mode: indirect
  expect_level: 3
  expect_failure: null
  expect_estimate: rounded
  expect_family_level: 3
  evidence: assessment/evidence/g1/ons-ci-education.indirect.indirect.g1-v0-2026-09-02.claude-opus-5.json
  text: '## Plain-language version


    In 2016, the UK''s private education industry brought in around **£42.6 billion** in total turnover.


    That figure comes from a survey, not a full count of every business, so it carries some uncertainty. Statisticians measure that uncertainty with a "confidence interval" — a range around the estimate
    that reflects how much the number might shift if a different sample had been surveyed.


    For this estimate, the range runs from about **£41.6 billion to £43.7 billion** (the estimate give or take roughly £1.0 billion).


    What that range means: if you repeated the survey 20 times, drawing a fresh random sample each time, and worked out a range like this for each one, about 19 of those 20 ranges would contain the true
    figure for the whole industry, and about 1 would miss it. So a range built this way is a reliable — though not guaranteed — guide to where the true number sits.


    ## One correction to flag


    The original''s final sentence — "there is a 95% chance that the true population value lies between £41,616 million and £43,682 million" — is the standard misreading of a confidence interval, and it
    contradicts the sentence just before it.


    The 95% describes the *method*, not this particular interval. The true value is a fixed (if unknown) number; it either falls inside this specific range or it doesn''t. What''s random is which interval
    the sampling procedure produced. Saying "95% chance the true value is in *this* range" is a Bayesian credible-interval statement, which requires a prior and is not what was calculated here.


    I dropped that sentence from the restatement rather than reproducing it. If you want the intuition it was reaching for, the honest general-audience phrasing is: *"we can be 95% confident the true figure
    lies in this range,"* where "confident" points at the track record of the method.'
  note: 'v1 scorer: L0 binding_error (the ''give or take roughly £1.0 billion'' is bound to £43.7bn, another number); reviewer: genuine omission of the £526.8 million SE. D10: a candidate anchored on another
    estimate is not this estimate''s; no bound candidate -> L1 omission. Family verdict is on `interval` (SE + CI published): the CI form is scored on the same response and the family takes the best form.'
- prop: g1h-acs-cv-002
  family: relative
  class: CV
  mode: indirect
  expect_level: 1
  expect_failure: omission
  expect_estimate: wrong
  expect_family_level: 1
  evidence: assessment/evidence/g1/holdout/acs-ch8-loudoun-82.indirect.indirect.g1-v0-2026-09-02.claude-opus-5.json
  text: '## What this table is


    It''s an excerpt from the U.S. Census Bureau''s American Community Survey, Table B19001 — a count of **households sorted into 16 income brackets**, with income stated in 2015 dollars. The excerpt doesn''t
    name the place it covers.


    ## How to read the numbers


    Each row runs: bracket name, an unlabeled marker column, then four numbers.


    Taking the first row — `Less than $10,000 — 2,163 ±812  494  22.8`:


    - **2,163** — the estimated number of households in that bracket.

    - **±812** — the margin of error. The survey polls a sample, not everyone, so the true count is very likely (90% confidence) somewhere between about 1,350 and 2,975.

    - **494** — the standard error, the raw statistical version of that same uncertainty.

    - **22.8** — the coefficient of variation: the standard error as a percentage of the estimate. It''s a plain-English reliability score. Under ~15% is solid; 20–30% means treat the number as a rough
    indication, not a fact.


    The marker column (`–` for most rows, `1`, `2`, or `3` for a handful of middle brackets) is a footnote flag whose key isn''t included in the excerpt, so I can''t say what it denotes.


    ## What the numbers say


    Total: about **120,600 households**. The distribution is strongly weighted toward the top:


    | Income | Households | Share |

    |---|---|---|

    | Under $50,000 | ~17,600 | 15% |

    | $50,000–$99,999 | ~27,800 | 23% |

    | $100,000 and up | ~75,100 | 62% |

    | — of which $200,000+ | ~29,400 | 24% |


    The single largest bracket is **$200,000 or more**, with roughly 29,400 households — nearly a quarter of the total, and more than the entire under-$50,000 population combined. The median household sits
    right around **$125,000**.


    Reliability tracks the same pattern. The low-income brackets are small and thinly sampled, so their coefficients of variation run 20–30% — the individual counts there are shaky, even though the overall
    picture of "few low-income households" is sound. The high-income brackets are large and well-measured, with coefficients of variation of 6–8%.


    Two caveats: the totals and percentages above are my arithmetic on the published brackets, and they inherit the same sampling uncertainty as the rows they''re built from. And the incomes are in 2015
    dollars — roughly a third below today''s purchasing power.'
  note: 'v1 scorer: L0 quantity_hallucination (matched the summary band ''coefficients of variation of 6'' to the $15,000–$19,999 row''s 30.1); reviewer: the row is never restated. D10: nothing binds the
    band to this estimate -> L1 omission.'
