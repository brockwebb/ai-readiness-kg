     text: "Colorado had 564,757 one-person households in 2015; the state also had 2,100,000 households in total, ±10,127."}
  - {prop: g1-acs-moe-001, class: MOE, expect_outcome: unparseable, expect_estimate: exact,
     text: "Colorado had 564,757 one-person households in 2015, though the figure carries some sampling error and a margin of error is published with it."}
