- prop: g1v2-lfs-ab-employment-rate
  family: interval
  mode: indirect
  compression: none
  evidence: assessment/evidence/g1/v2/dev/lfs-2026-07-alberta.indirect.indirect.g1-v2-2026-09-03.claude-opus-5.json
  text: '## Alberta''s job market, July 2026


    *(Statistics Canada Labour Force Survey, seasonally adjusted. All figures come from a monthly sample survey, so each one carries a margin of error.)*


    **The basics**


    Alberta had about **4.15 million people aged 15 and over**. Of those:


    - **2.87 million were in the labour force** — meaning they either had a job or were actively looking for one.

    - **2.67 million were working**: 2.20 million full-time and 467,000 part-time.

    - **202,000 were unemployed** — without work but looking for it.

    - The remaining ~1.28 million were outside the labour force entirely: retirees, students, people caring for family, people not currently job-hunting.


    **The three headline rates**


    | Rate | Value | What it means |

    |---|---|---|

    | Unemployment rate | **7.0%** | Of everyone who wanted a job, 7 in 100 couldn''t find one |

    | Participation rate | **69.2%** | About 7 in 10 adults were working or job-hunting |

    | Employment rate | **64.3%** | About 64 in 100 adults actually had a job |


    **A note on precision.** These are survey estimates, not a headcount, and the file reports the uncertainty alongside each number. The unemployment rate''s standard error is 0.4 points, so the true figure
    is roughly **7.0% ± 0.8** at conventional (95%) confidence — somewhere in the low-6s to high-7s. The employment figure of 2,670,000 carries a standard error of about 19,800, so it''s good to within
    roughly ±40,000. Month-to-month wiggles smaller than that aren''t real news.


    "Seasonally adjusted" means the numbers have been smoothed to remove predictable annual patterns — summer student hiring, holiday retail, construction slowdowns in winter — so this month can be compared
    fairly against any other month.


    **One caveat on scope:** this is the all-genders, all-ages-15-and-over total. The file doesn''t break the numbers out by gender or age group, so it can''t say whether, for example, youth unemployment
    differs from the 7.0% overall figure.'
  expect_estimate: exact
  expect_family_level: 1
