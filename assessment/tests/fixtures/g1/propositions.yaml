  acs-filtering-rule: For both base and collapsed detailed tables, a table is filtered out if the median
    CV value for the table is greater than 0.61, or in other words, if more than half of the estimates
    in it have a CV greater than 0.61, suggesting very low reliability. A CV greater than 0.61 is equivalent
    to saying the estimate is not significantly different from zero at the 90 percent confidence level.
    Zero estimates, which have an undefined CV, are assigned a CV of 1.0 for determining the median CV.
    Only lines at the lowest level of detail in a table are included in the calculation of the median
    CV.
