  lfs-reliability-categories: '**Guidelines on data reliability** Household surveys within Statistics
    Canada generally use the following guidelines and reliability categories in interpreting CV values
    for data accuracy and in the dissemination of statistical information. **Category 1** – If the CV
    is ≤ 16.5% – no release restrictions: data are of sufficient accuracy that no special warnings to
    users or other restrictions are required. **Category 2** – If the CV is > 16.5% and ≤ 33.3% – release
    with caveats: data are potentially useful for some purposes but should be accompanied by a warning
    to users regarding their accuracy. **Category 3** – If the CV > 33.3% – not recommended for release:
    data contain a level of error that makes them so potentially misleading that they should not be released
    in most circumstances. If users insist on inclusion of Category 3 data in a non-standard product,
    even after being advised of their accuracy, the data should be accompanied by a disclaimer. The user
    should acknowledge the warnings given and undertake not to disseminate, present or report the data,
    directly or indirectly, without this disclaimer.'
