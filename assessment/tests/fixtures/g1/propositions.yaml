passages:
  acs-ch7-colorado: 'A margin of error (MOE) describes the precision of an ACS estimate at a given level
    of confidence. The confidence level associated with the MOE indicates the likelihood that the ACS
    sample estimate is within a certain range (the MOE) of the population value. The MOEs for published
    ACS estimates are provided at a 90 percent confidence level. From these MOEs, data users can easily
    calculate 90 percent confidence intervals that define a range expected to contain the true or population
    value of an estimate 90 percent of the time. For example, in the Data Profile for Selected Social
    Characteristics (Table DP02) for Colorado, a portion of which is shown in Figure 7.1, data from the
    2015 ACS 1-year estimates indicate that there were 564,757 one-person households in the state in 2015
    with an MOE of 10,127. By adding and subtracting the MOE from the point estimate, we can calculate
    the 90 percent confidence interval for that estimate: 564,757 – 10,127 = 554,630 = Lower bound of
    the interval 564,757 + 10,127 = 574,884 = Upper bound of the interval 56 U.S. Census Bureau, American
    Community Survey, Sample Size and Data Quality, <www.census.gov/acs/www/methodology/sample-size -and-data-quality/>.
    54 Understanding and Using American Community Survey Data 54 What All Data Users Need to Know U.S.
    Census Bureau 564,757 – 10,127 = 554,630 = Lower bound of the interval 564,757 + 10,127 = 574,884
    = Upper bound of the interval Source: U.S. Census Bureau, data.census.gov, Table DP02: “Selected Social
    Characteristics in the United States.” Figure 7.1. Sample Estimates and Margins of Error in Data.census.gov:
    2015 Therefore, we can be 90 percent confident that the true number of one-person households in Colorado
    in 2015 falls somewhere between 554,630 and 574,884. Put another way, if the ACS were independently
    conducted 100 times in 2015, sampling theory suggests that 90 times the estimate of one-person households
    in Colorado would fall in the given confidence interval. Estimates with smaller MOEs—relative to the
    value of the estimate—will have narrower confidence intervals indicating that the estimate is more
    precise and has less sampling error associated with it. TIP: When constructing confidence intervals
    from MOEs, data users should be aware of any “natural” limits on the upper and lower bounds. For example,
    if a population estimate is near zero, the calculated value of the lower confidence bound may be less
    than zero. However, a negative number of people does not make sense, so the lower confidence bound
    should be reported as zero instead. For other estimates, such as income, negative values may be valid.
    Another natural limit would be 100 percent for the upper confidence bound of a percent estimate. Data
    users should always keep the context and meaning of an estimate in mind when creating and interpreting
    confidence intervals. Standard Errors and Coefficients of Variation A standard error (SE) measures
    the variability of an estimate due to sampling and provides the basis for calculating the MOE. The
    SE provides a quantitative measure of the extent to which an estimate derived from a sample can be
    expected to deviate from the value for the full population. SEs are needed to calculate coefficients
    of Understanding and Using American Community Survey Data 55 What All Data Users Need to Know 55 U.S.
    Census Bureau variation and to conduct tests of statistical significance. Data users can easily calculate
    the SE of an ACS estimate by dividing the positive value of its MOE by 1.645 as shown below:57 (1)
    Using the data in Table 7.1, the SE for the number of one-person households in Colorado in 2015 would
    be: The SE for an estimate depends on the underlying variability in the population for that characteristic
    and the sample size used for the survey. In general, the larger the sample size, the smaller the SE
    of the estimates produced from the sample data. This relationship between sample size and SE is the
    reason that ACS estimates for less populous areas are only published using multiple years of data.
    Combining data from multiple ACS 1-year files increases sample size and helps to reduce SEs. Coefficients
    of variation are another useful measure of sampling error. A coefficient of variation (CV) measures
    the relative amount of sampling error that is associated with a sample estimate. The CV is calculated
    as the ratio of the SE for an estimate to the estimate itself and is usually expressed as a percent:
    (2) A small CV indicates that the SE is small relative to the estimate, and a data user can be more
    confident that the estimate is close to the population value. The CV is also an indicator of the reliability
    of an estimate. When the SE of an estimate is close to the value of the estimate, the CV will be larger,
    indicating that the estimate has a large amount of sampling error associated with it and is not very
    reliable. For the example of one-person households in Colorado, the CV would be calculated as: 58
    A CV of 1.1 percent indicates that the ACS estimate of one-person households in Colorado has a relatively
    small amount of sampling error and is quite reliable. Data users often find it easier to interpret
    and compare CVs across a series of ACS estimates than to interpret and compare SEs.'
  acs-ch7-significance: 'The example below shows how to determine if the difference in the estimated percentage
    of householders age 65 or older who live alone between Florida (estimated percentage = 12.6, MOE =
    0.2) and Arizona (estimated percentage = 10.5, MOE = 0.3) is statistically significant, based on 2015
    ACS data. Using formula (1) above, first calculate the corresponding standard errors for Florida (0.122)
    and Arizona (0.182) by dividing the MOEs by 1.645. Then, using formula (3) above, calculate the test
    value as follows: Understanding and Using American Community Survey Data 57 What All Data Users Need
    to Know 57 U.S. Census Bureau Since the test value (9.581) is greater than the critical value for
    a confidence level of 90 percent (1.645), the difference in the percentages is statistically significant
    at a 90 percent confidence level. A rough interpretation of the result is that the user can be 90
    percent certain that a difference exists between the percentage of householders aged 65 or older who
    live alone in Florida and in Arizona. By contrast, if the corresponding estimate for Indiana (estimated
    percentage = 10.8, MOE = 0.2, SE = 0.122) were compared with the estimate for Arizona, formula (3)
    would yield: Since the test value (1.369) is less than the critical value for a confidence level of
    90 percent (1.645), the difference in percentages is not statistically significant. A rough interpretation
    of the result is that the user cannot be certain to any sufficient degree that the observed difference
    in the estimates between Indiana and Arizona was not due to chance.'
  acs-ch8-loudoun-83: 'Data.census.gov includes a collapsed income distribution within Demographic Profile
    DP03 that makes it possible to assess the difference in results from the approximation method illustrated
    above versus a direct estimation method that accounts for covariance between the component estimates
    of the subgroups. The relevant portion of this data.census.gov table, from the 2015 ACS 1-year estimates,
    is shown in Table 8.3 below. Table 8.3. Data From Demographic Profile DP03 for Loudoun County, Virginia:
    2015 Household income category Subgroup # Estimate MOE SE CV $15,000 to $24,999 .... 1 3,497 ±1,037
    630 18.0 $25,000 to $34,999 .... 2 3,537 ±973 591 16.7 $35,000 to $49,999 .... 3 7,270 ±1,554 945
    13.0 Source: U.S. Census Bureau, data.census.gov, Table DP03: “Selected Economic Characteristics.”
    While the MOEs, SEs, and CVs for new Subgroup 1 and Subgroup 3 are almost identical to those derived
    from the approximation method, this is not the case for new Subgroup 2. The user-derived MOE is ±931
    compared with the published MOE of ±973, and the derived CV is only 16.0 percent compared with a CV
    of 16.7 percent based on the published MOE for Subgroup 2.'
  acs-ch8-product: 'In some instances, data users may need to derive an estimate by multiplying a published
    count by a published percentage. For example, a data user might be interested in the number of 1-unit
    detached owner-occupied housing units in a geographic area. In 2015, the number of owner-occupied
    housing units in the United States was 74,506,512 with an MOE of 228,238, and the percent of 1-unit
    detached owner-occupied housing units was 82.4 (0.824) with an MOE of 0.1 percent (0.001). 66 So,
    the number of 1-unit detached owner-occupied housing units was 74,506,512 * 0.824 = 61,393,366. The
    formula to calculate the MOE of a product is: (9) Substituting the estimates and their respective
    MOEs in formula (9) yields: To obtain the lower and upper bounds of the 90 percent confidence interval
    around 61,393,366, add and subtract the MOE from 61,393,366. Thus, the 90 percent confidence interval
    for this estimate is [61,393,366 – 202,289] to [61,393,366 + 202,289] or 61,191,077 to 61,595,655.
    Using formula (2), the SE of the product is 202,289 / 1.645 = 122,972. Using formula (4), the coefficient
    of variation for this derived estimate is (122,972 / 61,393,366) * 100 = 0.2 percent, indicating that
    the derived estimate is very reliable.'
  acs-ch8-tricounty: 'The example below shows how to calculate the MOE and SE for the estimated number
