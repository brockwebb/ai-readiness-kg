  lfs-ci-example: The lower and upper bounds of a 68% confidence interval can be computed by adding or
    subtracting one standard error (25,000) from 60,000. This means that there are approximately two chances
    in three (68%) that the range (35,000 to 85,000) contains the real value of the change between the
    two months. * A 95% confidence interval can be constructed by adding and subtracting 50,000 (two standard
    errors) from 60,000. This means that there are approximately nineteen chances in twenty (95%) that
    the range (10,000 to 110,000) contains the real value of the change between the two months. **Conducting
    hypothesis tests** Standard errors may also be used to perform hypothesis testing, a procedure that
    can be used for comparing population parameters using sample estimates. The larger the observed change
    between two estimates relative to its standard error, the better the chance that we are observing
    a real change as opposed to a change due to sampling variability. One simple way to conduct a hypothesis
    test is with a confidence interval. If the 95% confidence interval of an observed estimate of change
    does not contain zero, then the change is considered statistically significant at the 5% level of
    significance. The level of significance is the probability of concluding that there is a change, when
    in fact the actual change is zero. If the confidence interval of the estimate does contain zero, it
    is less likely to reflect a real change and more likely to be due to sampling variability. To illustrate,
    let us say that between two months, the published estimate for total employment increased by 60,000
    and the associated standard error for the movement estimate was 25,000. Since the 95% confidence interval
    (10,000 to 110,000) does not contain zero, this change in employment is considered significant at
    the 5% level of significance.
