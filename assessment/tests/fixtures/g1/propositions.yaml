    Never-married females living in Fairfax County (Component 1) ................................. 135,173
    ±3,860 Never-married females living in Arlington County (Component 2) .................................
    43,104 ±2,642 Never-married females living in Alexandria City (Component 3) ..................................
    24,842 ±1,957 Source: U.S. Census Bureau, data.census.gov, Table B12001: “Sex by Marital Status for
    the Population 15 Years and Over.” 60 Understanding and Using American Community Survey Data 60 What
    All Data Users Need to Know U.S. Census Bureau The aggregate estimate is: Obtain MOEs of the component
    estimates: MOE (Fairfax) = ±3,860 MOE (Arlington) = ±2,642 MOE (Alexandria) = ±1,957 Using formula
    (1), calculate the MOE for the aggregate estimate: Thus, the derived estimate of the number of never-married
    females living in the three Virginia counties/independent cities that border Washington, DC, is 203,119,
    and the MOE for the estimate is ±5,070. The SE of this derived estimate can be calculated from the
    SEs of the component estimates as follows: 1. Calculate the SE of each component estimate from its
    MOE using: (2) SE (Fairfax) = 3,860 / 1.645 = 2,347 SE (Arlington) = 2,642 / 1.645 = 1,606 SE (Alexandria)
    = 1,957 / 1.645 = 1,190 2. Calculate the SE of the aggregate estimate: (3) With the three component
    estimates in this example, this becomes: To assess the reliability of this derived estimate, users
    may find it helpful to calculate the CV as follows: (4) Understanding and Using American Community
    Survey Data 61 What All Data Users Need to Know 61 U.S. Census Bureau This CV indicates that the sampling
    error of this estimate is very small relative to the estimate itself, so the number of never-married
    females residing in the Virginia tri-county area bordering Washington, DC, can be considered a very
    reliable estimate.'
  das-county-accuracy: The latest PPMF vintage 2021-06-08 is the Production Settings run, which uses the
    same software and settings for the 2020 production run of the redistricting data. Users can compare
    tabulated values from the PPMFs to published 2010 data to identify the amount of uncertainty that
    can be expected for a given geography or characteristic. Users can also calculate new measures of
    the spread of the uncertainty. For example, comparing tabulations from the PPMFs with the published
    2010 data will show that 90 percent of counties have a privacy-protected total population that is
    within ± four people of their published total population.
