  nchs175-standard: Table. NCHS Data Presentation Standards for Proportions Statistic Standard Sample
    size Estimated proportions should be based on a minimum denominator sample size and effective denominator
    sample size (when applicable) of 30. Estimates with either a denominator sample size or an effective
    denominator sample size (when applicable) less than 30 should be suppressed. If the number of events
    is 0 (or its complement 1 ), then the denominator sample size should be used to obtain confidence
    intervals. If all other criteria are met for presentation, an estimate based on 0 events (or its complement
    1 ) should be flagged for statistical review by the clearance official. The review could result in
    either the presentation or the suppression of the proportion. Confidence interval If the sample size
    criterion is met, calculate a 95% two-sided confidence interval using the Clopper-Pearson method,
    or the Korn-Graubard method for complex surveys, and obtain its width. Small absolute confidence interval
    width If the absolute confidence interval width is greater than 0.00 and less than or equal to 0.05,
    then the proportion can be presented if the number of events is greater than 0 and the degrees of
    freedom criterion (below) is met. If the number of events is 0 (or its complement 1 ) or the degrees
    of freedom criterion is not met, then the estimate should be flagged for statistical review by the
    clearance official. The review could result in either the presentation or the suppression of the proportion.
    Large absolute confidence interval width If the absolute confidence interval width is greater than
    or equal to 0.30, then the proportion should be suppressed. Relative confidence interval width If
    the absolute confidence interval width is between 0.05 and 0.30 and the relative confidence interval
    width is more than 130%, then the proportion should be suppressed. Relative confidence interval width
    If the absolute confidence interval width is between 0.05 and 0.30 and the relative confidence interval
    width is less than or equal to 130%, then the proportion can be presented if the degrees of freedom
    criterion below is met.
  nchs200-previous-guidelines: Before the release of the current standards, the presentation guidance
    for NVSS was to suppress rates with fewer than 20 events in the numerator when using population denominators
    that were decennial census or postcensal or intercensal population estimates (5,6). This 20-event
    threshold for vital rates corresponds to an RSE of 23% for a Poisson-distributed count variable. For
    a Poisson variable, SE is the square root of the number of events. For rates using census population
    denominators estimated from CPS or ACS where the sampling variability needs to be considered, RSE
    of the rate was used to determine its reliability for presentation. Rates with an RSE of 23% or more
    were suppressed or flagged for internal review (20). Age-adjusted death rates followed the guidelines
    above and were presented if the number of events on which the rate was based was 20 or more, or when
    populations were estimated from surveys where RSE was less than 23% (5). National Health Care Surveys
    At NCHS, health care surveys account for nearly all rates produced and distributed from survey data.
    Denominators for most of these rates are decennial census or postcensal or intercensal population
    counts. Historically, rates from the National Health Care Surveys were suppressed when based on a
    sample size less than 30, that is, fewer than 30 sample observations in the numerator. Rates were
    flagged as unreliable if RSEs were greater than 30%. Combined, these criteria were known as the “30/30
    rule” (7,8). Rates A. Sources of variation Both the numerator and denominator may be subject to several
    sources of variation . When either the numerator or denominator count is estimated from a survey,
    it will be subject to sampling variability. Even when the actual number of events in the numerator
    or the size of the population at risk in the denominator is recorded and free from sampling variability,
    natural (or stochastic) variability exists in the realized values (18). For a numerator or denominator
    that is enumerated from vital statistics and free of sampling variability, the number of events (as
    in deaths or births) will be assumed to arise from a Poisson distribution (5,6,19). For a denominator
    that is enumerated from a decennial census or a postcensal or intercensal population estimate, some
    natural variability may exist in the realized value; however, such random variation will be negligible
    and will not be considered in calculations. Rates and Counts at NCHS Counts produced by NCHS include
    numbers of deaths and births, numbers of visits to hospitals and other health care settings, and,
    in some cases, numbers of people with specific health outcomes, including health conditions, risk
    factors, and access to care measures. Counts of deaths and births from NVSS are obtained from registers
    of events. Counts of visits from the National Health Care Surveys, and counts of people with specific
    health outcomes from population health surveys, are estimated using appropriate methods for sample
    surveys; examples are available elsewhere (7,8). Rates regularly calculat ed from NVSS and the National
    Health Care Surveys include birth and death rates and health care visit rates, respectively. In many
    cases, the rates are published alongside corresponding counts. For most NVSS rates produced at NCHS,
    the denominator is a decennial census or postcensal or intercensal population estimate, which is relatively
    free of random variation. However, for rates for some subpopulations, including Hispanic subpopulations,
    and for some demographic groupings, such as by education level, the population estimates are calculated
    from a survey, such as ACS or the U.S. Census Bureau's Current Population Survey (CPS). In these cases,
    the sampling variability in the corresponding denominator needs to be considered when calculating
    SE and other measures of uncertainty around the rate (19). Rates from the National Health Care Surveys
    typically include visit rates to hospitals and health care providers (7,8). The counts in the numerators
    obtained from the National NATIONAL CENTER FOR HEALTH STATISTICS 4 Series 2, Number 200 of the same
    size (21). The e ffective sample size is more informative than the nominal sample size for complex
    surveys because it incorporates information about the design, which has important implications for
    statistical power and reliability of estimates. ● When the number of events or population estimates
    are estimated from a complex survey using sample weights, such as from the National Health Care Surveys,
    NHIS, or ACS, the sample-weighted estimates of the number of events or population are not the same
    as the corresponding nominal sample sizes or effective sample sizes. In these cases, nominal sample
    sizes and effective sample sizes are used to determine reliability, not the sample-weighted estimates
    of the events or population; see "B. Design effect." with survey-based numerators from health care
    surveys and survey-based population denominators had been uncommon, so decisions for these cases were
    developed on a case-by-case basis. Similarly, counts were suppressed when based on fewer than 30 sample
    observations and flagged as unreliable if the RSE was greater than 30%.
  ons-ci-education: 'In 2016, the UK private education industry was estimated to have generated a total
    turnover of £42,649 million. The standard error for this estimate is £526.8 million. The 95% confidence
    interval around this estimate is calculated as: Margin of error = 1.96 × £526.8 million = £1,032.5
    million The 95% confidence interval is therefore £42,649 million plus or minus £1,032.5 million, which
    equals £41,616 million and £43,682 million respectively. This means that if we drew 20 random samples
    and calculated an analogous confidence interval for each, on average, 19 out of 20 (95%) would contain
    the true population value and 1 in 20 (5%) would not. Therefore, there is a 95% chance that the true
    population value lies between £41,616 million and £43,682 million.'
  ons-ci-employment: Estimates for July to September 2019 show 32.75 million people aged 16 years and
    over in employment in the UK, with a confidence interval of plus or minus 177,000 people based on
    the results from a sample. If we took a large number of samples repeatedly, 95% of the confidence
    intervals would contain the unknown population estimate.
  ons-cv-examples: 'The total turnover of plastering businesses in the UK was estimated at £2,322 million
    in 2016, with a standard error of £201 million. A different survey estimated that the total number
    of people employed full-time in agriculture, forestry and fishing in the UK was 155,000 in 2016, with
    a standard error of 12,400 employees It is difficult to compare these two standard errors. By calculating
    the coefficient of variation for each, the results show that both estimates have a similar level of
    precision: * £201 million divided by £2,322 million equals 0.087 – a coefficient of variation of 8.7%
    * 12,400 divided by 155,000 equals 0.08 – a coefficient of variation of 8%'
  ons-se-table1: 'Table 1: Total turnover estimates, standard error and relative standard error for education
    and water and waste management, UK, 2016 Total turnover in | Standard error in | Relative standard
    error (or coefficient of variation)2 ---|---|--£ millions1 | £ millions2 Industry 1: Education (private
    provision only) | 42,649 | 526.8 | 0.01 (or 1%) Industry 2: Water supply; sewerage, waste management
    and remediation activities | 34,677 | 222.7 | 0.01 (or 1%)'
