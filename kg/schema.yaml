# ai-readiness-kg extraction schema v0.1
# Transcribed from docs/schema_v0.1.md sections 2-4. Source of truth is that doc.
# Transcription only — no invention. Bump this version via the proposed_relationships
# review process (schema_v0.1.md section 6), never by silent edit.
#
# Changelog:
#   2026-07-03 (task 2026-07-03_extraction_module, rider R1): added `intergovernmental`
#     to Document.source_type for policy bodies (OECD, UNESCO, UNDP, IADB, PARIS21,
#     EU JRC, UN). Standards bodies / SDOs (ITU, ISO) remain `standard`. Schema still
#     draft/unlocked, so the value is added directly rather than via version bump.
#   2026-07-03 (task 2026-07-03_schema_v02_promotion_rebaseline, §9 pilot audit): v0.2.
#     Append-only edge additions from the Fable pilot's proposed_relationships inventory:
#     uses_measure, measures (extended to Concept endpoints), has_component, subtype_of,
#     precedes. Each carries an external_alignment URI. No new node types — Organization
#     and Project were proposed but REJECTED in the audit (document scope is a property,
#     not a node forest; external ontologies are referenced, never imported).
#   2026-08-21 (task 2026-08-21_v03_visibility_kernel, AUTH-1 / DD-009): v0.3.
#     Append-only. The machine-visibility / machine-actionability literature (SEO, GEO/AIO,
#     web standards, platform crawler behavior, federal digital guidance) joins THIS graph
#     (one graph, DD-009). Node types added: Practice, Tool, Platform. Properties added:
#     Claim.evidence_grade (REQUIRED on every Claim under 0.3 — absent = quarantine, DD-010),
#     Measure.tier (optional, enum-enforced when present), Document.source_type += practitioner.
#     Edge types added: recommends, supported_by, implemented_by, consumes, applies_to,
#     targets, supersedes. Nothing existing renamed or removed.
#   2026-08-22 (task 2026-08-22_kernel_tevv, Phase 0): v0.3.1. Append-only property:
#     Document.is_platform_operator (boolean, nullable) — true when the issuing organization
#     operates a search engine, crawler, CDN/bot-control product, or LLM retrieval system.
#     Populated by rule via `document_annotation` events (events/batch-007.jsonl), never by the
#     extractor. Exists because the kernel RESULT's grading-confusion signal conflated
#     "platform-official" with harvest clause b (DD-014).
#   2026-08-26 (task 2026-08-26_overnight_burn, Lane 0): v0.3.4. Append-only property on
#     Instrument: `grounding_spans` — a per-attribute map {attr: verbatim span} for
#     owner/year/method, required by prompt v0.3.4 whenever the attribute is filled. The
#     parser validates each span with grounding.is_grounded + grounding.covers(value);
#     a filled attribute without a covering span is NULLED AT PARSE (recorded on the item
#     as nulled_at_parse), never a quarantine of the node. Semantic edges (has_component /
#     subtype_of / consumes / extends / implements) whose span does not contain both
#     endpoint names route to proposed_relationships. Fixes the probe's reextract_required
#     strata (2026-08-22_probe_decision.md: Instrument method fabricated from world
#     knowledge F 0.25/0.17; semantic edges from page structure F 0.26).
#   2026-08-24 (task 2026-08-24_source_triage, Phase 0): v0.3.3. Append-only properties on
#     Document: `construct_arm` (enum: publication_actionability / training_data_readiness /
#     org_maturity) — which of the three survey construct arms the document primarily serves;
#     REQUIRED on manifest adds from that task onward, backfilled for the existing corpus by
#     rule via `document_annotation` events (batch-014, rule file
#     scripts/construct_arm_backfill.yaml). `grounding_surface` (enum: document / transcript /
#     slides, default document) — the surface class the grounding spans will come from; slides
#     and transcripts are admissible but flagged so their extraction quality gets its own
#     stratum in any future TEVV run. Both span_entailable: false (harness/rule-set fields,
#     never extracted).
#   2026-08-22 (task 2026-08-22_faithfulness_probe, Phase 0): v0.3.2. Append-only per-attribute
#     `span_entailable` map on every node type: true = a grounding span is expected to entail
#     the attribute's value (text, names, stewards, years, ...); false = document-derived or
#     classification fields (as_of_date, enums, ids) that a span cannot be expected to carry.
#     Read by the faithfulness probe's decomposer (facts only for true attributes) and by the
#     scoring rule (`doc_level_attribute` class excluded from F). DD-015.
schema_version: "0.3.6"

# --- Section 2: Node types -------------------------------------------------
# Each node type lists the "Key properties" column verbatim. Parenthetical
# enumerations from the doc are carried as a `values:` list on that property.
node_types:
  Document:
    what: A manifest entry. Primary source only.
    properties:
      - doc_id
      - title
      - authors
      - pub_date
      - source_type      # federal / academic / industry / standard / intergovernmental / practitioner
      - primary_url
      - content_hash
      - manifest_event_id
      - is_platform_operator   # v0.3.1: boolean, nullable; set by document_annotation events, not extraction
      - construct_arm      # v0.3.3: survey construct arm; manifest-add field / document_annotation backfill
      - grounding_surface  # v0.3.3: surface class of the grounding text (default document)
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      doc_id: false
      title: false
      authors: false
      pub_date: false
      source_type: false
      primary_url: false
      content_hash: false
      manifest_event_id: false
      is_platform_operator: false
      construct_arm: false      # v0.3.3: rule-set classification, never extracted
      grounding_surface: false  # v0.3.3: acquisition-time fact, never extracted
    property_values:
      # v0.3: practitioner = SME-authored or industry-practitioner guidance that is not a
      # vendor product page. `industry` is unchanged.
      source_type: [federal, academic, industry, standard, intergovernmental, practitioner]
      # v0.3.3 (task 2026-08-24_source_triage): the three construct arms of the FSS survey
      # validity layer. publication_actionability = making published data/content
      # discoverable, retrievable, interpretable by machine consumers (the graph's target
      # construct); training_data_readiness = readiness of data as model/AI input;
      # org_maturity = organizational AI-readiness instruments and definitional statements.
      construct_arm: [publication_actionability, training_data_readiness, org_maturity]
      # v0.3.3: slides and transcripts are admissible but flagged — their extraction quality
      # gets its own stratum in any future TEVV run.
      grounding_surface: [document, transcript, slides]

  Definition:
    what: A verbatim definition of a term as given by one source.
    properties:
      - term
      - verbatim_text
      - grounding_span
      - normative_status  # statute / policy / standard / academic / industry
      - as_of_date
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      term: true
      verbatim_text: true
      grounding_span: false
      normative_status: false
      as_of_date: false
    property_values:
      normative_status: [statute, policy, standard, academic, industry]

  Concept:
    what: Any substantive idea a document uses. Exhaustive layer, extracted first-class from event one.
    properties:
      - name
      - aliases
      - description
      - grounding_span
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      name: true
      aliases: true
      description: true
      grounding_span: false

  Construct:
    what: A measurable readiness dimension (e.g. discoverability, provenance completeness). A Concept promoted to measurability.
    properties:
      - name
      - description
      - measurement_notes
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      name: true
      description: true
      measurement_notes: true

  Instrument:
    what: An existing assessment, survey, index, or benchmark.
    properties:
      - name
      - owner
      - year
      - method
      - grounding_spans   # v0.3.4: per-attribute {attr: span} map for owner/year/method; parser nulls uncovered attributes
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      name: true
      owner: true
      year: true
      method: true
      grounding_spans: false   # v0.3.4: it IS spans (harness-validated), never itself entailed

  Measure:
    what: An individual item or metric inside an Instrument.
    properties:
      - text
      - response_type
      - grounding_span
      - tier              # v0.3, OPTIONAL: public / agency_instrumented / paid
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      text: true
      response_type: true
      grounding_span: false
      tier: false
    property_values:
      # v0.3: who can run the measure. public = runnable by anyone from outside;
      # agency_instrumented = needs agency-side analytics, scripts, or logs; paid = commercial
      # product. Optional (present when the source states or implies it); enum-enforced by
      # the parser when present.
      tier: [public, agency_instrumented, paid]

  Claim:
    what: A falsifiable assertion a document makes (X improves Y, A requires B).
    properties:
      - claim_text
      - grounding_span
      - claim_type        # empirical / normative / speculative
      - evidence_grade    # v0.3, REQUIRED: see property_values (descending strength)
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      claim_text: true
      grounding_span: false
      claim_type: false
      evidence_grade: false
    property_values:
      claim_type: [empirical, normative, speculative]
      # v0.3 (DD-010): strength of the evidence behind the claim, in DESCENDING order.
      # REQUIRED on every Claim extracted under 0.3; a Claim without it is quarantined.
      #   peer_reviewed_experiment - published, reviewed experimental result
      #   platform_official        - the platform operator's own documentation/statement
      #   measured_practitioner    - practitioner result with disclosed method and data
      #   practitioner_assertion   - practitioner statement with no disclosed method
      #   inference                - reasoned from other evidence, not observed
      evidence_grade: [peer_reviewed_experiment, platform_official, measured_practitioner,
                       practitioner_assertion, inference]
    # v0.3: properties the parser REQUIRES on every extracted node of this type (absent =>
    # quarantine). Enum properties listed in property_values are enforced only when present
    # unless also listed here. Read by parser.py — never duplicated in code.
    required_properties: [evidence_grade]

  Standard:
    what: A technical spec (DCAT, ISO 19115, schema.org, llms.txt, MCP).
    properties:
      - name
      - version
      - steward
      - as_of_date
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      name: true
      version: true
      steward: true
      as_of_date: false

  Framework:
    what: A conceptual structure (NIST AI RMF, FAIR, Data Readiness Levels).
    properties:
      - name
      - owner
      - year
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      name: true
      owner: true
      year: true

  # --- v0.3 additions (2026-08-21, AUTH-1 / DD-009; append-only) --------------
  Practice:
    what: A normative recommendation a source makes about how to publish, structure, expose, or maintain data or content for machine consumers.
    properties:
      - text
      - grounding_span
      - as_of_date
      - scope             # dataset / api / bulk_file / tool / content / advisory / site / any
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      text: true
      grounding_span: false
      as_of_date: false
      scope: false
    property_values:
      # the asset class the recommendation is about; enum-enforced by the parser when present
      scope: [dataset, api, bulk_file, tool, content, advisory, site, any]

  Tool:
    what: Software that implements one or more Measures (Lighthouse, Scrapy, pySHACL, LinkChecker, GoAccess, Spectral, extruct, GSA Site Scanning engine, DAP).
    properties:
      - name
      - steward
      - license
      - url
      - as_of_date
      - grounding_span    # §4 universal provenance (every extracted node carries it)
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      name: true
      steward: true
      license: true
      url: true
      as_of_date: false
      grounding_span: false

  Platform:
    what: A machine consumer whose behavior is targeted or described (Google Search, Bing, a named crawler, an LLM vendor's retrieval system, Cloudflare/Akamai bot controls).
    properties:
      - name
      - operator
      - as_of_date
      - grounding_span    # §4 universal provenance (every extracted node carries it)
    span_entailable:   # v0.3.2: which attributes a grounding span is expected to entail (DD-015)
      name: true
      operator: true
      as_of_date: false
      grounding_span: false

# --- Section 3: Edge types -------------------------------------------------
# from/to/meaning transcribed from the "From -> To" and "Meaning" columns.
# `pairs` is the AUTHORITATIVE, machine-enforced list of legal (from_type, to_type)
# endpoint pairs for each edge type (strict index-pairing, not the from x to cross
# product). from/to are kept for human readability. `symmetric: true` marks the doc's
# bidirectional arrow (<->). Constraint enforcement is type-validity only (schema
# section 3): an edge type not listed cannot be written; a whitelisted edge whose
# endpoints are not a legal pair is a schema-expressiveness signal, not graph data —
# the parser routes it to proposed_relationships (§9 measurement), never the graph.
#
# Changelog:
#   2026-07-03 (task 2026-07-03_pilot_extraction_run, precondition rider): added
#     explicit `pairs` to every edge type; parser now enforces strict index-pairing.
#     Cross-pair edges on a whitelisted type route to proposed_relationships.
edge_types:
  defines:
    from: Document
    to: Definition
    pairs: [[Document, Definition]]
    meaning: Source gives this definition

  mentions:
    from: Document
    to: Concept
    pairs: [[Document, Concept]]
    meaning: Concept appears substantively (not keyword match)

  asserts:
    from: Document
    to: Claim
    pairs: [[Document, Claim]]
    meaning: Source makes this claim

  about:
    from: Claim
    to: Concept
    pairs: [[Claim, Concept]]
    meaning: What the claim concerns

  operationalizes:
    from: Instrument
    to: Construct
    pairs: [[Instrument, Construct]]
    meaning: Instrument measures this dimension

  measures:
    # v0.2: extended from Measure->Construct (v0.1) to also allow Concept endpoints, per
    # the pilot audit (proposed measures/measures_concept/evaluates/assesses/operationalizes).
    from: [Measure, Instrument]
    to: [Construct, Concept]
    pairs: [[Measure, Construct], [Measure, Concept], [Instrument, Concept]]
    external_alignment: http://www.w3.org/ns/sosa/observes
    meaning: Item- or instrument-level mapping to the construct/concept it measures

  grounds:
    from: Construct
    to: Definition
    pairs: [[Construct, Definition]]
    meaning: Construct's authority traces to this definition

  extends:
    # doc: "Definition -> Definition, Framework -> Framework" (index-paired, NOT cross)
    from: [Definition, Framework]
    to: [Definition, Framework]
    pairs: [[Definition, Definition], [Framework, Framework]]
    meaning: Builds on, adds to

  conflicts_with:
    # doc: "Definition <-> Definition, Claim <-> Claim"
    from: [Definition, Claim]
    to: [Definition, Claim]
    pairs: [[Definition, Definition], [Claim, Claim]]
    symmetric: true
    meaning: Incompatible. The "no shared definition" evidence layer

  cites:
    from: Document
    to: Document
    pairs: [[Document, Document]]
    meaning: Citation within the corpus

  builds_on:
    # doc: "Standard/Framework -> Standard/Framework" (either type on either end = cross product)
    from: [Standard, Framework]
    to: [Standard, Framework]
    pairs: [[Standard, Standard], [Standard, Framework], [Framework, Standard], [Framework, Framework]]
    meaning: e.g. FCSM 25-03 builds_on OPEN Gov Data Act

  implements:
    from: Standard
    to: Concept
    pairs: [[Standard, Concept]]
    meaning: Spec realizes a concept

  # --- v0.2 additions (2026-07-03 §9 pilot audit; append-only) ---------------
  uses_measure:
    from: Instrument
    to: Measure
    pairs: [[Instrument, Measure]]
    external_alignment: https://www.w3.org/ns/sosa/   # madeBySensor / implements pattern
    meaning: Instrument uses this measure/item

  has_component:
    # part-whole ONLY, never is-a (use subtype_of for is-a). BFO has_part.
    from: [Framework, Concept]
    to: [Concept, Concept]
    pairs: [[Framework, Concept], [Concept, Concept]]
    external_alignment: http://purl.obolibrary.org/obo/BFO_0000051
    meaning: Framework/Concept has this component part (part-whole, not subclass)

  subtype_of:
    # is-a ONLY, never part-whole (use has_component for part-whole). rdfs:subClassOf.
    from: Concept
    to: Concept
    pairs: [[Concept, Concept]]
    external_alignment: http://www.w3.org/2000/01/rdf-schema#subClassOf
    meaning: Concept is a subtype (subclass) of another concept

  precedes:
    from: Concept
    to: Concept
    pairs: [[Concept, Concept]]
    external_alignment: http://purl.obolibrary.org/obo/BFO_0000063
    meaning: Concept precedes another (ordinal/temporal precedence)

  # --- v0.3 additions (2026-08-21, AUTH-1 / DD-009; append-only) --------------
  recommends:
    from: Document
    to: Practice
    pairs: [[Document, Practice]]
    external_alignment: http://www.w3.org/ns/prov#wasAttributedTo   # the Practice is attributed to the recommending Document (inverse direction)
    meaning: Source makes this normative recommendation

  supported_by:
    from: Practice
    to: Claim
    pairs: [[Practice, Claim]]
    external_alignment: http://www.w3.org/ns/prov#wasDerivedFrom
    meaning: The practice rests on this claim (the claim's evidence_grade is the strength behind the recommendation, DD-010)

  implemented_by:
    from: Measure
    to: Tool
    pairs: [[Measure, Tool]]
    external_alignment: https://www.w3.org/ns/sosa/madeBySensor
    meaning: This software computes / runs the measure

  consumes:
    from: Platform
    to: Standard
    pairs: [[Platform, Standard]]
    external_alignment: http://purl.org/dc/terms/conformsTo
    meaning: Platform reads / honors this spec

  applies_to:
    # The asset class or concept the practice/measure targets. Asset classes live as Concepts
    # anchored via §8 to DCAT 3 / schema.org terms (Dataset, Distribution, DataService,
    # DataCatalog, WebApplication, Report, DefinedTerm).
    from: [Practice, Measure]
    to: [Concept, Concept]
    pairs: [[Practice, Concept], [Measure, Concept]]
    external_alignment: http://purl.org/dc/terms/subject
    meaning: Practice/Measure targets this asset class or concept

  targets:
    from: Practice
    to: Platform
    pairs: [[Practice, Platform]]
    external_alignment: https://schema.org/audience
    meaning: Practice is aimed at this machine consumer

  supersedes:
    # Document-level replacement (newer platform/guidance doc replaces an earlier version).
    # Distinct from the `extraction_superseded` overlay event, which is about extraction runs.
    from: Document
    to: Document
    pairs: [[Document, Document]]
    external_alignment: http://purl.org/dc/terms/replaces
    meaning: Newer document replaces an earlier version

# --- Section 4: Universal provenance properties ----------------------------
# Every node and edge extracted from a document carries these. No grounding
# span, no write. Curated nodes (Construct promotions, the North Star artifact)
# carry a rationale and operator id instead (see doc section 4).
provenance_required:
  - grounding_span      # verbatim quote from the source
  - location            # section heading or page as available
  - extraction_event_id
  - model_id
  - schema_version
  - timestamp

# --- Section 5: Ledger event types -----------------------------------------
# v0.3.5 APPEND (task 2026-08-27_extraction_queue, ADDENDUM-01 §1 -> DD-027).
# Admission is not a request. `manifest_add` says a document is corpus; these say
# a document is WORK, at a priority, under a named profile. Keeping the two apart
# is what lets spend follow priority instead of arrival order (Wikidata
# proposal->review->ingest; UniProt triage->curate).
#
# Append-only: types are added here, never removed or repurposed. A consumer that
# does not know a type ignores it; a type that changes meaning breaks replay.
event_types:
  extraction_request:
    description: >
      A deliberate request to extract one admitted document, at a priority, under a
      sha-pinned profile. Refused at emit for a document the manifest has not admitted.
      Latest request per document wins in projection.
    required: [document_id, priority, requested_by, reason, profile, ts]
    optional: [superseding]
    properties:
      document_id: doc_id of a manifest-included document
      priority: int, 1 = first; lower runs earlier
      requested_by: who or what asked (operator, backfill, cli, burn driver)
      reason: free text, the sentence that justifies the spend
      profile: a key of scripts/run_profiles.yaml, sha-pinned
      superseding: re-extract even though an extraction under an older profile exists
      ts: UTC ISO-8601
  extraction_withdrawn:
    description: >
      Cancels the live request for a document. Correct-forward, never a deletion:
      the request stays on the log and the withdrawal follows it.
    required: [document_id, reason, ts]
    properties:
      document_id: doc_id whose live request is cancelled
      reason: why it was withdrawn
      ts: UTC ISO-8601
  extraction_deferred:
    description: >
      A deliberate decision NOT to extract an admitted document, with the reason. Distinct
      from extraction_withdrawn (which cancels a request that was made) and from the absence
      of any event (which means only that nobody has looked). Refused at emit while a live
      request stands. A later extraction_request revives the document.
    required: [document_id, reason, ts]
    properties:
      document_id: doc_id of a manifest-included document that will not be extracted
      reason: why it was declined (e.g. "no consumer")
      ts: UTC ISO-8601
