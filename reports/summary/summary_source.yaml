# The executive summary: its authored prose, the page-2 table, the appendix, and the
# verification dials. Written by Opus 4.8 (role `author`) against DN-014, the accepted brief, by
# cc_tasks/2026-10-12_executive_summary_from_brief_v2.md. Read by scripts/summary_build.py (the
# Markdown and the PDF) and scripts/summary_verify.py (the planted and unsupported checks, and
# Fable's reading). Written before the checks ran; the RESULT quotes it. Nothing here is a
# threshold on a measured result.
#
# A sentence that states a MEASURED result ends with [c:CL-xxx]: the ids of the claims in
# docs/evidence/claims.yaml that support it. A sentence with no marker states what the system is,
# or a principle; its grounding is the capability table (task step 3) and DN-014, not the results
# evidence map, so the unsupported check (which reads claims.yaml) does not judge it. The digit
# check judges EVERY reader-facing sentence of pages 1 and 2: a number in one must be a value of a
# claim the sentence cites. The only count on page 1 is the 16 agencies (DN-014 §6).

title: "SI readiness of federal statistical data: an executive summary"
prepared: "15 October 2026"

inputs:
  claims: docs/evidence/claims.yaml
  frozen: docs/evidence/FROZEN.md
  manifest: corpus/manifest.json
  # Page two is rendered from this grid (scripts/summary_grid.py), not authored in this file.
  grid: reports/summary/grid.json
  # The NAMES table the checker reads: a body code in a claim (CENSUS, BLS) and the name a
  # sentence uses instead; the indicator codes from the framework record. Same files the concise
  # report's run reads, so a sentence that names a body is checked against the claim that codes it.
  body_names: state/scan_targets_fss_2026-09_v5.json
  framework_record: framework/ai_readiness_framework.json

# -------------------------------------------------------------------------- page 1: the message
# Blocks render in order. A `heading` is a short line; a `para` is a list of sentences.
page1:
  - para:
      - "SI readiness is how well an SI system, one that finds, reads and uses data on its own, can reach an agency's data, understand it, and use it correctly."
      - "People increasingly reach official statistics through such systems, so when those systems cannot find or understand federal data, the public is left with stale or second-hand numbers."
      - "SI readiness runs across data publishing, web practice, metadata standards and policy at once and moves fast, so no one person holds all of it, and we meet an SI problem with SI."
  - heading: "What we built"
  - para:
      - "This is a decision support system, not a site checker: it measures what a machine actually meets on an agency's site, rather than what the agency says about itself."
      - "It maps each result onto a readiness framework, built on the four qualities the data nonprofit USAFacts set out (that data be accessible, understandable, accurate and open) with three more added, and puts every result on one standard scale so agencies can be set side by side."
      - "It then says what to fix first for the best value, the cheap high-value fixes before the larger ones, where how much a fix is worth is a rated judgment under a stated rubric, not a measurement."
  - heading: "Who can use it, and why its advice can be trusted"
  - para:
      - "An executive, a site administrator, a data producer or anyone working in the data's life can ask it questions and get answers at their own level, so no one need be expert in every field it touches."
      - "The advice rests on a connected store of the research, standards and policy, which the system reads to give answers with their sources attached."
      - "When newer evidence replaces a source, the store keeps the old one as history but stops it shaping advice."
  - heading: "Measured in three tiers, by who can run them"
  - para:
      - "The checks fall into three tiers by who can run them: a public tier anyone can run with free, open tools; an agency-enabled tier that needs an agency to turn something on; and a paid-tool tier."
      - "The public tier matters most, because it is what any such system, and any member of the public, meets, not only the largest commercial crawlers."
      - "The grid on the next page runs the public tier across every agency, and three findings stand out below."
  - heading: "What we found"
  - para:
      - "This measurement covers all 16 federal statistical agencies. [c:CL-050]"
      - "A plain, identified machine client is frequently refused before it can read anything, and much of what it looks for is not served at all. [c:CL-034, CL-035]"
      - "Resources that agencies do publish often cannot be reached by a machine that starts at the data page. [c:CL-118]"
  - heading: "One caution"
  - para:
      - "Any single score can be gamed, so we design around what the public can actually reach: readiness is judged where real users and their tools meet the data."

# ------------------------------------------------------------------------- page 2: the one grid
# Page two is one grid and nothing else (DN-014 ADDENDUM 01 §2). It is not authored here: the
# build reads reports/summary/grid.json (scripts/summary_grid.py) and renders the 16 agencies
# by the public-tier checks, a glyph and colour in each cell, the fix line under each check, the
# legend and the footnote. The heading is the only prose this file carries for it.
page2:
  heading: "The public tier, agency by agency"
  grid: reports/summary/grid.json

# ------------------------------------------------------------------------------- sources (after)
# DN-014 ADDENDUM 01 §4: the appendix definition and its source paragraph go; the source list
# stays. The sources come after page two.
appendix:
  sources_heading: "Sources"
  # Corpus documents are cited by id; the build reads their title, organisation, year and URL from
  # the manifest. A standard not in the corpus carries its title and URL inline.
  sources:
    - {id: usafacts-fde-standards-detailed}
    - {id: generative-ai-and-open-data-guidelines-and-best-practices-de}
    - {id: nao-216-128-artificial-intelligence-in-noaa}
    - {id: ai-readiness-for-official-data-and-statistics-un-statistical}
    - {id: worldbank-blog-open-data-to-ai-ready-2025}
    - {id: rfc-9727-api-catalog}
    - {id: dcat-us-1-1-schema}
    - {id: schema-org-webapi}
    - {title: "RFC 8288: Web Linking", who: "M. Nottingham", year: "2017", url: "https://www.rfc-editor.org/rfc/rfc8288"}
  provenance: "Measured across all 16 federal statistical agencies in September and October 2026. Every mark in the grid traces to a cell of the published matrices for the cycle of record; the detailed report and the knowledge graph hold the evidence behind each one."

# ----------------------------------------------------------------- verification (summary_verify)
# The planted controls (methodology 7.6): each is a false sentence the checker must label
# `unsupported`. One miss stops the run before the real check is trusted. Each cites a real claim
# so the plant is adversarial (it reads as if that claim backed it).
controls:
  - text: "Every one of the 1,055 checks was refused outright by the host."
    cites: ["CL-035"]
    expect: "unsupported"
  - text: "A machine reaches all 29 of the resources that agencies publish for it from the data page."
    cites: ["CL-118"]
    expect: "unsupported"
  - text: "The Census Bureau passes every one of its 39 published rows."
    cites: ["CL-052"]
    expect: "unsupported"

# Fable (role `judge`) reads the built page 1 and page 2 in a fresh context and answers these four
# each round (DN-014 §4). Editorial review, not a measurement.
reader:
  questions:
    q1: "Can each of these be said from page 1 alone? (a) SI readiness is complex, fast-moving and beyond any one expert, and we use SI to solve it; (b) we built a decision support system that measures a site's real state, maps it to a standard framework, and says what to fix first for the best value; (c) anyone from an executive to a site administrator can ask it questions and get cited explanations at their own level; (d) we ran the public tier on all 16 federal statistical agencies and found standout results. Answer yes or no for each, and name any that cannot."
    q2: "What on page 1 would a chief information officer new to the term SI not understand? List each such thing."
    q3: "What is said twice? Name each point made more than once."
    q4: "What detail could be cut without loss? Name each."
    q5: "Name every term on either page, page 1 or the grid on page 2, that a chief information officer new to the term SI would not already know. List each such term, or say none."

run:
  # The author is Opus 4.8 (this session); the reader is Fable (role `judge`); the checker is a
  # third family, Sonnet (role `critic`), so writer, checker and reader are three model families,
  # as the concise report's pipeline requires. Roles resolve through seldon's lock (AD-035).
  checker_role: critic
  reader_role: judge
  call_class: judge
  run_id: executive_summary_2026-10-14_v3_grid
  ceiling_tokens: 3000000
  timeout_seconds: 900
  max_attempts: 2
  max_wall_seconds: 7200
  progress_every_units: 1
  progress_every_seconds: 60
