- body: data.gov
  name: data.gov
  api:
    value: 'Data.gov Catalog API, two stated routes: keyed v4 at https://api.gsa.gov/technology/datagov/v4/ (replaces CKAN API) and the catalog app''s public JSON API at https://catalog.data.gov (/search)'
    sources:
    - url: https://resources.data.gov/catalog-api/
      passage: 'Base URL: https://api.gsa.gov/technology/datagov/v4/ ... Note: This API replaces the previous CKAN-based API.'
    - url: https://www.data.gov/user-guide/
      passage: The catalog application provides a public JSON API; authentication is not required. The current API documentation is available at https://resources.data.gov/catalog-api/.
    - url: https://catalog.data.gov/openapi.json
      passage: '"title":"Datagov Catalog" ... servers: "https://catalog.data.gov" ... paths include "/search", "/api/organizations", "/api/dataset/{slug_or_id}"'
    note: 'The two official pages conflict: the user guide says no authentication, while the documentation it points to says every request needs an api.data.gov key. catalog.data.gov/openapi.json defines no security scheme. Old CKAN path https://catalog.data.gov/api/3 returns HTTP 404.'
  how_called:
    value: Through api.gsa.gov v4, key required in the X-Api-Key header (DEMO_KEY for exploring); directly on catalog.data.gov, no key
    sources:
    - url: https://resources.data.gov/catalog-api/
      passage: 'All requests must include an API key issued through api.data.gov. ... Sign up for a free API key and include it in the X-Api-Key header with every request. ... For initial exploration, you can use DEMO_KEY without signing up:'
    - url: https://www.data.gov/user-guide/
      passage: The catalog application provides a public JSON API; authentication is not required.
  key_obtained:
    value: api.data.gov signup (first name, last name, email); key is e-mailed and a person must complete the email verification before the key works
    sources:
    - url: https://resources.data.gov/catalog-api/
      passage: Your API key has not been verified yet. Check your email to complete signup.
    - url: https://api.data.gov/static/javascripts/signup_embed.js
      passage: '"First Name" (required); "Last Name" (required); "Email" (required); "How will you use the APIs? (optional)"; "has been e-mailed to you. You can use your API key to begin making web service requests immediately."'
  key_changes:
    value: A personal key lifts DEMO_KEY's much lower limits to the api.data.gov default of 1,000 requests per hour; higher limits by emailing datagovhelp@gsa.gov
    sources:
    - url: https://resources.data.gov/catalog-api/
      passage: DEMO_KEY has much lower rate limits and is not suitable for production use or automated queries. ... If you exceed your limit, you will receive an HTTP 429 Too Many Requests response. The block lifts automatically after one hour. ... If you need higher limits, contact us at datagovhelp@gsa.gov.
    - url: https://api.data.gov/docs/developer-manual/
      passage: 'Rate limits may vary by service, but the defaults are: Hourly Limit: 1,000 requests per hour ... The rate limits for the `DEMO_KEY` are: Hourly Limit: 30 requests per IP address per hour Daily Limit: 50 requests per IP address per day'
    note: resources.data.gov names the X-RateLimit-Limit and X-RateLimit-Remaining headers but no number; the 1,000/hour figure is api.data.gov's default, which it says may vary by service.
  api_data_gov:
    value: 'yes'
    url: https://resources.data.gov/catalog-api/
    passage: This API is accessed through api.data.gov, which manages API keys, rate limiting, and usage tracking.
  announced:
    developer_page:
      value: 'no'
      url: https://www.data.gov/developers/
      note: HTTP 404; https://www.data.gov/developer also 404. API docs live at https://resources.data.gov/catalog-api/, linked from the user guide.
    data_json_lists_api:
      value: 'no'
      url: https://www.data.gov/data.json
      note: HTTP 404; catalog.data.gov/data.json also 404. GSA's inventory https://open.gsa.gov/data.json has a 'Data.gov CKAN API' entry, but its accessURL is the stale http://www.data.gov/developers/apis, not the v4 or catalog.data.gov base.
    well_known_api_catalog:
      value: 'no'
      url: https://www.data.gov/.well-known/api-catalog
      note: HTTP 404; https://catalog.data.gov/.well-known/api-catalog also 404
    data_page_links:
      value: 'no'
      url: https://catalog.data.gov/
      note: No link to an API, API docs or a developer page; only 'Data.gov on Github'. www.data.gov home also has no API link; its User Guide does.
