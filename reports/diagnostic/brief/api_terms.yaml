- body: GSA
  name: General Services Administration
  api:
    value: 'Many GSA APIs listed at open.gsa.gov/api, served under https://api.gsa.gov/; example: Per Diem API at https://api.gsa.gov/travel/perdiem/v2/'
    sources:
    - url: https://open.gsa.gov/
      passage: Explore and access GSA data via dynamic web services.
    - url: https://open.gsa.gov/api/perdiem/
      passage: 'This API has six primary endpoints: https://api.gsa.gov/travel/perdiem/v2/rates/city/{city}/state/{ST}/year/{year}'
  how_called:
    value: Key required on every request, in the x-api-key header or as ?api_key= in the address; DEMO_KEY allowed for samples on some pages
    sources:
    - url: https://open.gsa.gov/api/perdiem/
      passage: To begin using this API, you will need to register for an API Key. After registration, you will need to provide this API key in the `x-api-key` HTTP header or append it to the API URL with every request, e.g., ?api_key={api_key}.
    - url: https://open.gsa.gov/api/datadotgov/
      passage: API key from api.data.gov. For sample purposes, you can use `DEMO_KEY` as an API key.
  key_obtained:
    value: api.data.gov form asks first name, last name, email (use description optional); key is e-mailed; a person must click the emailed verification before an unverified key works
    sources:
    - url: https://api.data.gov/static/javascripts/signup_embed.js
      passage: '"First Name" (required); "Last Name" (required); "Email" (required); "How will you use the APIs? (optional)"; "has been e-mailed to you. You can use your API key to begin making web service requests immediately."'
    - url: https://api.data.gov/docs/developer-manual/
      passage: The API key supplied has not been verified yet. Please check your e-mail to verify the API key.
    note: Field labels come from the signup embed script; the signup pages themselves render only 'Loading signup form...' without JavaScript. Whether verification is enforced depends on the server's verify_email option.
  key_changes:
    value: A personal key gets the default 1,000 requests per hour versus DEMO_KEY's 30 per hour and 50 per day per IP; higher limits by emailing GSA
    sources:
    - url: https://open.gsa.gov/api/perdiem/
      passage: The default rate limit is 1,000 hits per hour. If you need to request a rate limit change, please email us at digitalteam@gsa.gov.
    - url: https://api.data.gov/docs/developer-manual/
      passage: 'Rate limits may vary by service, but the defaults are: Hourly Limit: 1,000 requests per hour ... The rate limits for the `DEMO_KEY` are: Hourly Limit: 30 requests per IP address per hour Daily Limit: 50 requests per IP address per day'
  api_data_gov:
    value: 'yes'
    url: https://open.gsa.gov/api/datadotgov/
    passage: API key from api.data.gov. For sample purposes, you can use `DEMO_KEY` as an API key.
    note: The Per Diem page itself does not name api.data.gov; it embeds a signup form and states the api.data.gov default limit (1,000 per hour).
  announced:
    developer_page:
      value: 'no'
      url: https://www.gsa.gov/developer
      note: HTTP 404; https://www.gsa.gov/developers also 404; https://open.gsa.gov/developer also 404
    data_json_lists_api:
      value: 'yes'
      url: https://open.gsa.gov/data.json
      note: www.gsa.gov/data.json 301s to open.gsa.gov/data.json (DCAT-US 3.0, 756,340 chars, read in 8 WebFetch slices). Entries such as 'Site Scanning API' and 'Regulations.gov API' point at open.gsa.gov/api/ doc pages, not api.gsa.gov bases; no Per Diem API entry seen.
    well_known_api_catalog:
