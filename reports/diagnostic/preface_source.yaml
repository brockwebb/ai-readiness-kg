# The readiness diagnostic package, page one: the preface (DN-016 §3; task b6c65bfe).
#
# This is the AUTHORING SOURCE for the preface. scripts/diagnostic_package_build.py renders it
# into the Word document and the deck. Every number here is a {{result:NAME:value}} token; the
# build computes NAME from the record, the scan frame and the cycle of record and REFUSES to
# render if the token's stated value disagrees with the computed one (the paper-authoring
# discipline, localized: a number never drifts between this file and what the machine measured).
# The user-agent string is validated against the harness configuration it quotes, line and all.
#
# Result tokens used below (the build computes and checks each):
#   checks_total               the number of checks the diagnostic runs
#   bodies_total               Tier-A statistical bodies in the roster
#   flagships_total            Tier-C reference hosts shown beside them
#   surfaces_total             surfaces across the whole frame
#   rate_per_second_per_host   requests per second per host the client holds to
#   crawl_delay_ceiling_s      the Crawl-delay ceiling, above which a host is recorded not measured
#   surfaces_robots_kept_out   surfaces the client's own robots.txt compliance kept it from, on the cycle of record

title: "A readiness diagnostic of federal statistical websites: what the public client is, and what it never does"

# The exact user-agent string, quoted with its configuration location so a security team can
# find every request the diagnostic made in its logs. The build asserts this equals the value at
# the quoted file and line.
user_agent:
  string: "ai-readiness-kg-scanner/0.2 (+https://github.com/brockwebb/ai-readiness-kg)"
  config_file: "assessment/harness/scan/params.yaml"
  config_line: 144

what_it_is: >-
  This is a readiness diagnostic: {{result:checks_total:16}} checks run against the public
  websites of {{result:bodies_total:16}} federal statistical bodies, with
  {{result:flagships_total:3}} reference hosts shown beside them, over a named roster of
  {{result:surfaces_total:72}} surfaces. Each check is one published question about whether a
  machine client can reach, read and use the data. The thing that runs the checks is the public
  client: the least privileged client a member of the public has.

how_it_behaves:
  - "The public client identifies itself in every request by one fixed user-agent string, so a security team can find every request it made in its own logs."
  - "It makes one request per check per surface. It holds to {{result:rate_per_second_per_host:1}} request per second per host, and it waits longer when a host's robots.txt asks it to, up to a ceiling of {{result:crawl_delay_ceiling_s:60}} seconds, above which it records the surface as not measured rather than press on."
  - "It honours robots.txt. On the cycle of record it did not fetch {{result:surfaces_robots_kept_out:16}} surfaces because the host's robots.txt told it not to, and it recorded those as not measured."
  - "At the first rung it presents no credentials of any kind. At the second rung it presents only a key obtained by open public registration."

what_it_never_does:
  - "It submits no form and solves no challenge: no CAPTCHA, no sign-in, no search box filled in."
  - "It runs none of a page's scripts; it reads the page as first served."
  - "It fetches nothing beyond a page's own headers and its body: no files a script would build, no addresses reached only through a tool."
  - "It takes no credential a citizen cannot obtain. A rung that needs an agency to grant what a citizen cannot get for themselves is reported as not measured, refused — never scored."

# DN-015 §6, in plain words. Sourced from the vocabulary file so the preface and the dictionary
# say the states the same way.
four_states_note: >-
  A check comes back in one of four states. A pass means every one of the agency's data pages
  that was looked at met the check; a fail means every one did not; a partial means some met it
  and some did not; and not measured means the public client could not look at one or more pages,
  so that neither "every page passes" nor "every page fails" is established. Not measured has
  three reasons: the host refused the identified client; the client's own robots.txt compliance
  kept it from reading the page; or it could not confirm an absence, or a server or network
  error stopped it. Not measured is never a fail.

two_rungs_note: >-
  The public client runs on a ladder of two rungs. Rung one is anonymous and keyless: it honours
  robots.txt and holds to the standing rate limit. Rung two is the same client registered as any
  member of the public registers, presenting a key obtained by open registration — a good-faith
  handshake, not a barrier. A refusal at rung one with a pass at rung two is reported as both,
  because both are true about the public experience. Rung two is specified here and measured in
  its own later cycle; no rung-two result is shown before one exists.

what_it_is_not: >-
  This diagnostic does not test whether an agent completed a task with the data; that is a later
  level of the framework, not this one.

# Addresses the recurring hostile-reader objection that this is a public league table or a
# pressure campaign (DN-016 §1: the real measurement sends its results to the agency, not the
# public, and this package replaces the imagined picture with the published method).
not_a_league_table: >-
  This is not a public league table, and it is not a campaign to make any agency open its site to
  anyone. The results go to the agency, not to the public. A check that rests on a rule this
  project chose rather than on a published standard is shown for transparency and is not scored as
  a finding about the agency; the method is published here in full so that a reader can see exactly
  what was and was not measured, and argue with it.

# Plain-language glosses for the terms the hostile reader flagged as undefined. Kept out of the
# forbidden-word and bare-number rules by construction (no scan/probe/crawl/audit; numbers spelled
# or omitted; identifiers carry a letter so they are not bare digits).
glossary:
  - term: "media type"
    plain: "the short label a web server sends with a file to say what kind of file it is, such as a spreadsheet, a CSV or a PDF."
  - term: "a page that reports success for an address that does not exist (a soft error page)"
    plain: "a server answering a made-up web address with a normal page instead of a clear not-found message, so a machine cannot tell the address is wrong."
  - term: "OpenAPI or Swagger description"
    plain: "a machine-readable file that lists an interface's available calls, so a program can use the interface without a person reading the documentation first."
  - term: "kibibytes"
    plain: "a unit of file size, close to a kilobyte; used here as a small floor so a stub file is not mistaken for a whole download."
  - term: "a recognised licence identifier"
    plain: "a licence named by a standard short code from a public list, rather than described only in a sentence, so a machine can tell the terms of reuse."
  - term: "a sitemap"
    plain: "a file a site publishes that lists its pages, so a machine can find them without following every link."
  - term: "robots.txt"
    plain: "a file at the top of a site that states, as a policy, which automated clients the site asks to fetch which paths."
  - term: "a structured change feed"
    plain: "a machine-readable list of what changed between releases, in a common subscription format, rather than a change note written only for a person to read."
  - term: "a surface"
    plain: "one web address the diagnostic looks at: a data page, a home page, an interface address, or a well-known path."
  - term: "a rung"
    plain: "one of the two levels of the public client: the first without any key, the second with a key obtained by open public registration."
  - term: "a dataset's release markup"
    plain: "fields embedded in a page that state, for a machine, when the data was published or last changed."
