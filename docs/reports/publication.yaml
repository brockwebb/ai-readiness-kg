# Publication metadata for the L0 report and the site that serves it.
#
# `cc_tasks/2026-09-12_publish_l0.md` decisions 1 and 4, under DN-002. One declaration, read
# by three consumers, so the title page, the citation files and the site index cannot drift:
#
#   scripts/build_l0_report.py   stamps `snapshot_cycle` + the build commit on the title page
#   scripts/build_l0_site.py     writes CITATION.cff, zenodo.json and the site index from it
#   tests/test_publication.py    asserts the three agree with each other and with the graph
#
# Nothing here is a measurement. Every number the report states is a registered Result quoted
# by name; what lives in this file is identity — what the document is, who wrote it, which
# measurement it is a view of.

# The cycle the report is a view of. A RE-JUDGEMENT name: the same stored observations as
# `scan_2026-09-10`, judged under the rules current when the report was written. Declared here
# rather than inferred from the Result names, because a name is not a cycle and inferring one
# from the other is how a report comes to state a cycle it did not measure.
#
# `_rj2` until 2026-09-19. `cc_tasks/2026-09-19_resnapshot_rj4.md` decision 1 moved it to
# `_rj4`, generation 12, because under DN-004 the snapshot moves when a published number would
# change, and three tagged Results and 161 product cells would: the guard, once it walked the
# `SUPERSEDES` chain past `_rj3` to the newest judgement, refused the build.
snapshot_cycle: scan_2026-09-10_rj4

title: "AI readiness of the federal statistical system: host-level findings"

# The version identifier the report carries, per DN-002 decision 5. The snapshot cycle IS the
# version: two builds of the same cycle are the same findings, and a new cycle is a new
# document rather than a new edition of this one.
version: "2026-09-10_rj4"

# The date each version was RELEASED, keyed by version. Every date a published file carries —
# CITATION.cff `date-released`, the Zenodo `publication_date`, the sitemap `lastmod`, the index
# and the report's version block — is read from here and never from the build's clock
# (`cc_tasks/2026-09-21_g4_resourcing_reissue.md`, decision 5 of the task it re-issues).
#
# Why a declaration and not the event log: the log dates the snapshot's JUDGEMENT
# (`events/cycle-scan_2026-09-10_rj4.jsonl`, `finding_derived`, 2026-09-18T14:05Z), and a release
# is a later act — CFF 1.2.0 defines `date-released` as the date the work was released, and
# Zenodo's `publication_date` is the date of publication. Stamping the judgement's date would
# date the release a day before it happened. The log does bound it: the builder refuses a
# release date earlier than the snapshot's last event.
#
# Keyed by version so the date moves when the version does and not otherwise (reproducible-
# builds.org, SOURCE_DATE_EPOCH: an embedded date comes from the source, never the clock). A new
# `version` with no entry here stops the build rather than borrowing the old date.
#
# 2026-09-10_rj4: first published by `f763563` (2026-09-19 13:32Z, cc_tasks/2026-09-19_
# resnapshot_rj4.md), whose build stamped 2026-09-19. A rebuild on 2026-09-20 re-dated it by
# the clock with the version unchanged; this restores it.
released:
  "2026-09-10_rj4": "2026-09-19"

authors:
  - family-names: Webb
    given-names: Brock

# The published tree, as Pages would serve it from `/docs` on the default branch. Recorded so
# the sitemap and the citation files can name absolute URLs without any of them typing a host.
# This is where the tree WOULD be served; whether it IS served is a repository setting and is
# measured, never assumed (`cc_tasks/2026-09-12_publish_l0_RESULT.md` §2).
site_url: "https://brockwebb.github.io/ai-readiness-kg/"

repository_url: "https://github.com/brockwebb/ai-readiness-kg"

abstract: >-
  Host-level AI-readiness findings for the sixteen recognized agencies and units of the US
  federal statistical system, plus three federal reference hosts shown separately. Five
  host-level checks over one measurement cycle with one declared client identity, every
  verdict traceable to the Finding, the rule version and the retained response body that
  produced it. The matrices, the per-check source appendix and every registered Result the
  report quotes are published as data beside it; the PDF is a view of them.

keywords:
  - AI readiness
  - federal statistical system
  - machine-readable data
  - robots.txt
  - data publishing

# The licences, on the operator's own declaration of 2026-09-13
# (`cc_tasks/2026-09-13_ephemeral_provenance_ADDENDUM_1.md`, under DN-002 decision 5). SPDX
# identifiers, because a licence a machine cannot identify is a licence this instrument would
# score as absent on somebody else's site.
#
# Two licences and not one, because this repository publishes two different things: the code
# that measures, and the measurements. `LICENSE` and `LICENSE-DATA` at the repository root are
# the texts; these two fields are what every generated consumer reads, so the declaration and
# the files cannot drift without `tests/test_publication.py` saying so.
license_code: MIT          # assessment/, kg/, scripts/, tests/ and the rest of the Python
license_data: CC-BY-4.0    # docs/reports/, docs/data/, the matrices, the framework record,
                           # the registered Results and the sources appendix

# Said in one sentence wherever the licences are stated, because the corpus is the one part of
# this tree the author cannot license: `corpus/` holds third-party documents, retained under
# their own terms as evidence. Declared here so the sentence has one source.
license_corpus_note: >-
  Documents under corpus/ are third-party works, retained as evidence under their own terms:
  neither licence in this repository applies to them.

# The self-scan cycle whose six tier-0 verdicts the index prints as this site's own row
# (`cc_tasks/2026-09-13_self_row.md` decision 1). DECLARED rather than derived from
# `snapshot_cycle`: the self row is a measurement of the HOST at the moment it was scanned, and
# the report is a view of a measurement of nineteen federal hosts a week earlier. Inferring one
# from the other is how a page comes to print a row under a cycle name that never scanned it.
#
# The site builder reads `state/self_l0_<this>.json`; when the file is absent the index says in
# words that the row is not measured, and never invents a verdict.
self_scan_cycle: self_2026-09-13

# DELIBERATELY ABSENT until the operator sets it, and absent rather than guessed:
#
#   doi      DN-002 decision 5: the mint is the operator's action under his own name. The
#            Zenodo metadata is prepared here and no Zenodo call is made.
