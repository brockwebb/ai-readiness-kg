- id: CL-078
  key: prior_art.pa1
  question: PA1
  text: Structured metadata on a page does not by itself make data usable by machines; discovery, access,
    interpretation and fitness for use are each required.
  status: prior_art
  evidence:
  - kind: document
    id: wilkinson-2016-fair-guiding-principles
    locator: events/batch-006.jsonl:40
    where: Wilkinson et al., Scientific Data 3:160018, PDF p. 3, the 'machine actionable' paragraph
    quote: but not capable of parsing it due to it being in an unknown format
    note: 'The FAIR paper''s machine-actionability continuum: an agent must identify an object, judge
      it useful, judge it usable (licence, consent, access) and act; a machine can reach one step and
      fail the next.'
  - kind: document
    id: wilkinson-2016-fair-guiding-principles
    locator: events/batch-006.jsonl:40
    where: Wilkinson et al., Scientific Data 3:160018, PDF p. 3
    quote: determine if it is usable, with respect to license, consent
  - kind: document
    id: fcsm-19-01-transparent-reporting-for-integrated-data-quality
    locator: events/batch-001.jsonl:34
    where: FCSM 19-01, PDF p. 6
    quote: data quality refers to the data’s “fitness for use” for a user’s own needs
    note: Federal statistical guidance on fitness for use; the same definition is in statistical-policy-working-paper-46-data-quality-assessment
      and w3c-dwbp-2017 §9 (MCP search_text 'fitness for use', six hits).
  numbers: []
  note: 'Corpus first: manifest title scan and MCP search_text (''fitness for use'', ''machine-actionab'');
    both points are in admitted documents, so no web search was run. Not in the corpus and not searched
    on the web because the corpus establishes the point: Juran''s ''fitness for use'' (a book, no fetchable
    page carries the sentence); OMB''s information quality guidelines (the corpus holds the statute, information-quality-act-data-quality-act-sec-515-of-p-l-106,
    not the guidelines).'
  source_task: cc_tasks/2026-10-02_evidence_map_prior_art_v2.md
- id: CL-079
  key: prior_art.pa2
  question: PA2
  text: A federal agency's flagship data product must be listed in its `data.json`.
  status: prior_art
  evidence:
  - kind: document
    id: foundations-for-evidence-based-policymaking-act-of-2018-evid
    locator: events/batch-001.jsonl:52
    where: Evidence Act Title II, the amended 44 U.S.C. § 3511(a)(1), PDF p. 10
    quote: develop and maintain a comprehensive data inventory that accounts for all data assets
    note: 'fss-policy-kg holds the same obligation: Obligation d7b0b83364ef4c66aa6e4718e267ca83 (source_doc
      evidence_act_2018) and 2346470a44d0415e855ad23ce5814085 (source_doc pra_1995_uslm).'
  - kind: document
    id: m-25-05-phase-2-implementation-of-the-evidence-act-open-gove
    locator: events/batch-001.jsonl:48
    where: OMB M-25-05, comprehensive data inventories, (iii) Public Dissemination, PDF p. 10
    quote: 'host it publicly on the agency’s website at the address: www.[agency].gov/data.json'
    note: 'fss-policy-kg: Obligation 069f7c3081b64954b785c34ca1be3c22 (source_doc m_25_05); the inventory
      requirement itself is Obligation 7bf4bc7524e34df9bcdccac539f39ed3 (m_25_05, PDF p. 7: data assets
      held by more than one agency are ''required to be listed independently by each agency'').'
  numbers: []
  note: 'The status rests on the obligation covering every data asset, of which a flagship product is
    one. The statute and the guidance state the obligation for all data assets in the agency''s possession;
    neither names flagship products. M-13-13 and the Project Open Data schema were not searched on the
    web: the current obligation (M-25-05, which names DCAT-US 3.0 as the inventory schema) is in the corpus,
    and the schema documents dcat-us-1-1-schema and dcat-us-3-overview are admitted.'
  source_task: cc_tasks/2026-10-02_evidence_map_prior_art_v2.md
- id: CL-080
  key: prior_art.pa3
  question: PA3
  text: Optimizing published content for machine readers has a named discipline, generative engine optimization,
    which its originators frame as the successor to search engine optimization.
