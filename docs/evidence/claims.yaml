  - kind: citation
    id: oecd2008handbook
    locator: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/08/handbook-on-constructing-composite-indicators-methodology-and-user-guide_g1gh9301/9789264043466-en.pdf
      (§1.6, printed p. 31)
    author: OECD; European Commission Joint Research Centre
    year: '2008'
    title: 'Handbook on Constructing Composite Indicators: Methodology and User Guide'
    venue: OECD Publishing (ISBN 978-92-64-04345-9)
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/08/handbook-on-constructing-composite-indicators-methodology-and-user-guide_g1gh9301/9789264043466-en.pdf
    where: §1.6, printed p. 31
    quote: it could also disguise the absence of a statistical or an empirical basis
    retrieved: 2026-10-02 (WebFetch)
    note: 'The sentence goes on: ''e.g. when there is insufficient knowledge of causal relationships or
      a lack of consensus on the alternative''.'
  - kind: citation
    id: oecd2008handbook
    locator: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/08/handbook-on-constructing-composite-indicators-methodology-and-user-guide_g1gh9301/9789264043466-en.pdf
      (§1.6, printed p. 31)
    author: OECD; European Commission Joint Research Centre
    year: '2008'
    title: 'Handbook on Constructing Composite Indicators: Methodology and User Guide'
    venue: OECD Publishing (ISBN 978-92-64-04345-9)
    url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2008/08/handbook-on-constructing-composite-indicators-methodology-and-user-guide_g1gh9301/9789264043466-en.pdf
    where: §1.6, printed p. 31
    quote: equal weighting does not mean “no weights”
    retrieved: 2026-10-02 (WebFetch)
  numbers: []
  note: 'The Handbook establishes a narrower point: equal weighting is the most common choice in composite
    indicators, and it is the choice made when there is insufficient knowledge of causal relationships
    or no consensus on an alternative. It does not call equal weighting defensible or a default, and it
    says equal weighting is itself a weighting, not the absence of one. The Handbook is not in the corpus:
    the manifest has no entry for it, and docs/design/scoring_model.md line 7 says it is cited by reference.
