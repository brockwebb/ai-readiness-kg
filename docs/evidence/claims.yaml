    note: 'record reason matches `needs a different instrument`; record: cc_tasks/2026-09-17_unassigned_indicators.md
      decision 4: the G1 precedent does not carry it. G1''s act is a preservation score — a pinned consumer
      restates a captured surface and the restatement is scored for what it kept (DD-036 §2). B6 asks
      two different questions about the surface itself: whether the summary is plain language, a readability
      property of the text and not of a restatement, and whether it is current, a freshness comparison
      against the product''s own modified date. Neither is a preservation score, so B6 needs a different
      instrument and stays unassigned. The ''current'' half is the closer of the two to a structured-field
      test: DCAT-US 3 `modified` on the dataset against the summary page''s own date.'
