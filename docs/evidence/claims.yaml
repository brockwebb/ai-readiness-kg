      artifact the crosswalk would be, and no collector reads it. corpus/kernel/sdmx-3-0-section-1-framework.pdf
      (doc_id `sdmx-3-0-section-1-framework`) defines the Structure Map — "Structure maps describes a
      mapping between data structure definitions or dataflows for the purpose of transforming a data set
      into a different structure" — and the representation maps that map value and code lists. No collector
      in docs/design/scan_tool_map.md §1 reads SDMX, so decision 2''s second half fails and the tier stays
      undetermined. Candidate: M, harness_leg, once an SDMX collector exists; the stable-series-ID half
      would be DCAT-US 3 `previousVersion` and `hasCurrentVersion` through `dcat.fetch_catalog`.'
