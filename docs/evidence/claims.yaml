    the summary and brief use the order''s term once, with this citation. Found on the web; not in the
    corpus. ''SI'' stands for ''Super Intelligence''. Searches: WebSearch ''executive order September
    29 2026 artificial intelligence renamed SI''; WebSearch for the Federal Register entry; WebFetch of
    the whitehouse.gov fact sheet, which links the order.'
  source_task: cc_tasks/2026-10-02_evidence_map_prior_art_v2.md
- id: CL-085
  key: prior_art.pa8
  question: PA8
  text: The Department of Commerce's definition of AI-ready data and this project's own statement of what
    it measures are recorded verbatim, side by side.
  status: unsupported
  evidence:
  - kind: citation
    id: airkg2026dn005
    locator: https://github.com/brockwebb/ai-readiness-kg/blob/24315103320dd9bac37f652b7b1ffa854d479d29/docs/design/2026-09-15_DN-005_reorientation_the_framework_is_the_goal.md#L11
      (DN-005 §1, line 11)
    author: Webb, B.
    year: '2026'
    title: 'DN-005: reorientation. The goal is the framework; L0 is one level of it'
    venue: ai-readiness-kg design notes (GitHub)
    url: https://github.com/brockwebb/ai-readiness-kg/blob/24315103320dd9bac37f652b7b1ffa854d479d29/docs/design/2026-09-15_DN-005_reorientation_the_framework_is_the_goal.md#L11
    where: DN-005 §1, line 11
    quote: 'An AI-readiness framework for federal statistical publishers: a way to rate and score, quantitatively
      and qualitatively, whether the public and the tools the public now uses can reach, understand and
      use the data they paid for.'
    retrieved: 2026-10-02 (WebFetch)
    own_text: true
    note: The project's own text, quoted whole. The framework record (framework/ai_readiness_framework.json)
      holds no definition node, so this design note, which CLAUDE.md names as the standing map, is the
      locator.
  - kind: document
    id: nao-216-128-artificial-intelligence-in-noaa
    locator: events/batch-001.jsonl:107
    where: NAO 216-128, Artificial Intelligence in NOAA, definitions (OCR text corpus/noaa_esip/NAO_216-128.ocr.txt)
    quote: Data that is discoverable, machine-readable and machine-understandable
    note: 'The definition of ''AI-Ready Data'' (the OCR reads ''Al-Ready'') continues: ''and has sufficient
      quality, documentation, and access methods to support the full AI application development and use
      life cycle''. NOAA is a Commerce bureau; an NAO is a NOAA order, not the Department''s definition.'
  - kind: document
    id: fcsm-25-03
    locator: events/batch-001.jsonl:1
    where: FCSM 25-03, PDF p. 3
    quote: improve accuracy of AI responses and increase the prioritization of its authoritative data
    note: FCSM 25-03 quoting the Commerce guidance's stated aim; this is its purpose, not its definition.
  numbers: []
  note: 'Unsupported because the Commerce definition was not read in its primary source. Commerce Data
    Governance Board, ''Generative Artificial Intelligence and Open Data: Guidelines and Best Practices''
    (16 January 2025): WebFetch of https://www.commerce.gov/sites/default/files/2025-01/GenerativeAI-Open-Data.pdf
    and of the commerce.gov blog post returned HTTP 403 on 2026-10-02; web.archive.org is refused by the
    harness; fedscoop.com, benton.org, ediscoverytoday.com and the Open Data Policy Lab repository carry
    no verbatim definition. Two WebSearch result summaries attribute to the guidance the phrase ''generative
    AI-ready open data, or open data that can be responsibly and effectively used by generative AI systems''.
    That is a search-index summary, not a reading of the guidance, and it is not cited. Corpus: no admitted
    document quotes the definition (a text scan of every corpus PDF for ''Department of Commerce'', ''Commerce
    Data Governance'' and ''responsibly and effectively used''); building-ai-ready-best-practices-the-work-of-the-commerce-da
    is pending_refetch, not admitted. The project half is recorded above.'
  source_task: cc_tasks/2026-10-02_evidence_map_prior_art_v2.md
- id: CL-086
  key: prior_art.pa9
  question: PA9
  text: Data buried in aggregated spreadsheets is not machine-usable even when published.
  status: prior_art
  evidence:
  - kind: citation
    id: wickham2014tidy
    locator: https://vita.had.co.nz/papers/tidy-data.pdf (§3.1 Column headers are values, not variable
      names)
    author: Wickham, H.
    year: '2014'
    title: Tidy Data
    venue: Journal of Statistical Software 59(10), doi:10.18637/jss.v059.i10
    url: https://vita.had.co.nz/papers/tidy-data.pdf
    where: §3.1 Column headers are values, not variable names
    quote: A common type of messy dataset is tabular data designed for presentation
    retrieved: 2026-10-02 (WebFetch)
    note: Read in the author's copy at the URL; the JSS abstract was confirmed at https://www.jstatsoft.org/article/view/v059i10.
      §3 lists presentation layouts first among the five most common problems with messy datasets, each
      needing tidying before analysis.
  - kind: document
    id: w3c-dwbp-2017
    locator: events/batch-006.jsonl:11
    where: 'W3C Data on the Web Best Practices, Best Practice 12: Use machine-readable standardized data
      formats, Why'
    quote: Posting data in a format that is not machine-readable places severe limitations
    note: The same paragraph separates formats humans can read and edit on a computer from formats that
      are machine-readable.
  numbers: []
  note: 'Neither source says ''not machine-usable'' in those words: Wickham establishes presentation-layout
    tables as a common messy form that must be tidied before analysis, and the W3C Recommendation establishes
    that a format that is not machine-readable limits the data''s usefulness. Corpus: DWBP admitted; Wickham
    not in the corpus (corpus grep ''Wickham'', ''tidy data''). data.gov and Federal Data Strategy guidance
    were not searched: the task says one source suffices.'
  source_task: cc_tasks/2026-10-02_evidence_map_prior_art_v2.md
