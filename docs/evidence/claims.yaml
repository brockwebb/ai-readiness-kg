- id: CL-030
  key: q1.G3
  question: Q1
  text: '`G3` has no measured verdict in the record and can be measured from outside with public tooling
    and no agency action (the record says an admitted standard names the artifact and only a collector
    this project would write is missing); it is to be measured before the summary is drafted (`DN-009
    decision 6`).'
  status: needs_measurement
  evidence:
  - kind: indicator
    id: ind:G3
    locator: framework/ai_readiness_framework.json#ind:G3
    note: 'record reason matches `no collector reads it`; record: cc_tasks/2026-09-17_unassigned_indicators.md
      decision 5: a corpus document names the artifact the crosswalk would be, and no collector reads
      it. corpus/kernel/sdmx-3-0-section-1-framework.pdf (doc_id `sdmx-3-0-section-1-framework`) defines
      the Structure Map — "Structure maps describes a mapping between data structure definitions or dataflows
      for the purpose of transforming a data set into a different structure" — and the representation
      maps that map value and code lists. No collector in docs/design/scan_tool_map.md §1 reads SDMX,
      so decision 2''s second half fails and the tier stays undetermined. Candidate: M, harness_leg, once
      an SDMX collector exists; the stable-series-ID half would be DCAT-US 3 `previousVersion` and `hasCurrentVersion`
      through `dcat.fetch_catalog`.'
  - kind: query
    id: mcp.get_requirements
    locator: scripts/build_evidence_map.py::QUERIES['mcp.get_requirements']
    note: get_requirements(indicator='G3')
