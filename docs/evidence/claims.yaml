      a machine-readable suppression or disclosure field. The search that failed: `suppress`, `confidential`
      and `disclosure` across corpus/kernel, corpus/crosswalk and corpus/components — the only hit is
      bing-webmaster-guidelines, on search-result suppression — and across the SDMX 3.0 §1 and DDI codebook
      texts. The indicator''s own source, `usafacts-ai-ready-data-guide`, asks publishers to "Properly
      identify and document suppressed data (e.g., in very small counties) in plain language with unique
      identifiers": plain language is the prose this indicator says it strengthens, and the field that
      would replace it does not exist in any admitted document. Stays unassigned.'
    routes: []
