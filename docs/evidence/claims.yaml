      1'
    quote: we introduce Generative Engine Optimization (GEO), the first novel paradigm
  - kind: document
    id: aggarwal-2024-geo-generative-engine-optimization
    locator: events/batch-006.jsonl:39
    where: same, §2.2 Generative Engine Optimization, PDF p. 3
