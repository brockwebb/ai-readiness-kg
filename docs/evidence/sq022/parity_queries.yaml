  # run_cypher, the assessment build's corpus reads (scripts/run_kg_questions.py; $params inlined as literals)
  - {id: C01, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py epoch()",
     args: {query: "MATCH (d:Document) WHERE d.doc_id IS NOT NULL RETURN d.doc_id AS id, coalesce(d.content_hash, '') AS h ORDER BY id"}}
  - {id: C02, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py epoch()",
     args: {query: "MATCH (d:Definition) WITH count(d) AS defs MATCH (i:Instrument) RETURN defs, count(i) AS instruments"}}
  - {id: C03, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py Q1_CYPHER",
     args: {query: "MATCH (d:Definition) WHERE toLower(coalesce(d.term, '')) =~ '.*\\\\b(ai|artificial intelligence)[- ]read(y|iness)\\\\b.*' OR toLower(coalesce(d.term, '')) =~ '.*\\\\bread(y|iness) for (ai|artificial intelligence)\\\\b.*' OPTIONAL MATCH (doc:Document)-[:DEFINES]->(d) RETURN properties(d) AS p, doc IS NOT NULL AS defines_edge"}}
  - {id: C04, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py Q1_TEXT_NET_CYPHER",
     args: {query: "MATCH (d:Definition) WHERE (toLower(d.verbatim_text) =~ '(?s).*\\\\b(ai|artificial intelligence)[- ]read(y|iness)\\\\b.*' OR toLower(d.verbatim_text) =~ '(?s).*\\\\bread(y|iness) for (ai|artificial intelligence)\\\\b.*') AND NOT (toLower(coalesce(d.term, '')) =~ '.*\\\\b(ai|artificial intelligence)[- ]read(y|iness)\\\\b.*' OR toLower(coalesce(d.term, '')) =~ '.*\\\\bread(y|iness) for (ai|artificial intelligence)\\\\b.*') RETURN d.key AS key, d.term AS term ORDER BY key"}}
  - {id: C05, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py Q2_STRUCTURE_CYPHER",
     args: {query: "OPTIONAL MATCH (c:Construct) WITH count(c) AS constructs OPTIONAL MATCH (:Construct)-[g:GROUNDS]->(:Definition) WITH constructs, count(g) AS grounds OPTIONAL MATCH (d:Definition)-[x]-(k:Concept) RETURN constructs, grounds, count(x) AS definition_concept_edges"}}
  - {id: C06, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py Q3_CYPHER",
     args: {query: "MATCH (a)-[r:CONFLICTS_WITH]->(b) RETURN labels(a)[0] AS label, properties(a) AS a, properties(b) AS b, r.prov_method AS method"}}
  - {id: C07, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py Q4_CYPHER",
     args: {query: "MATCH (i:Instrument) WHERE toLower(i.name) =~ '.*(readiness|ai-ready|ai ready).*' OPTIONAL MATCH (i)-[:MEASURES]->(c:Concept) WITH i, collect(DISTINCT c.name) AS direct OPTIONAL MATCH (i)-[:USES_MEASURE]->(m:Measure) OPTIONAL MATCH (m)-[:MEASURES]->(mc:Concept) RETURN properties(i) AS p, direct, count(DISTINCT m) AS measures, collect(DISTINCT mc.name) AS via_measures"}}
  - {id: C08, verb: run_cypher, layer: corpus, source: "scripts/run_kg_questions.py Q4_STRUCTURE_CYPHER",
     args: {query: "OPTIONAL MATCH (:Instrument)-[o:OPERATIONALIZES]->() WITH count(o) AS operationalizes OPTIONAL MATCH (:Framework)-[f:OPERATIONALIZED_BY]->(:Instrument) RETURN operationalizes, count(f) AS operationalized_by"}}
