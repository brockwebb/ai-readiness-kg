# SQ-022 Part C: the pre-registered parity set (squiddy DN-049 R-210 as amended; squiddy
# cc_tasks/2026-10-22_SQ-022_ai_readiness_graph_in_its_own_neo4j_database_parity_proved_consumer_repointed.md).
#
# COMMITTED BEFORE ANY ANSWER FROM THE NEW DATABASE (`ai-readiness`) WAS READ, and never edited after (squiddy
# docs/S-008_rules.md). A correction is a new file beside this one, with its reason, and both are reported.
#
# WHAT RUNS. Every airkg verb with fixed arguments, drawn from the server's own tests (tests/test_mcp_server.py) and its
# documentation generator (mcp/airkg_doc.py), plus `run_cypher`'s corpus queries: the Cypher scripts/run_kg_questions.py
# issues through mcp/airkg_tools.Graph (the assessment build's corpus reads, R-210 first clause), the two corpus queries
# the docs record, and one count per corpus label and per corpus edge type.
#
# TWO CONFIGURATIONS, one verb layer (mcp/airkg_tools.Tools):
#   old: assessment layer and corpus layer both read from `seldon-ai-readiness-kg` (today's server).
#   new: assessment layer from `seldon-ai-readiness-kg`; corpus layer (get_document, search_text's definition layer,
#        and run_cypher's corpus queries) from `ai-readiness`. The assessment layer reaches the corpus only at Document
#        by doc_id (EVIDENCED_BY, EVIDENCED_BY_INTERNAL, OBSERVED_ON), so only the corpus side changes. get_evidence
#        reads no corpus label (Finding -> SUPPORTS <- Observation; `surface_doc_id` is a string, never traversed), so
#        it has no corpus side and runs on the assessment database in both.
# Every call runs in a fresh Tools per configuration, from one process, in the order listed.
#
# THE TWO STORES NAME PROPERTIES DIFFERENTLY, by the transcription (squiddy tools/sq019_transcribe_schema.py, recorded
# on every slot), and nothing else differs by design. The new configuration's corpus reads use the kit's names; the
# answers are compared after this map is applied to the NEW side (kit name -> old name):
dialect:
  node_key: {old: key, new: id}                       # `<doc_id>::<item_id>`; a Document's is its doc_id in both
  quote: {old: grounding_span, new: grounding_text}  # the verbatim quote; the kit's `grounding_span` is the located span
  renamed_properties:                                 # kit -> old, for properties(n) maps
    grounding_text: grounding_span
    instrument_method: method
    extraction_event_id: prov_extraction_event_id
    item_id: id
  # run_cypher's corpus queries are written in the old store's names; the new configuration runs each with these
  # textual substitutions, and only these (word-bounded, on the property access `.<name>`):
  cypher_rewrite:
    ".key": ".id"
    ".grounding_span": ".grounding_text"

# CANONICALIZATION, applied to both sides before comparing:
canonicalize:
  # names of the store that answered: different by construction, never compared
  store_identity_fields: [database]
  store_identity_locators: "a locator {kind: graph, id_property: database} is compared without its id"
  # properties that point into a store's OWN ledger or are its merge bookkeeping: the old store's event ids and its
  # `key` (= its merge key, equal to `id`); the kit's ledger stamps (asserted_at, prov_wasGeneratedBy, provided_by,
  # category, squiddy_class, status, method, prov_extractor*, prov_run_id, name on a Document, batch, chunk_id,
  # source_item, source_changed, span_ambiguous, span_raw_equal, grounding_span as offsets). Excluded from
  # properties(n) maps on both sides; listed so that no other property is.
  store_bookkeeping_properties:
    old: [key, prov_manifest_event]
    new: [asserted_at, prov_wasGeneratedBy, provided_by, category, squiddy_class, status, method, prov_extractor,
          prov_extractor_version, prov_run_id, batch, chunk_id, source_item, source_changed, span_ambiguous,
          span_raw_equal, grounding_span, prov_timestamp]
  # a property the NEW side holds and the old does not is an addition and is reported, not counted as a difference:
  # parity is that every answer the old store gave, the new store gives
  new_only_properties: reported
  lists: "sorted by their canonical JSON wherever the verb or query does not ORDER BY; ORDER BY lists keep order"
  locators: "compared by (kind, label, id) after the dialect map; id_property is store dialect"

# TRACING. A difference is TRACED when every item behind it is a kept-out item, by key, in squiddy
# docs/evidence/sq022/adopt/kept_out.jsonl (the R-217 re-admission's list; SQ-019's is docs/evidence/sq019/), or a
# DI-003 derived edge declared in the kit graph's config (this graph declares none). "The items behind" a difference:
#   - a count: the symmetric difference of the two stores' item sets under the same pattern, by key;
#   - a list of rows: the rows on one side only, by their node key (or edge triple);
#   - a limited list: a row on the new side only is DISPLACED (traced) when the old store holds it too beyond the limit
#     and every old-side-only row is traced;
#   - a property value: never traced by an item; an untraced difference.
# An item present in the NEW store and absent from the OLD is never traced (nothing kept out explains an addition) and is
# reported as such. Pass: untraced = 0 for every call. Untraced > 0 is the task's stop before Part D.
kept_out: /Users/brock/GitHub/squiddy/docs/evidence/sq022/adopt/kept_out.jsonl

