# ---------------------------------------------------------------------------------------------- named action rows
# Addendum decision 11. robots.txt has record Actions (A4); they are tagged, not duplicated. llms.txt has none.
named_rows:
  robots_txt:
    tags: [act:a4-serve-a-robots-txt-that-names-ai-crawlers, act:a4-allow-the-data-paths-for-named-ai-crawlers]
    citations: [rfc9309_unavailable, openai_bots, anthropic_bots, perplexity_bots, google_extended, bingbot, ccbot, applebot]
  llms_txt:
    id: named:llms-txt
    title: 'Publish an /llms.txt at the site root'
    indicator: A5
    also_moves: [A9]
    what_would_have_to_be_done: 'Publish a markdown file at /llms.txt that names the product and links its machine-readable distributions, as the llms.txt proposal describes.'
    who_does_it: publisher
    technique_class: publish_new_file
    citations: [llmstxt_proposal, ahrefs_llmstxt_2026]
    searches: 'corpus: `llms.txt` across the admitted documents (8 hits, none a measurement of consumption; the Akamai docs and Cloudflare pages SERVE llms.txt indexes, which is publication, not consumption). web: "llms.txt adoption AI crawlers actually request llms.txt measured server logs study"; "Ahrefs llms.txt study 137,000 domains 97% zero requests"; primary read: ahrefs.com/blog/llmstxt-study/.'

# ---------------------------------------------------------------------------------------------- front door
# Decision 13. A vendor is "named" only by these readings; everything else in a header is ignored.
front_door:
  vendors: [cloudflare, akamai, cloudfront, fastly, incapsula, imperva, sucuri, azure]
  header_values_read: [server, via, x-cache, x-cdn, x-served-by]
  header_names_read: true          # a header whose NAME carries a vendor token (akamai-grn, x-azure-ref)
  refusal_statuses: [401, 403, 429]
  ignored: 'content-security-policy, report-to, reporting-endpoints, set-cookie and every other header value: they name script origins, cookies or report sinks, not the front. `varnish` is cache software, not a vendor.'
