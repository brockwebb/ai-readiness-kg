# ---------------------------------------------------------------------------------------------- searched methods
# Rows for indicators, or unmeasured halves, the record leaves without a method (decision 3: corpus first,
# then the web). `row_source: catalog_search` unless the record itself names the method.
methods:
  - indicator: B6
    route: wcag_reading_level
    method_kind: roll_your_own
    method: 'reading level of the summary against WCAG 2.1 SC 3.1.5, and the summary page''s date against DCAT-US 3 `modified`'
    who_can_run: public_outside_in
    spec_locator: 'https://www.w3.org/WAI/WCAG21/Understanding/reading-level.html'
    spec_quote: 'more advanced than the lower secondary education level'
    row_source: catalog_search
    note: 'the record says B6 needs a different instrument (ind:B6.tier_unassigned_reason) and names the DCAT-US 3 `modified` half; the reading-level half is a W3C success criterion, found on the web. A corpus search for `readability`, `plain language` and `plain writing` found no test (hits: REST "readability", digital.gov page-description guidance).'
  - indicator: G5
    route: sdmx_conf_status
    method_kind: roll_your_own
    method: 'per-observation confidentiality status read from the SDMX cross-domain code list CL_CONF_STATUS, where the product is published in SDMX'
    who_can_run: public_outside_in
    spec_locator: 'https://sdmx.org/news/cl_conf_status-1-4/'
    spec_quote: 'provides coded information about the sensitivity and confidentiality status of the data'
    row_source: catalog_search
    note: 'the record says no admitted document names a machine-readable suppression field (ind:G5.tier_unassigned_reason, searches on corpus/kernel, crosswalk, components and the SDMX 3.0 §1 and DDI texts). The SDMX cross-domain code list does, on the web. It is not admitted, so the record is unchanged; a write-back is a later task.'
  - indicator: G3
    route: sdmx_structure_map
    method_kind: roll_your_own
    method: 'read SDMX Structure Maps and representation maps for a crosswalk across a classification or geography change'
    who_can_run: public_outside_in
    spec_locator: 'corpus/kernel/sdmx-3-0-section-1-framework.pdf (doc_id sdmx-3-0-section-1-framework), as quoted in ind:G3.tier_unassigned_reason'
    spec_quote: 'Structure maps describes a mapping between data structure definitions or dataflows'
    row_source: record
    note: 'the record names the artifact and says no collector reads it'
  - indicator: D3
    route: prov_walk
    method_kind: roll_your_own
    method: 'walk `wasDerivedFrom` on the catalog records the D3 rule already fetches, from collection through processing'
    who_can_run: public_outside_in
    spec_locator: 'framework/ai_readiness_framework.json#ind:D3 (requirement_none_reason); corpus/crosswalk/w3c-prov-o-ontology.html'
    spec_quote: ''
    row_source: record
    note: 'the unmeasured half; the record says it is a rule this project would write'
  - indicator: B1
    route: unmeasured_half
    method_kind: none_known
    method: 'whether the linked dictionary or listed variables are comprehensive'
    who_can_run: needs_standard
    failed_searches: 'record: "No admitted document defines a test for it" (ind:B1.requirement_none_reason)'
    row_source: record
  - indicator: B2
    route: unmeasured_half
    method_kind: none_known
    method: 'the versioned clause of the concept definitions'
    who_can_run: needs_standard
    failed_searches: 'record: "The ''versioned'' clause has no field in any admitted document" (ind:B2.requirement_none_reason)'
    row_source: record
  - indicator: B4
    route: unmeasured_half
    method_kind: none_known
    method: 'the suppression-rules clause'
    who_can_run: needs_standard
    failed_searches: 'record: "The suppression-rules clause has no field in any admitted document" (ind:B4.requirement_none_reason; the search is on ind:G5.tier_unassigned_reason). The SDMX CL_CONF_STATUS row on G5 may reach it; not decided here.'
    row_source: record
  - indicator: G4
    route: unmeasured_half
    method_kind: none_known
    method: 'the statutory-mandate and statistical-versus-administrative clauses'
    who_can_run: needs_standard
    failed_searches: 'record: "The statutory-mandate and statistical-versus-administrative clauses have no field in any admitted document" (ind:G4.requirement_none_reason)'
    row_source: record

# ---------------------------------------------------------------------------------------------- enablers
# Decision 4. Each is a lead. `links` join to indicators: existing_node (a requirement node in the record),
# proposed_link (would need a new node), unsupported (no source establishes the capability for that indicator).
enablers:
  - id: enabler:google-search-console
    name: 'Google Search Console, a verified property'
    method_kind: tool_commercial
    who_can_run: agency_enabled
    url: 'https://developers.google.com/search/docs/monitor-debug/search-console-start'
    step: {source: gsc_start, quote: 'Verify site ownership'}
    who_acts: 'the site owner verifies the property; the report is read by or shared with the assessor'
    capabilities:
      - {source: gsc_start, quote: 'show what structured data Google could or couldn''t read from your site', indicators: [A6], link: proposed_link}
      - {source: gsc_start, quote: 'gives you an overview of all the pages Google indexed or tried to index', indicators: [A5], link: proposed_link}
      - {source: gsc_crawl_stats, quote: 'statistics about Google''s crawling history on your website', indicators: [A11], link: proposed_link}
      - {source: google_ai_features, quote: 'included in the overall search traffic', indicators: [C4], link: unsupported, note: 'AI Overviews and AI Mode are counted inside overall search traffic, so the report cannot isolate AI citations'}
    requirements: []
