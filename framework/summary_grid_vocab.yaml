# Plain-language names for the executive-summary grid (DN-014 ADDENDUM 01 §3, task
# 2026-10-14_executive_summary_v3_grid). AUTHORED content, not tunable parameters: the strings a
# reader sees in place of the record's codes. Applied to framework/ai_readiness_framework.json by
# scripts/apply_grid_plain_names.py, through the single writer (framework_writeback.save), never
# by hand. scripts/summary_grid.py reads the names back FROM the record, not from here.
#
# Constraints every string here already satisfies (the summary text check enforces them on the
# built page): no indicator code (a letter A-G and one or two digits), no process word, no "AI"
# outside a published title, no en/em dash, and — for a grid cell — no digit at all.

# display_name on each measurement tier (the record's `tier` property values). DN-014 §5's three
# tiers by who can run them; the grid shows the first.
tier_display_names:
  public: "public tier"
  agency_instrumented: "agency-enabled tier"
  paid: "paid-tool tier"

# `declared: true` on every rule that records what an agency DECLARES rather than what a machine
# met (ADDENDUM §2 and §3): A11 measures the declared layer only; E2/E4/E7/F1/F5 are
# declaration-basis indicators. Excluded from the grid.
declared_codes: [A11, E2, E4, E7, F1, F5]

# plain_name on every public-tier rule the grid shows (the grid's 13 columns). Rewritten by task
# db464d5f (DN-015) from each instrument entry's `claims.pass`, so a name states only what a pass
# asserts, at most eight words; the entries in assessment/instrument/ are the source, and
# scripts/apply_instrument_state.py refuses to write while this file disagrees with them.
plain_names:
  A1: "Page links a structured data file"
  A2: "OpenAPI description served at the recorded API address"
  A3: "Page links an archive or large unfiltered file"
  A4: "robots.txt permits eight listed crawler tokens"
  A5: "The site's sitemap lists the data page"
  A6: "Page markup declares a named, described dataset"
  A8: "Markup dates the data; a latest-version link resolves"
  A9: "A probed machine address returns non-HTML content"
  A10: "Data tool answers with real status and content"
  B3: "Page links a methodology readable as text"
  D1: "Page or API terms name a recognised licence"
  D4: "Agency's data.json inventory lists this page, validly"
  F4: "Change history served as a structured feed"

# fix_line (one imperative sentence, no codes) on every action a grid rule's failing outcomes map
# to. The grid shows ONE per column: the fix for the outcome the most agencies hit on that check
# (scripts/summary_grid.py picks it). Keyed by the record's Action node id.
fix_lines:
  # A1
  act:a1-publish-a-structured-distribution: "Publish the product as a structured download beside the PDF."
  act:a1-serve-the-data-files-with-their-own-media-type: "Link a data file from the product page and serve it with its own media type."
  # A2
  act:a2-serve-a-parseable-api-description-at-the-documented-path: "Serve a parseable interface description where the interface is documented."
  act:a2-expose-an-api-and-publish-its-description: "Publish a machine-readable description of the data interface where the interface is served."
  # A3
  act:a3-add-a-whole-product-download-beside-the-query-builder: "Add a whole-product download beside the query builder."
  act:a3-publish-the-complete-file-not-a-sample: "Publish the complete product, not a sample extract."
  act:a3-link-a-bulk-download-from-the-product-page: "Link a bulk download of the product from the product page."
  # A4 (no "AI" on the page: the body uses "machine crawlers")
  act:a4-serve-a-robots-txt-that-names-ai-crawlers: "Serve a robots.txt that permits the data paths for the crawlers you want to allow."
  act:a4-allow-the-data-paths-for-named-ai-crawlers: "Allow the product's data paths for the machine crawlers you intend to serve."
  # A5
  act:a5-list-the-product-url-in-the-sitemap: "List the product address in the discovery file that is already served."
  act:a5-publish-a-sitemap-and-point-robots-txt-at-it: "Publish a sitemap and point robots.txt at it."
  # A6
  act:a6-type-the-product-page-as-a-dataset: "Type the product page's existing markup as a dataset."
  act:a6-embed-json-ld-on-the-product-page: "Embed structured markup describing the product on the product page."
  act:a6-make-the-dataset-markup-conform-to-the-profile: "Make the dataset markup conform to the profile it declares."
  # A8
  act:a8-declare-the-product-vintage-in-the-markup: "Declare the product's vintage in the markup, not only in a file header."
  act:a8-publish-a-release-date-for-the-product: "Publish the product's release date in the page's structured markup."
  act:a8-serve-a-stable-latest-url-on-the-product-host: "Serve a stable latest address for the product on its own host."
  act:a8-make-the-latest-pointer-resolve: "Make the latest-vintage pointer resolve."
  # A9
  act:a9-return-a-machine-format-at-the-machine-path: "Return a machine format at the paths advertised for machines."
  act:a9-publish-a-machine-first-entry-point: "Publish a machine-first entry point for the product."
  # A10
  act:a10-return-a-real-status-for-routes-that-do-not-exist: "Return a real status for routes that do not exist."
  act:a10-make-the-product-deep-link-resolve: "Make the product's own deep link resolve."
  act:a10-serve-the-product-content-before-javascript-runs: "Serve the product's content in the first response, before scripts run."
  # B3
  act:b3-serve-the-methodology-without-javascript: "Serve the methodology document without requiring a script to run."
  act:b3-publish-the-methodology-in-structured-text: "Publish the methodology in structured text beside the PDF."
  act:b3-link-the-methodology-from-the-product-page: "Link the methodology from the product page."
  act:b3-publish-a-methodology-document-reachable-from-the-product: "Publish a methodology document reachable from the product surface."
  # D1
  act:d1-state-the-licence-as-an-identifier: "State the licence as an identifier, not as a sentence."
  act:d1-publish-a-machine-readable-licence: "State the product's licence or public domain status in its machine-readable metadata."
  # D4
  act:d4-make-the-catalog-conform-to-dcat-us: "Make the public data catalog conform to its published schema."
  act:d4-add-the-product-to-the-public-data-inventory: "Add the product to the public data inventory already published."
  act:d4-publish-a-data-json-inventory: "Publish a machine-readable data inventory on the host."
  # F4
  act:f4-carry-a-revision-class-on-every-changelog-entry: "Carry a revision class on every change-history entry."
  act:f4-serve-the-changelog-in-a-machine-readable-format: "Serve the change history in a machine-readable format as well as a page."
  act:f4-publish-a-version-history-endpoint: "Publish a version history for the product."

# ---------------------------------------------------------------------------------------------
# The readiness diagnostic package's rendered vocabulary (DN-016 ruling 1; task b6c65bfe). Every
# render of the package (the Word dictionary, the deck, the preface) reads these, so the terms
# change in one place. The run is a *readiness diagnostic*; its unit is a *check* (DN-015's noun);
# the thing that runs it is the *public client*. The words "scan", "probe", "crawl" and "audit"
# do NOT appear in any rendered product (the code keeps `scan` in its paths); `forbidden_words`
# is read by the vocabulary test, scripts/diagnostic_package.py::banned_hits.
diagnostic_terms:
  run: "readiness diagnostic"
  unit: "check"
  actor: "public client"
  forbidden_words: [scan, probe, crawl, audit]
  # A check whose instrument plain name (from the audit, used by the summary grid) carries a
  # forbidden word gets a diagnostic-only name here, by leg. A9's instrument name is "A probed
  # machine address returns non-HTML content"; "probed" is forbidden in a rendered product, so
  # the diagnostic renders the name below. The instrument entry and the summary grid are
  # unchanged — this override is the diagnostic package's rendered term (DN-016 ruling 1).
  plain_name_overrides:
    A9: "A machine address returns a non-page file"
  # DN-015 §6: four states, named in plain words. "not measured" carries its three reasons.
  states:
    pass: "every one of the agency's data pages that was looked at met the check"
    partial: "some data pages met it and some did not"
    fail: "every data page that was looked at did not meet the check"
    not_measured:
      label: "not measured"
      meaning: >-
        the public client could not look at one or more pages, so neither "every page passes"
        nor "every page fails" is established
      reasons:
        - "the host refused the identified client"
        - "the client's own robots.txt compliance kept it from reading the page"
        - "it could not confirm an absence, or a server or network error stopped it"
  # DN-016 ruling 2: the client ladder.
  rungs:
    rung_one: >-
      anonymous, no key, honours robots.txt, one request per check per surface at the standing
      rate limit — the least privileged client the public has
    rung_two: >-
      registered as any member of the public registers, presenting a key obtained by open
      registration (a good-faith handshake, not a block); specified now, measured in its own cycle
