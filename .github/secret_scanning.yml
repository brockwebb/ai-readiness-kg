# Secret-scanning path exclusions.
#
# `corpus/evidence/scan/` is the one `corpus/` lane this repo tracks, and it is tracked
# deliberately: invariant 3 and DD-058 require that a verdict's evidence be held, and the
# sha256 of the retained bytes IS the identifier every `observation_recorded` event cites.
# The bodies are verbatim captures of public federal web pages.
#
# Federal home pages ship third-party PUBLIC API tokens to every visitor, and a scanner that
# retains whole bodies captures them along with everything else. Cycle 3 (2026-09-09) was the
# first to include a host that does it: eight bodies from `www.nist.gov` each carry NIST's
# own Mapbox `pk.` token out of `nist_map.mapbox_access_token`. GitHub classified it as a
# "Mapbox Secret Access Token" — a prefix false positive, since `pk.` is Mapbox's PUBLIC
# token class and `sk.` is the secret one. The whole store contains zero `sk.` tokens and
# exactly one distinct `pk.` token, and no credential of this project has ever been committed.
#
# The alternative to this exclusion is redaction, which changes the bytes, changes the digest,
# and severs eight Observations from their evidence. A false positive is not worth a broken
# audit trail. Recorded in `cc_tasks/2026-09-08_scan_run_3b_RESULT.md` §9.
#
# Scope note: `corpus/evidence/frame/` and `corpus/quarantine/evidence_scan_fixture/` hold
# third-party captures for the same reason and are NOT excluded here. They have not blocked a
# push; if one does, the decision is the same one and belongs on this list.
paths-ignore:
  - "corpus/evidence/scan/**"
