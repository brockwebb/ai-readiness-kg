[project]
name = "ai-readiness-kg"
version = "0.1.0"
description = "Validity-layer knowledge graph under the FSS AI readiness survey and definitions work."
requires-python = ">=3.10"
# Runtime deps. pyyaml reads kg/schema.yaml's nested node/edge catalogue in the extraction
# module (eventlog/manifest stay stdlib-only). The Anthropic client is NOT a hard dependency:
# the extraction model runs on Claude Max OAuth and is imported lazily only at pilot runtime.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
]
# The read-only MCP server over the graph (`mcp/`, cc_tasks/2026-09-17_mcp_over_the_graph.md).
# OPTIONAL, not a runtime dependency: the extraction pipeline, the projection and the whole
# test suite run without either package, and `mcp/airkg_server.py` is the only code that
# imports fastmcp. Both are already installed in /opt/anaconda3/bin/python3, which is the
# interpreter `.mcp.json` names and the one CLAUDE.md names for projection.
#   fastmcp  the server framework the fss-policy-kg server already uses here (Standard 7:
#            adopted, not rebuilt). Pinned to 3.x: 4.0 is out and untested against this.
#   neo4j    the driver. `Graph` is the only place it is imported in this directory.
mcp = [
    "fastmcp>=3,<4",
    "neo4j>=5",
]

[tool.pytest.ini_options]
markers = ["live_plan: reads the real frozen burn plan and event log",
           "slow: runs a control fixture at the REAL standing rate, or replays the whole event log"]
testpaths = ["tests"]
