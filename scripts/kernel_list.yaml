# Kernel list for cc_tasks/2026-08-21_v03_visibility_kernel.md Phase 2.
# Transcribed from the task's "Kernel list" section. Consumed by scripts/harvest_kernel.py.
#
# Per entry:
#   doc_id          slug (lowercase-hyphen); becomes the staging filename stem
#   title           as the steward/publisher names it (not paraphrased)
#   primary_url     URL of record (the page the citation points at)
#   pdf_url         optional; when set, the PDF is fetched instead of the HTML page
#   source_type     standard | federal | academic | industry | practitioner
#                   (task categories map: standards+stewards -> standard; platform-official -> industry;
#                    research -> academic; federal -> federal; tool docs -> industry; SME -> practitioner)
#   clause          a-e of the inclusion rule (docs/research/2026-08-21_kernel_inclusion_rule.md)
#   authors_or_org  steward / publisher / author list
#   crwl_params     optional crawl4ai CrawlerRunConfig params passed to `crwl -c` (e.g. render waits for JS-only pages)
#   fetcher         optional override: crwl (default for HTML) | httpx_dom (httpx + DOM->markdown; needed when
#                   the page challenges headless browsers, or when an `extent` trim is configured) | raw (text/plain)
#   extent          optional AUTH-4 extent trim (only for httpx_dom): drop_h2 = list of regexes matched against
#                   h2 headings; the whole h2 section is dropped. extent_note is recorded verbatim in the register.
#   extent_note     human-readable statement of the extent decision
#   task_note       discrepancies between the task's wording and what is live (reported in the sub-RESULT)
#   task_item       the task-list bullet this entry transcribes
#
# Entries with `already_manifested: true` are registered excluded_by_rule / already_manifested and never fetched.

settings:
  user_agent: "WintermuteAcceptance/0.1 (research; brockwebb45@gmail.com)"
  discovered_via: "kernel-list-2026-08-21"
  max_doc_chars: 250000        # AUTH-4 MAX_DOC_CHARS
  min_content_chars: 200       # min-content guard (task step 3)
  timeout_seconds: 60
  retries: 1
  spacing_seconds: 1.0
  crwl_timeout_seconds: 180
  # crawl4ai content filter used for fit_markdown (boilerplate stripping done by crwl, not by hand)
  crwl_filter: {type: pruning, query: null, threshold: 0.48}
  # if fit_markdown is shorter than this fraction of raw_markdown, keep raw_markdown (pruning over-stripped).
  # 0.05 chosen after inspection: Google Search Central and Intercom help pages carry 80-95% navigation by
  # character count, and their fit_markdown at 0.06-0.22 of raw was the complete article in every case checked.
  fit_min_fraction_of_raw: 0.05
  # markers that identify an anti-bot challenge interstitial rather than the page
  challenge_markers: ["Performing security verification", "Ray ID:", "Just a moment...", "Verifying you are human"]

