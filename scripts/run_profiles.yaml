# Bulk-extraction run profiles (task 2026-08-21_v03_visibility_kernel, Phase 4/5).
# Each profile is one corpus epoch + one event shard + one raw-response dir + one STOP file.
# The runner selects a profile with --profile; `default` names the profile used when the
# flag is absent so existing launchd fires keep their v1 behavior byte-for-byte.
# Per-doc oversize clearances are ledgered operator decisions and live here as data, not
# in code (standard 2). The kernel profile deliberately has NO allowlist (AUTH-4: oversize
# specs are manifested at stated extent or registered oversize_needs_clearance, never
# cleared whole).
default: v1

profiles:
  v1:
    corpus_epoch: v1
    batch: 4                                   # events/batch-004.jsonl
    raw_dir: events/raw/bulk_v1
    stop_file: events/bulk_v1_STOP.json
    result_file: cc_tasks/2026-07-05_airkg_bulk_extraction_v1_RESULT.md
    job: airkg-extraction-burn
    order: alphabetical                        # BURN_ORDER=size_desc still overrides
    oversize_allow:
      - ai-watch-revisiting-technology-readiness-levels-for-relevant   # cleared 2026-07-07
      - arm-ai-readiness-index                                         # 2026-07-08 boost
      - nist-ai-rmf-playbook                                           # 2026-07-08 boost
      - building-an-ai-ready-public-workforce                          # 2026-07-09 boost v3
      - fcsm-20-04-a-framework-for-data-quality                        # 2026-07-09 boost v3
      - introducing-the-oecd-ai-capability-indicators                  # 2026-07-09 boost v3
      - fcsm-19-01-transparent-reporting-for-integrated-data-quality   # 2026-07-16 operator clearance

  kernel_v03:
    corpus_epoch: kernel-v03
    batch: 6                                   # events/batch-006.jsonl — kernel manifest + extraction shard
    raw_dir: events/raw/kernel_v03
    stop_file: events/kernel_v03_STOP.json
    result_file: docs/research/2026-08-21_v03_burn_progress.md
    job: airkg-kernel-burn
    # Phase 5 rate-gated ordering: inclusion-rule clause priority (a..e), then char count
    # ascending. Clause is read from each doc's manifest_add event (acquisition.clause).
    order: clause_then_size_asc
    oversize_allow: []

  # Overnight burn 2026-08-26 (Lane 3): triage-epoch extraction under the corrected
  # v0.3.4 prompt. The template sha is PINNED (Lane 0 rule): apply_profile refuses to run
  # if kg/extraction/prompt_template.md no longer hashes to this value, so the profile can
  # never silently run under a drifted prompt. Lanes 1/2 read the same pin via this profile.
  reextract_v034:
    # HISTORY (ADDENDUM-01): pinned to the frozen v0.3.4 template copy; superseded by
    # reextract_v035 below after the 2026-08-27 pilot FAIL diagnosis.
    corpus_epoch: triage-2026-08-24
    batch: 15                                  # events/batch-015.jsonl — triage extraction shard
    raw_dir: events/raw/triage_extract
    stop_file: events/triage_extract_STOP.json
    result_file: docs/research/2026-08-27_triage_extract_progress.md
    job: airkg-triage-burn
    order: clause_then_size_asc
    oversize_allow: []
    prompt_template: kg/extraction/prompt_template_v0_3_4.md
    template_sha256: 08ffe96416f061201fedb2fb9f520d1315a3e555f285f1f0b7f8f90e6e7165b4

  # ADDENDUM-01 (2026-08-27): v0.3.5 prompt — positive Instrument criterion, first
  # grounding rule (node span contains name), truncation fallback. Same triage epoch,
  # shard, and dirs as v034; this is the operative extraction profile.
  reextract_v035:
    corpus_epoch: triage-2026-08-24
    batch: 15
    raw_dir: events/raw/triage_extract
    stop_file: events/triage_extract_STOP.json
    result_file: docs/research/2026-08-27_triage_extract_progress.md
    job: airkg-triage-burn
    order: clause_then_size_asc
    oversize_allow: []
    prompt_template: kg/extraction/prompt_template.md
    template_sha256: 77acbee6feda897c3abd93a4af3ac086a68df8de7a2cec4dfa0678d78d3ed78e

  # Chunked-extraction pilot (task 2026-08-27_chunked_pilot §3). The ONLY variable under test
  # is the unit the model sees: same model (claude-opus-5, effort unchanged), same schema,
  # same rules — chunked_template.md is prompt_template.md v0.3.5 with the framing swapped and
  # nothing else. The template sha is pinned exactly as the v034/v035 profiles pin theirs, so
  # the arm can never silently run under a drifted prompt.
  chunked_v035:
    corpus_epoch: chunked-2026-08-27
    batch: 16                                  # events/batch-016_chunked_v035.jsonl (TAGGED —
    shard_tag: chunked_v035                    # an experiment arm, never replayed into the graph)
    raw_dir: events/raw/chunked_v035
    stop_file: events/chunked_v035_STOP.json
    result_file: cc_tasks/2026-08-27_chunked_pilot_RESULT.md
    job: airkg-chunked-pilot
    order: alphabetical
    oversize_allow: []
    prompt_template: kg/extraction/chunked_template.md
    template_sha256: 64421ec2a615a4cf05a4f19033ab5e8eae95826320bbbb3c4c044c0c11d8528b
