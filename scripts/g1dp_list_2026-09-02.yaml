#
# The skeleton (§5d G1, §9) records DP documentation as a gap and the probe-family task
# forbids inventing a DP example: the DP_NOISE fixture class is built only from an admitted
# Census Bureau Disclosure Avoidance System document. Step 0's named lookup resolved the
# current handbook as "Disclosure Avoidance for the 2020 Census: An Introduction" (Nov 2021),
# which carries the published privacy-loss budget (global rho 2.56 / epsilon 17.14 / delta
# 10^-10 for the P.L. 94-171 person file; rho 0.07 / epsilon 2.47 for units), the
# per-geography rho allocations, and user-facing accuracy statements (e.g. 90 percent of
# counties within ±4 people of the published total). Same standing path as
# scripts/g1eval_list_2026-09-02.yaml (harvest_triage.py, then manifest_triage.py).
#
# Companion brief C2020BR-04 ("How the TopDown Algorithm Works", Mar 2023) was read at step 0
# and NOT staged: it describes the mechanism qualitatively and carries no parameter values
# beyond what the handbook publishes (R1_no_marginal_contribution).

