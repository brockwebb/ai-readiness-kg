    verdict: fetch
    clause: R1
    construct_arm: publication_actionability
    grounding_surface: document
    gap: true
    cluster: seo_aio_geo
    notes: "Kernel inclusion rule clause (a): a normative specification. WG-adopted successor vocabulary to ad-hoc robots.txt AI directives; the corpus holds RFC 9309, the Web Bot Auth draft and llms.txt but not the IETF work that supersedes their AI-preference semantics."

