    authors_or_org: ["Andrea Volpini", "Elie Raad", "Beatrice Gamba", "David Riccitelli"]
    year: "2026"
    source_type: academic
    primary_url: https://arxiv.org/abs/2603.10700
    pdf_url: https://arxiv.org/pdf/2603.10700
    verdict: fetch
    clause: R1
    construct_arm: publication_actionability
    grounding_surface: document
    gap: true
    cluster: seo_aio_geo
    notes: "Controlled experiment on whether schema.org markup and dereferenceable entity pages improve agentic retrieval. The corpus holds seven schema.org type pages as normative surfaces but no measurement of whether publishing them changes machine consumption; this is that measurement."

  # ------------------------------------------------------------------ normative specs
