# Document.construct_arm backfill rule — task 2026-08-24_source_triage, Phase 0 (schema v0.3.3).
# Read by scripts/annotate_construct_arm.py, which writes one `document_annotation` event per
# included document to events/batch-014.jsonl. Rule per the task file:
#   - kernel-v03 epoch members -> publication_actionability unless obviously otherwise
#     (overrides listed below, each with its reason)
#   - v1 epoch members -> tagged per document by title/abstract rule; every v1 doc_id is
#     listed under exactly one arm below (the listing IS the log; the annotate script
#     refuses to run if any included v1 doc is missing or double-listed)
# The operator reviews the decision table (docs/research/2026-08-24_triage_backfill_report.md)
# and overrides by a follow-up annotation event, never by editing history.

rule_version: "2026-08-24.1"
task: cc_tasks/2026-08-24_source_triage.md

kernel_default: publication_actionability
kernel_default_rationale: >-
  kernel-v03 is the machine-visibility / machine-actionability corpus (DD-009): SEO/GEO,
  crawler and platform behavior, web/metadata standards, federal digital guidance — all
  about making published data and content discoverable, retrievable, and interpretable
  by machine consumers.

# No kernel overrides after review of all 63 member titles: every kernel-v03 member is
# machine-visibility / publication-side. (The one candidate, `what-is-ai-ready-data`
# [IBM, definitional], is NOT an included document — it sits in the ledger as
# pending/excluded — so it takes no backfill annotation.)
kernel_overrides: {}

# v1 epoch (71 docs). Classing rule applied by title/abstract:
#   publication_actionability — the document's primary subject is the quality, documentation,
#     dissemination, or machine consumption of PUBLISHED (mostly federal/official) data.
#   training_data_readiness — the document defines, measures, or frames data-readiness
#     constructs for data as AI input (DRL lineage, AIDRIN, readiness surveys).
#   org_maturity — organizational/institutional AI-readiness instruments, indexes, maturity
#     models, definitional governance statements (incl. federal AI governance statutes,
#     EOs and OMB AI memos: they govern institutional adoption, not data publication).
