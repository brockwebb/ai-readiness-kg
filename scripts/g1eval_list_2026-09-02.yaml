    construct_arm: publication_actionability
    grounding_surface: document
    gap: true
    notes: "Offers an explicit taxonomy of numeric hallucination in LLM summaries of number-heavy documents (Claude 2, GPT-4) and a computational framework for characterizing numeric use in summaries. A taxonomy is a construct contribution under R1."

  - row: 9
    doc_id: lee-2026-when-summaries-distort-decisions
